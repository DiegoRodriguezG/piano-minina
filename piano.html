<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Piano · Minina te Amooo ✨</title>
<link rel="manifest" href="/piano-minina/manifest.json">
<meta name="theme-color" content="#7c3aed">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Piano ✨">
<link rel="apple-touch-icon" href="/piano-minina/icon-192.png">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='4' width='28' height='24' rx='2' fill='%23bf7af0'/%3E%3Crect x='4' y='6' width='3' height='14' rx='1' fill='white'/%3E%3Crect x='8' y='6' width='3' height='14' rx='1' fill='white'/%3E%3Crect x='12' y='6' width='3' height='14' rx='1' fill='white'/%3E%3Crect x='16' y='6' width='3' height='14' rx='1' fill='white'/%3E%3Crect x='20' y='6' width='3' height='14' rx='1' fill='white'/%3E%3Crect x='24' y='6' width='3' height='14' rx='1' fill='white'/%3E%3Crect x='6' y='6' width='2.5' height='9' rx='1' fill='%230c001e'/%3E%3Crect x='10' y='6' width='2.5' height='9' rx='1' fill='%230c001e'/%3E%3Crect x='18' y='6' width='2.5' height='9' rx='1' fill='%230c001e'/%3E%3Crect x='22' y='6' width='2.5' height='9' rx='1' fill='%230c001e'/%3E%3C/svg%3E">
<style>
:root {
  --bg:      #070010;
  --bg2:     #0e0022;
  --bg3:     #170035;
  --bg4:     #220048;
  --border:  rgba(168, 85, 247, 0.28);
  --accent:  #d18af5;
  --accent2: #f472b6;
  --gold:    #fde68a;
  --text:    #f3e8ff;
  --muted:   #9333ea;
  --muted2:  #c084fc;
  --success: #a7f3d0;
  --error:   #fca5a5;
  --sidebar: 305px;
  --gp: rgba(209,138,245,0.35);
  --gm: rgba(244,114,182,0.28);
}
html { font-size: 18px; }
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#070010;
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  display:flex;min-height:100vh;overflow-x:hidden;position:relative;
}
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse at 12% 35%, rgba(139,92,246,.22) 0%, transparent 52%),
    radial-gradient(ellipse at 88% 68%, rgba(219,39,119,.16) 0%, transparent 46%),
    radial-gradient(ellipse at 52% 8%,  rgba(109,40,217,.2)  0%, transparent 42%),
    radial-gradient(ellipse at 72% 92%, rgba(192,132,252,.13) 0%, transparent 40%);
  animation:auroraBreath 20s ease-in-out infinite alternate;
}
@keyframes auroraBreath{
  0%  {opacity:.7;filter:hue-rotate(0deg)}
  50% {opacity:1; filter:hue-rotate(25deg)}
  100%{opacity:.8;filter:hue-rotate(-12deg)}
}

/* ── AURORA BLOBS ── */
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.aurora::before{
  content:'';position:absolute;width:720px;height:720px;border-radius:50%;
  background:radial-gradient(circle,rgba(139,92,246,.2) 0%,transparent 70%);
  top:-200px;left:-160px;
  animation:auroraFloat1 24s ease-in-out infinite alternate;
}
.aurora::after{
  content:'';position:absolute;width:620px;height:620px;border-radius:50%;
  background:radial-gradient(circle,rgba(236,72,153,.16) 0%,transparent 70%);
  bottom:-160px;right:-110px;
  animation:auroraFloat2 30s ease-in-out infinite alternate;
}
@keyframes auroraFloat1{0%{transform:translate(0,0) scale(1)} 100%{transform:translate(260px,190px) scale(1.45)}}
@keyframes auroraFloat2{0%{transform:translate(0,0) scale(1)} 100%{transform:translate(-210px,-170px) scale(1.35)}}

/* ── SIDEBAR ── */
#sidebar{
  width:var(--sidebar);min-width:var(--sidebar);
  background:rgba(6,0,16,.94);
  border-right:1px solid rgba(168,85,247,.22);
  display:flex;flex-direction:column;
  position:fixed;top:0;left:0;height:100vh;overflow-y:auto;z-index:50;
  backdrop-filter:blur(18px);
  box-shadow:5px 0 40px rgba(139,92,246,.14);
}
#sidebar::-webkit-scrollbar{width:3px}
#sidebar::-webkit-scrollbar-thumb{background:rgba(192,132,252,.3);border-radius:2px}
.sb-logo{
  padding:20px 18px 15px;
  border-bottom:1px solid rgba(192,132,252,.15);
  background:linear-gradient(160deg,rgba(139,92,246,.18),rgba(219,39,119,.08),transparent);
  position:relative;overflow:hidden;
}
.sb-logo::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(209,138,245,.7),transparent);
}
.sb-logo h1{
  font-size:1.28rem;font-weight:800;letter-spacing:.5px;
  background:linear-gradient(135deg,#fff,var(--accent));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.sb-logo p{font-size:.86rem;color:var(--muted2);margin-top:4px;font-style:italic;opacity:.85}
.sb-progress-wrap{padding:12px 16px;border-bottom:1px solid rgba(192,132,252,.1)}
.sb-progress-label{font-size:.82rem;color:var(--muted2);text-transform:uppercase;letter-spacing:1px;margin-bottom:5px}
.sb-progress-bar{height:4px;background:rgba(42,14,90,.7);border-radius:2px;overflow:hidden}
.sb-progress-fill{
  height:100%;
  background:linear-gradient(90deg,var(--accent),var(--accent2),var(--accent));
  background-size:200% 100%;border-radius:2px;transition:width .5s;
  animation:progressShimmer 2.5s linear infinite;
  box-shadow:0 0 10px var(--gp);
}
@keyframes progressShimmer{0%{background-position:0% 0%}100%{background-position:200% 0%}}
.sb-progress-count{font-size:.86rem;color:var(--accent);margin-top:4px}
.sb-modules{padding:8px 0 24px}
.sb-module-title{padding:14px 18px 5px;font-size:.78rem;text-transform:uppercase;letter-spacing:1.4px;color:var(--muted2);font-weight:700;opacity:.65}
.sb-lesson{display:flex;align-items:center;gap:10px;padding:11px 16px;cursor:pointer;border-left:3px solid transparent;transition:all .18s;font-size:.96rem;color:var(--muted2)}
.sb-lesson:hover{background:rgba(209,138,245,.08);color:var(--text)}
.sb-lesson.active{background:rgba(209,138,245,.16);border-left-color:var(--accent);color:#fff;box-shadow:inset 0 0 20px rgba(209,138,245,.06)}
.sb-lesson.done{color:var(--text)}
.sb-lesson.locked{opacity:.28;cursor:not-allowed}
.sb-dot{width:8px;height:8px;border-radius:50%;border:1.5px solid rgba(168,85,247,.4);flex-shrink:0;transition:all .25s}
.sb-lesson.done .sb-dot{background:var(--success);border-color:var(--success);box-shadow:0 0 7px rgba(167,243,208,.6)}
.sb-lesson.active .sb-dot{background:var(--accent);border-color:var(--accent);animation:dotPulse 2s ease-in-out infinite}
.sb-lesson.locked .sb-dot{border-color:rgba(168,85,247,.2)}
@keyframes dotPulse{0%,100%{box-shadow:0 0 5px var(--accent),0 0 10px rgba(209,138,245,.3)}50%{box-shadow:0 0 10px var(--accent),0 0 22px rgba(209,138,245,.55)}}

/* ── MAIN ── */
#main{margin-left:var(--sidebar);flex:1;min-height:100vh;display:flex;flex-direction:column;position:relative;z-index:1}
#lesson-container{flex:1;padding:84px 56px 70px;max-width:980px;width:100%}

/* ── METRO BAR ── */
#metro-bar{
  position:fixed;top:0;left:var(--sidebar);right:0;height:60px;
  background:rgba(6,0,16,.93);
  border-bottom:1px solid rgba(168,85,247,.22);
  z-index:150;display:flex;align-items:center;
  overflow-x:auto;overflow-y:hidden;user-select:none;
  backdrop-filter:blur(14px);
  box-shadow:0 2px 24px rgba(139,92,246,.18);
}
#metro-bar::-webkit-scrollbar{height:0}
.mb-group{display:flex;align-items:center;gap:8px;padding:0 14px;border-right:1px solid rgba(168,85,247,.15);height:100%;flex-shrink:0}
.mb-label{font-size:.72rem;text-transform:uppercase;letter-spacing:1px;color:var(--muted2);white-space:nowrap}
#metro-toggle{
  width:40px;height:40px;border-radius:50%;
  border:1.5px solid var(--accent);background:rgba(209,138,245,.1);color:var(--accent);
  font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .2s;box-shadow:0 0 14px rgba(209,138,245,.2);
}
#metro-toggle:hover{box-shadow:0 0 22px var(--gp)}
#metro-toggle.active{background:var(--accent);color:#070010;box-shadow:0 0 22px var(--gp)}
.metro-beat-dot{width:8px;height:8px;border-radius:50%;background:rgba(168,85,247,.2);transition:background .06s,transform .07s;flex-shrink:0}
.metro-beat-dot.beat1{width:10px;height:10px}
.metro-beat-dot.lit{background:var(--accent2);transform:scale(1.4);box-shadow:0 0 7px var(--gm)}
.metro-beat-dot.lit1{background:var(--accent);transform:scale(1.6);box-shadow:0 0 12px var(--gp)}
#metro-bpm-val{font-size:1rem;font-weight:700;color:#fff;width:38px;text-align:center;background:none;border:none;outline:none;cursor:text;font-family:monospace;-moz-appearance:textfield}
#metro-bpm-val::-webkit-inner-spin-button,#metro-bpm-val::-webkit-outer-spin-button{-webkit-appearance:none}
#metro-bpm-slider{width:80px;accent-color:var(--accent)}
#metro-vol{width:56px;accent-color:var(--accent)}
.mb-btn{padding:5px 12px;border-radius:12px;border:1px solid rgba(168,85,247,.25);background:transparent;color:var(--muted2);font-size:.82rem;cursor:pointer;transition:all .15s;white-space:nowrap;line-height:1.7}
.mb-btn:hover{border-color:rgba(209,138,245,.6);color:var(--accent);box-shadow:0 0 10px rgba(209,138,245,.15)}
.mb-btn.sel{background:rgba(209,138,245,.18);border-color:rgba(209,138,245,.6);color:var(--accent);font-weight:600;box-shadow:0 0 8px rgba(209,138,245,.2)}
.mb-btn.tap{color:var(--accent2);border-color:rgba(244,114,182,.35)}
.mb-btn.tap:active{transform:scale(.88)}
.mb-spacer{flex:1;min-width:8px}

/* ── LESSON CHROME ── */
.lesson-badge{display:inline-flex;align-items:center;gap:8px;font-size:.88rem;text-transform:uppercase;letter-spacing:1.4px;color:var(--muted2);margin-bottom:12px}
.badge-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--gp);animation:dotPulse 2s ease-in-out infinite}
.lesson-title{
  font-size:2.4rem;font-weight:800;line-height:1.2;margin-bottom:10px;
  background:linear-gradient(135deg,#fff 0%,var(--accent) 40%,var(--accent2) 68%,var(--gold) 100%);
  background-size:250% auto;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  animation:shimmerTitle 7s linear infinite;
}
@keyframes shimmerTitle{0%{background-position:0% center}100%{background-position:250% center}}
.lesson-subtitle{font-size:1.08rem;color:var(--muted2);margin-bottom:26px;font-style:italic;opacity:.9}
.theory-text{font-size:1.05rem;line-height:2;color:#ede9fe;margin-bottom:22px}
.theory-text b{color:#fff;text-shadow:0 0 14px rgba(209,138,245,.35)}
.theory-text em{color:var(--accent2)}
.theory-text p{margin-bottom:14px}

/* ── PIANO WRAP ── */
.piano-wrap{
  background:rgba(9,0,22,.92);
  border:1px solid rgba(209,138,245,.3);
  border-radius:20px;padding:22px;margin-bottom:28px;
  position:relative;overflow:hidden;
  box-shadow:0 0 50px rgba(139,92,246,.2),0 0 100px rgba(139,92,246,.07),inset 0 1px 0 rgba(255,255,255,.05);
  backdrop-filter:blur(6px);
}
.piano-wrap::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--accent),var(--accent2),var(--accent),transparent);
  animation:linePulse 3.5s ease-in-out infinite;
}
.piano-wrap::after{
  content:'';position:absolute;bottom:0;left:25%;right:25%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(209,138,245,.35),transparent);
}
@keyframes linePulse{0%,100%{opacity:.45}50%{opacity:1}}
.piano-label{font-size:.8rem;text-transform:uppercase;letter-spacing:1.4px;color:var(--muted2);margin-bottom:14px;font-weight:700}

/* ── CALLOUT / INSIGHT / MAGIC ── */
.callout{
  background:rgba(9,0,22,.88);
  border:1px solid rgba(168,85,247,.26);
  border-radius:14px;padding:18px 22px;margin-bottom:22px;
  font-size:1rem;color:#ede9fe;line-height:1.85;
  box-shadow:0 0 22px rgba(139,92,246,.09),inset 0 1px 0 rgba(255,255,255,.04);
  backdrop-filter:blur(5px);
}
.callout b{color:#fff}
.callout em{color:var(--accent2)}
.insight{
  display:flex;align-items:flex-start;gap:14px;
  background:rgba(9,0,22,.88);
  border-left:3px solid var(--gold);border-radius:0 14px 14px 0;
  padding:16px 20px;margin-bottom:22px;
  font-size:1rem;color:#ede9fe;line-height:1.82;
  box-shadow:-5px 0 28px rgba(253,230,138,.18),0 0 22px rgba(139,92,246,.08);
  backdrop-filter:blur(5px);
}
.insight-icon{font-size:1.3rem;flex-shrink:0}
.insight b{color:#fff}
.magic-box{
  background:linear-gradient(135deg,rgba(88,28,135,.32),rgba(126,34,206,.22),rgba(219,39,119,.14));
  border:1px solid rgba(209,138,245,.42);
  border-radius:20px;padding:24px 28px;margin-bottom:28px;
  position:relative;overflow:hidden;
  box-shadow:0 0 50px rgba(139,92,246,.2),inset 0 1px 0 rgba(255,255,255,.06);
}
.magic-box::before{
  content:'✨';position:absolute;top:16px;right:20px;font-size:1.6rem;
  animation:sparkleFloat 4s ease-in-out infinite;
}
.magic-box::after{
  content:'';position:absolute;width:300px;height:300px;border-radius:50%;
  background:radial-gradient(circle,rgba(209,138,245,.16) 0%,transparent 70%);
  top:-90px;right:-90px;pointer-events:none;
  animation:orbDrift 16s linear infinite;
}
@keyframes sparkleFloat{0%,100%{transform:scale(1) rotate(0deg);opacity:.6}50%{transform:scale(1.35) rotate(22deg);opacity:1}}
@keyframes orbDrift{0%{transform:rotate(0deg) translateX(18px)}100%{transform:rotate(360deg) translateX(18px)}}
.magic-box h3{font-size:1.05rem;color:var(--accent2);margin-bottom:12px;text-transform:uppercase;letter-spacing:1.2px;position:relative;z-index:1;text-shadow:0 0 12px rgba(244,114,182,.4)}
.magic-box p{font-size:1rem;color:#ede9fe;line-height:1.78;position:relative;z-index:1}

/* ── EXERCISES ── */
.ex-box{
  background:rgba(11,0,26,.92);
  border:1px solid rgba(168,85,247,.24);
  border-radius:18px;padding:22px 26px;margin-bottom:18px;
  box-shadow:0 0 26px rgba(139,92,246,.09);
  backdrop-filter:blur(5px);
}
.ex-question{font-size:1.08rem;color:#fff;margin-bottom:18px;line-height:1.68}
.ex-options{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.ex-opt{
  padding:10px 22px;border-radius:22px;
  border:1px solid rgba(168,85,247,.28);background:rgba(9,0,22,.85);
  color:var(--text);font-size:.96rem;cursor:pointer;transition:all .18s;
}
.ex-opt:hover{border-color:var(--accent);color:var(--accent);box-shadow:0 0 18px rgba(209,138,245,.22);transform:translateY(-1px)}
.ex-opt.correct{background:rgba(167,243,208,.12);border-color:var(--success);color:var(--success);box-shadow:0 0 16px rgba(167,243,208,.22)}
.ex-opt.wrong{background:rgba(252,165,165,.1);border-color:var(--error);color:var(--error)}
.ex-feedback{font-size:.96rem;font-weight:600;min-height:22px}
.ex-feedback.ok{color:var(--success);text-shadow:0 0 12px rgba(167,243,208,.45)}
.ex-feedback.fail{color:var(--error)}

/* ── BUTTONS ── */
.btn-play{
  display:inline-flex;align-items:center;gap:7px;
  background:rgba(209,138,245,.1);border:1px solid rgba(209,138,245,.45);
  color:var(--accent);padding:8px 20px;border-radius:22px;
  font-size:.92rem;cursor:pointer;transition:all .22s;
  margin-right:8px;margin-bottom:8px;
  box-shadow:0 0 14px rgba(209,138,245,.12);
}
.btn-play:hover{background:rgba(209,138,245,.22);box-shadow:0 0 26px rgba(209,138,245,.32);transform:translateY(-1px)}
.btn-complete{
  display:flex;align-items:center;gap:8px;margin-top:30px;
  padding:15px 36px;
  background:rgba(167,243,208,.1);border:1px solid rgba(167,243,208,.4);
  color:var(--success);border-radius:30px;
  font-size:1.02rem;cursor:pointer;transition:all .22s;
  position:relative;overflow:hidden;
  box-shadow:0 0 18px rgba(167,243,208,.12);
}
.btn-complete::after{
  content:'';position:absolute;top:-50%;left:-65%;width:55%;height:200%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.1),transparent);
  transform:skewX(-18deg);
  animation:btnShimmer 4.5s ease-in-out infinite;
}
@keyframes btnShimmer{0%{left:-65%}55%,100%{left:135%}}
.btn-complete:hover{background:rgba(167,243,208,.18);box-shadow:0 0 32px rgba(167,243,208,.25);transform:translateY(-1px)}
.btn-complete.done{opacity:.3;cursor:default;pointer-events:none}

/* ── SECTION HEADER ── */
.section-header{display:flex;align-items:center;gap:14px;margin-bottom:18px;margin-top:30px}
.section-header h2{font-size:1.28rem;color:var(--accent2);font-weight:700;white-space:nowrap;text-shadow:0 0 16px rgba(244,114,182,.4)}
.section-header .line{flex:1;height:1px;background:linear-gradient(90deg,rgba(168,85,247,.5),transparent)}

/* ── SCALE STEPS ── */
.scale-steps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px;align-items:flex-end}
.scale-step{display:flex;flex-direction:column;align-items:center;gap:3px}
.scale-note{
  width:54px;height:54px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:1rem;
  border:2px solid rgba(209,138,245,.5);color:var(--accent);
  background:rgba(209,138,245,.08);cursor:pointer;transition:all .2s;
}
.scale-note:hover{background:var(--accent);color:#070010;border-color:var(--accent);box-shadow:0 0 22px var(--gp);transform:scale(1.12)}
.scale-note.tonic{background:var(--accent);color:#070010;border-color:var(--accent);box-shadow:0 0 20px var(--gp)}
.scale-interval{font-size:.75rem;color:var(--muted2);text-align:center}
.scale-finger{font-size:.82rem;color:var(--gold);font-weight:700;text-shadow:0 0 8px rgba(253,230,138,.5)}

/* ── CHORD GRID ── */
.chord-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;margin-bottom:26px}
.chord-card{
  background:rgba(11,0,26,.92);border:1px solid rgba(168,85,247,.22);
  border-radius:18px;padding:16px;cursor:pointer;transition:all .2s;text-align:center;
  backdrop-filter:blur(5px);
}
.chord-card:hover{border-color:rgba(209,138,245,.55);transform:translateY(-3px);box-shadow:0 0 26px rgba(139,92,246,.22)}
.chord-card h3{font-size:1.25rem;color:#fff;margin-bottom:4px}
.chord-card p{font-size:.9rem;color:var(--muted2);margin-bottom:8px}

/* ── SPARKLES & MAGIC PARTICLES ── */
.sparkle-dot{position:fixed;border-radius:50%;pointer-events:none;z-index:1}
.sparkle-cross{position:fixed;pointer-events:none;z-index:1;font-size:12px;opacity:0}
@keyframes sparkle1{0%,100%{opacity:0;transform:scale(0)}40%,60%{opacity:1;transform:scale(1)}}
@keyframes sparkle2{0%{opacity:0;transform:translateY(0) scale(0)}15%{opacity:1;transform:translateY(-8px) scale(1)}100%{opacity:0;transform:translateY(-70px) scale(.2)}}
@keyframes sparkle3{0%,100%{opacity:0;transform:scale(0) rotate(0deg)}50%{opacity:.9;transform:scale(1) rotate(180deg)}}

/* ── MISC ── */
.btns-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.finger-table{width:100%;border-collapse:collapse;font-size:.97rem;margin-bottom:20px}
.finger-table th{color:var(--accent2);font-size:.84rem;text-transform:uppercase;letter-spacing:1px;padding:10px 12px;border-bottom:1px solid rgba(168,85,247,.2);text-align:left}
.finger-table td{padding:10px 12px;border-bottom:1px solid rgba(168,85,247,.1);color:#ede9fe}
.finger-table tr:last-child td{border-bottom:none}
.finger-table .hl{color:#fff;font-weight:700}

/* ── FADE IN ── */
@keyframes fadeInUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.lesson-badge,.lesson-title,.lesson-subtitle{animation:fadeInUp .3s ease both}
.theory-text{animation:fadeInUp .35s .05s ease both}
.piano-wrap{animation:fadeInUp .4s .08s ease both}

<script>
// ═══════════════════════════════════════════
// AUDIO ENGINE
// ═══════════════════════════════════════════
var _actx = null;
function actx() {
  if (!_actx) _actx = new (window.AudioContext || window.webkitAudioContext)();
  if (_actx.state === 'suspended') _actx.resume();
  return _actx;
}
function playPiano(midi, dur, vel) {
  dur = dur || 2.0; vel = vel || 0.6;
  var ctx = actx();
  var now = ctx.currentTime;
  var freq = 440 * Math.pow(2, (midi - 69) / 12);
  var masterGain = ctx.createGain();
  masterGain.connect(ctx.destination);
  masterGain.gain.setValueAtTime(0, now);
  masterGain.gain.linearRampToValueAtTime(vel, now + 0.005);
  masterGain.gain.exponentialRampToValueAtTime(vel * 0.4, now + 0.08);
  masterGain.gain.exponentialRampToValueAtTime(vel * 0.15, now + dur * 0.4);
  masterGain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
  var lpf = ctx.createBiquadFilter();
  lpf.type = 'lowpass';
  lpf.frequency.value = Math.min(800 + freq * 2.5, 7000);
  lpf.connect(masterGain);
  [['triangle',1.0,1],['sine',0.2,2],['sine',0.07,3]].forEach(function(arr) {
    var osc = ctx.createOscillator();
    var g = ctx.createGain();
    osc.type = arr[0]; osc.frequency.value = freq * arr[2];
    g.gain.value = arr[1];
    osc.connect(g); g.connect(lpf);
    osc.start(now); osc.stop(now + dur + 0.1);
  });
}
function playChord(midis, dur, vel) {
  dur = dur || 2.0; vel = vel || 0.5;
  var v = vel / Math.sqrt(midis.length);
  midis.forEach(function(m, i) { setTimeout(function() { playPiano(m, dur, v); }, i * 18); });
}
function playSeq(midis, bpm, dur) {
  bpm = bpm || 90; dur = dur || 0.55;
  var delay = 60000 / bpm;
  midis.forEach(function(m, i) { setTimeout(function() { playPiano(m, dur, 0.55); }, i * delay); });
}

// ═══════════════════════════════════════════
// PIANO SVG BUILDER
// ═══════════════════════════════════════════
var NOTE_NAMES_ES = ['Do','Do#','Re','Re#','Mi','Fa','Fa#','Sol','Sol#','La','La#','Si'];
var WHITE_PCS = [0,2,4,5,7,9,11];
function isWhite(midi) { return WHITE_PCS.indexOf(midi % 12) !== -1; }
function noteName(midi) { return NOTE_NAMES_ES[midi % 12] + Math.floor((midi - 12) / 12); }

function buildPiano(opts) {
  opts = opts || {};
  var startMidi = opts.startMidi !== undefined ? opts.startMidi : 48;
  var endMidi = opts.endMidi !== undefined ? opts.endMidi : 76;
  var highlight = opts.highlight || [];
  var WKW = opts.WKW || 18;
  var WKH = opts.height || 90;
  var BKW = Math.round(WKW * 0.62);
  var BKH = Math.round(WKH * 0.60);
  var clickable = opts.clickable !== false;
  var whites = [];
  var wIdx = 0;
  for (var m = startMidi; m <= endMidi; m++) {
    if (isWhite(m)) { whites.push({midi: m, x: wIdx * WKW}); wIdx++; }
  }
  var totalW = wIdx * WKW;
  var H = WKH + 4;
  var hlMap = {};
  highlight.forEach(function(h) { hlMap[h.midi] = h; });
  var svg = '<svg viewBox="0 0 ' + totalW + ' ' + H + '" width="' + totalW + '" height="' + H + '" xmlns="http://www.w3.org/2000/svg" style="cursor:pointer;display:block">';
  whites.forEach(function(k) {
    var hl = hlMap[k.midi];
    var fill = hl ? (hl.color || '#bf7af0') : '#ede9fe';
    svg += '<rect x="' + (k.x+1) + '" y="0" width="' + (WKW-2) + '" height="' + WKH + '" rx="2" fill="' + fill + '" stroke="#2a0e5a" stroke-width="1"';
    if (clickable) svg += ' onclick="onKeyClick(' + k.midi + ')" onmouseenter="onKeyHover(' + k.midi + ')"';
    svg += '/>';
    if (hl && hl.label) {
      svg += '<text x="' + (k.x + WKW/2) + '" y="' + (WKH - 7) + '" text-anchor="middle" font-size="' + Math.max(8, WKW-6) + '" fill="' + (hl.color ? '#0c001e' : '#2a0e5a') + '" font-weight="bold" font-family="sans-serif" pointer-events="none">' + hl.label + '</text>';
    }
  });
  for (var m2 = startMidi; m2 <= endMidi; m2++) {
    if (!isWhite(m2)) {
      var leftW = null;
      for (var j = 0; j < whites.length; j++) { if (whites[j].midi === m2 - 1) { leftW = whites[j]; break; } }
      if (!leftW) continue;
      var bx = leftW.x + WKW - Math.round(BKW / 2);
      var hl2 = hlMap[m2];
      var bFill = hl2 ? (hl2.color || '#9333ea') : '#0c001e';
      svg += '<rect x="' + bx + '" y="0" width="' + BKW + '" height="' + BKH + '" rx="2" fill="' + bFill + '" stroke="#000" stroke-width="0.5"';
      if (clickable) svg += ' onclick="onKeyClick(' + m2 + ')" onmouseenter="onKeyHover(' + m2 + ')"';
      svg += '/>';
      if (hl2 && hl2.label) {
        svg += '<text x="' + (bx + BKW/2) + '" y="' + (BKH - 5) + '" text-anchor="middle" font-size="' + Math.max(7, BKW-4) + '" fill="#ede9fe" font-weight="bold" font-family="sans-serif" pointer-events="none">' + hl2.label + '</text>';
      }
    }
  }
  svg += '</svg>';
  return svg;
}

  var idx = CURRICULUM.findIndex(function(l) { return l.id === id; });

function updateSidebar() {
  var done = doneCount();
  var total = CURRICULUM.length;
  var pct = Math.round(done / total * 100);
  document.getElementById('sb-pfill').style.width = pct + '%';
  document.getElementById('sb-pcount').textContent = done + ' / ' + total + ' lecciones';
  var mods = {};
  CURRICULUM.forEach(function(l) {
    if (!mods[l.mod]) mods[l.mod] = [];
    mods[l.mod].push(l);
  });
  var html = '';
  Object.keys(mods).forEach(function(mod) {
    html += '<div class="sb-module-title">' + mod + '</div>';
    mods[mod].forEach(function(l) {
      var done_l = isDone(l.id);
      var unlocked = isUnlocked(l.id);
      var active = (l.id === currentLesson);
      var cls = 'sb-lesson' + (active ? ' active' : '') + (done_l ? ' done' : '') + (!unlocked && !active ? ' locked' : '');
      var onclick = unlocked ? 'onclick="loadLesson(\'' + l.id + '\')"' : '';
      html += '<div class="' + cls + '" ' + onclick + '><span class="sb-dot"></span>' + l.title + '</div>';
    });
  });
  document.getElementById('sb-modules').innerHTML = html;
}

var _actId = 0;

function actNorm(s) {
  if (!s) return NaN;
  s = s.toString().trim().replace(',', '.');
  s = s.replace('½', '.5').replace('¼', '.25').replace('¾', '.75');
  // Handle "1½" → "1.5"
  s = s.replace(/^(\d+)\.5$/, function(m, d) { return (parseFloat(d) + 0.5) + ''; });
  // Simple fraction "1/2"
  if (/^\d+\/\d+$/.test(s)) { var p = s.split('/'); return parseFloat(p[0]) / parseFloat(p[1]); }
  return parseFloat(s);
}

function actValidate(id, ans) {
  var inp = document.getElementById(id);
  if (!inp) return;
  if (!inp.value.trim()) {
    inp.style.borderColor = inp.getAttribute('data-bc') || '#ccc';
    inp.style.background = '#fff';
    var fb0 = document.getElementById('fb-' + id);
    if (fb0) fb0.textContent = '';
    return;
  }
  var v = actNorm(inp.value);
  var ok = !isNaN(v) && Math.abs(v - ans) < 0.001;
  inp.style.borderColor = ok ? '#16a34a' : '#dc2626';
  inp.style.background  = ok ? '#f0fdf4' : '#fef2f2';
  inp.style.color       = ok ? '#14532d' : '#7f1d1d';
  var fb = document.getElementById('fb-' + id);
  if (!fb) { fb = document.createElement('span'); fb.id = 'fb-' + id; fb.className = 'act-fb'; inp.parentNode.insertBefore(fb, inp.nextSibling); }
  fb.textContent = ok ? '✓' : '✗';
  fb.style.color = ok ? '#16a34a' : '#dc2626';
}

function _ai(ans, bc, cls) {
  var id = 'act' + (++_actId);
  cls = cls || 'act-inp';
  return '<input id="' + id + '" type="text" class="' + cls + '" data-ans="' + ans + '" data-bc="' + bc + '" placeholder="?" '
    + 'style="border-color:' + bc + '" '
    + 'oninput="actValidate(\'' + id + '\',' + ans + ')" '
    + 'onblur="actValidate(\'' + id + '\',' + ans + ')">'
    + '<span id="fb-' + id + '" class="act-fb"></span>';
}

function _prob(num, nc, a, op, b, ans, bc) {
  return '<div class="act-prob">'
    + '<span class="act-pnum" style="color:' + nc + '">' + num + '.</span>'
    + '<span class="act-sym" title="' + a.n + ' = ' + a.v + ' tiempos">' + a.s + '</span>'
    + '<span class="act-oper">' + op + '</span>'

  makeExercise('ex1-2', '¿Donde esta siempre el Do en el teclado?', ['A la derecha de 2 teclas negras', 'A la izquierda de 2 teclas negras', 'A la izquierda de 3 teclas negras', 'En el centro del teclado'], 1) +
  completeBtn();
};

LESSONS['l1-3'] = function() {
  currentLesson = 'l1-3';
  return badge('Modulo 1', '3') +
  lessonTitle('Postura y Manos') +
  subtitle('Antes del primer sonido, prepara tu cuerpo. La comodidad es el primer tecnicismo.') +
  theory('<p>La postura en el piano no es un capricho estetico: es la base de todo lo que viene despues. Una mala postura genera tension, y la tension es el enemigo de la musica. Cuando tu cuerpo esta comodo y libre, tus dedos pueden moverse con precision y tus oidos pueden escuchar sin la distraccion del dolor.</p><p>Sientate en el <b>borde delantero del banco</b>, no en el fondo. Tus pies deben descansar planos en el suelo (o en los pedales). La distancia al piano debe ser tal que tus codos queden al nivel de las teclas o ligeramente por encima. Los hombros caen naturales, sin tension. La espalda esta derecha pero no rigida: imagina un hilo de seda que te sostiene desde la coronilla.</p><p>Las manos adoptan una forma redondeada, como si sostuvieras una <em>naranja imaginaria</em> bajo cada palma. Los dedos caen curvados sobre las teclas, tocando con la <b>yema carnosa</b>, no con la punta dura de la una. La muneca esta nivelada con el dorso de la mano, sin caer ni levantarse. Esta posicion parece exagerada al principio, pero protege tus tendones y te permite tocar durante anos sin lesiones.</p>') +
  sectionHeader('Numeracion de dedos') +
  '<div style="background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:24px">' +
  '<p style="font-size:.82rem;color:var(--muted2);margin-bottom:14px;text-transform:uppercase;letter-spacing:1px;font-weight:700">Sistema universal de dedos (igual en ambas manos)</p>' +
  '<table class="finger-table"><thead><tr><th>Numero</th><th>Dedo</th><th>Nombre</th></tr></thead><tbody>' +
  '<tr><td class="hl">1</td><td>&#128405;</td><td>Pulgar</td></tr>' +
  '<tr><td class="hl">2</td><td>&#128406;</td><td>Indice</td></tr>' +
  '<tr><td class="hl">3</td><td>&#128407;</td><td>Medio (corazon)</td></tr>' +
  '<tr><td class="hl">4</td><td>&#128408;</td><td>Anular</td></tr>' +
  '<tr><td class="hl">5</td><td>&#128409;</td><td>Menique</td></tr>' +
  '</tbody></table></div>' +
  insight('💆', '<b>Chequeo de tension:</b> Antes de tocar, agita las manos sueltas como si sacudieras agua. Deja que caigan naturales. Esa sensacion de peso relajado es exactamente la que quieres mantener mientras tocas. Si en algun momento sientes tension en los antebrazos, detente y sacude de nuevo.') +
  callout('<b>La altura del banco:</b> Es crucial que el banco este a la altura correcta. Una regla simple: cuando tus dedos esten sobre las teclas en posicion curva, tu antebrazo debe estar aproximadamente horizontal o ligeramente inclinado hacia abajo. Si el banco es muy alto o muy bajo, todo el resto se desacomoda.') +
  pianoHtml({startMidi:60, endMidi:72, WKW:28, height:100, label:'Posicion de 5 dedos: Do-Re-Mi-Fa-Sol con MD', highlight:[
    {midi:60, color:'#bf7af0', label:'1'},
    {midi:62, color:'#e879f9', label:'2'},
    {midi:64, color:'#a78bfa', label:'3'},
    {midi:65, color:'#fbbf24', label:'4'},
    {midi:67, color:'#a78bfa', label:'5'},
  ]}) +
  magicBox('Ejercicio de postura', 'Siéntate frente al piano (o a una mesa). Pon las manos en posicion de "naranja" sobre la superficie. Ahora toca suavemente con cada dedo, del 1 al 5, luego del 5 al 1, sin mover la muneca. El movimiento viene solo del dedo, no de la mano entera. Repite 5 veces y luego con la otra mano.') +
  makeExercise('ex1-3', '¿Con que parte del dedo se deben tocar las teclas del piano?', ['Con la punta de la una', 'Con la yema carnosa del dedo', 'Con la falange del medio', 'Con el borde lateral'], 1) +
  completeBtn();
};

LESSONS['l2-1'] = function() {
  currentLesson = 'l2-1';
  return badge('Modulo 2', '1') +
  lessonTitle('El Do Central') +
  subtitle('Una sola nota. El ombligo del universo musical.') +
  theory('<p>El <b>Do Central</b> es la nota mas importante que aprenderás en el piano. En el mundo musical se le llama "Do4" o "C4" en el sistema anglosajón. Esta en el centro del teclado, justo a la izquierda del grupo de 2 teclas negras que está mas cerca del centro físico del instrumento.</p><p>¿Por que es tan especial? Porque es el punto de encuentro de las dos manos: es la ultima nota grave que lee la mano derecha, y la primera nota aguda que lee la mano izquierda. Ademas, es la nota alrededor de la cual se construye la tonalidad de Do Mayor, la mas sencilla y la puerta de entrada a toda la teoria musical occidental.</p><p>El Do Central vibra a exactamente <em>261.63 Hz</em>. Eso significa que la cuerda (o en un piano digital, el altavoz) vibra casi 262 veces por segundo. Cuando lo tocas con fuerza y pones la mano suavemente sobre la tapa del piano, puedes sentir esa vibracion. El piano no solo se escucha: tambien se siente.</p>') +
  sectionHeader('El Do Central en el teclado') +
  pianoHtml({startMidi:55, endMidi:67, WKW:30, height:105, label:'Haz click en el Do Central (tecla morada brillante)', highlight:[
    {midi:60, color:'#f0abfc', label:'Do4'},
    {midi:58, color:'#2a0e5a', label:''},
    {midi:61, color:'#2a0e5a', label:''},
  ]}) +
  '<div class="btns-row">' +
  btnPlay('▶ Escuchar Do Central', 'playPiano(60,3.0,0.7)') +
  btnPlay('▶ Escuchar Do grave y agudo', 'playSeq([48,60,72],70,1.5)') +
  '</div>' +
  insight('🎵', '<b>Ejercicio de escucha:</b> Toca el Do Central y déjalo sonar. Mientras suena, toca el Do de la octava siguiente (8 teclas blancas mas a la derecha). Escucha como suenan "iguales pero diferentes": mas brillante, mas agudo. Esa relacion de octava es el intervalo mas consonante de toda la musica.') +
  callout('<b>El nombre "Central" es relativo:</b> En un piano de 88 teclas, el Do Central no esta exactamente en el centro fisico (que seria entre Fa3 y Fa#3). Esta en la cuarta octava del instrumento. Se llama "central" porque es el punto de referencia para toda la lectura musical y para la posicion de las manos.') +
  magicBox('Meditacion sonora', 'Toca el Do Central con el dedo 3 (medio) de la mano derecha. Mira el dedo mientras lo tocas. Ahora cierra los ojos y vuelve a tocarlo, guiandote solo por la memoria de donde estaba. Cuando lo encuentres sin mirar, celebralo: tu cuerpo ya esta aprendiendo el piano.') +
  makeExercise('ex2-1', '¿A cuantos Hz vibra el Do Central (C4)?', ['440 Hz', '261.63 Hz', '523.25 Hz', '130.81 Hz'], 1) +
  completeBtn();
};

LESSONS['l2-2'] = function() {
  currentLesson = 'l2-2';
  return badge('Modulo 2', '2') +
  lessonTitle('La Escala de Do Mayor') +
  subtitle('Ocho notas que contienen toda la belleza del mundo.') +
  theory('<p>La escala de Do Mayor es la escala mas fundamental de la musica occidental. Son 8 notas: <b>Do - Re - Mi - Fa - Sol - La - Si - Do</b>. Lo que hace magica a esta escala es que usa solo las teclas blancas del piano: ninguna negra. Es como si el piano hubiera sido diseñado para que Do Mayor fuera el camino mas natural de recorrer.</p><p>Pero no es casualidad. La escala Mayor tiene una formula de intervalos: <em>T - T - S - T - T - T - S</em> (donde T = tono = 2 semitonos, S = semitono = 1 semitono). Aplicada desde Do, esa formula cae exactamente sobre las teclas blancas. Cuando aprendas otras escalas, usaras la misma formula pero desde otra nota, lo que hace que necesites algunas teclas negras.</p><p>Tocar la escala no es solo un ejercicio tecnico: es una conversacion con tu instrumento. Mientras mas veces la recorras, mas tu cuerpo aprende la distancia entre cada nota, la presion necesaria, el peso exacto del dedo. La escala es el alfabeto del piano.</p>') +
  sectionHeader('Escala de Do Mayor') +
  pianoHtml({startMidi:57, endMidi:75, WKW:26, height:100, label:'Do Mayor: solo teclas blancas, 8 notas', highlight:[
    {midi:60, color:'#bf7af0', label:'Do'},
    {midi:62, color:'#a78bfa', label:'Re'},
    {midi:64, color:'#a78bfa', label:'Mi'},
    {midi:65, color:'#a78bfa', label:'Fa'},
    {midi:67, color:'#a78bfa', label:'Sol'},
    {midi:69, color:'#a78bfa', label:'La'},
    {midi:71, color:'#a78bfa', label:'Si'},
    {midi:72, color:'#e879f9', label:'Do'},
  ]}) +
  '<div class="btns-row">' +
  btnPlay('▶ Escuchar escala subiendo', 'playSeq([60,62,64,65,67,69,71,72],80,0.6)') +
  btnPlay('▶ Escuchar escala bajando', 'playSeq([72,71,69,67,65,64,62,60],80,0.6)') +
  btnPlay('▶ Escuchar arpegio', 'playSeq([60,64,67,72],80,0.8)') +
  '</div>' +
  insight('🌊', '<b>La formula secreta:</b> Tono-Tono-Semitono-Tono-Tono-Tono-Semitono. Los semitonos (los pasos mas pequenos) ocurren entre Mi-Fa y entre Si-Do. Nota que entre esas parejas no hay tecla negra. En el piano, cada vez que ves dos teclas blancas sin tecla negra entre ellas, ahi hay un semitono.') +
  callout('<b>¿Por que "Mayor"?</b> Porque suena alegre, luminosa, abierta. Las escalas menores (que aprenderás despues) usan una tercera diferente y suenan mas melancolicas. La diferencia entre major y menor es solo un semitono, pero ese semitono lo cambia todo emocionalmente.') +
  '<div class="scale-steps">' +
  ['Do','Re','Mi','Fa','Sol','La','Si','Do'].map(function(n,i) {
    var midis = [60,62,64,65,67,69,71,72];
    var fingers = ['1','2','3','1','2','3','4','5'];
    var steps = ['T','T','S','T','T','T','S'];
    return '<div class="scale-step">' +
      '<div class="scale-note" onclick="playPiano(' + midis[i] + ',1.5,0.6)">' + n + '</div>' +
      '<div class="scale-finger">' + fingers[i] + '</div>' +
      (i < 7 ? '<div class="scale-interval">' + steps[i] + '</div>' : '') +
    '</div>';
  }).join('') +
  '</div>' +
  magicBox('Ejercicio con digitacion', 'Usa los dedos 1-2-3-1-2-3-4-5 para la mano derecha (el pulgar pasa por debajo del 3 despues del Mi). Para la mano izquierda es al reves: 5-4-3-2-1-3-2-1 (el 3 pasa por encima del pulgar). Practica primero muy lento, un dedo a la vez. La velocidad viene sola con la repeticion.') +
  makeExercise('ex2-2', '¿Entre cuales notas de Do Mayor hay un semitono natural?', ['Do-Re y Sol-La', 'Mi-Fa y Si-Do', 'Re-Mi y La-Si', 'Fa-Sol y Do-Re'], 1) +
  completeBtn();
};

LESSONS['l2-3'] = function() {
  currentLesson = 'l2-3';
  return badge('Modulo 2', '3') +
  lessonTitle('Ejercicios de 5 Dedos') +
  subtitle('La posicion de 5 dedos es tu hogar en el piano.') +
  theory('<p>La <b>posicion de 5 dedos</b> es el punto de partida de casi todo lo que tocaras en el piano. Consiste en colocar los 5 dedos sobre 5 teclas adyacentes (sin saltar ninguna), de modo que cada dedo tenga asignada una nota. Para la mano derecha sobre Do Mayor: pulgar (1) en Do, indice (2) en Re, medio (3) en Mi, anular (4) en Fa, menique (5) en Sol.</p><p>Esta posicion tiene un nombre: <em>pentacordo</em> (cinco cuerdas). Es el primer "territorio" que conquistas en el teclado. Dentro de ese territorio puedes improvisar, crear melodias sencillas, y desarrollar independencia de dedos. La mayoria de las piezas para principiantes viven completamente dentro del pentacordo de Do Mayor.</p><p>El objetivo de los ejercicios de 5 dedos no es solo la velocidad: es la <em>igualdad</em>. Cada dedo debe tocar con la misma presion, el mismo tiempo, el mismo volumen. El dedo 4 (anular) es naturalmente el mas debil, porque comparte un tendon con el menique. No te frustres con el: es perfectamente normal que tarde mas en igualarse. Con paciencia, lo lograras.</p>') +
  sectionHeader('Posicion de 5 dedos - Mano Derecha') +
  pianoHtml({startMidi:57, endMidi:70, WKW:28, height:100, label:'5 dedos sobre Do-Re-Mi-Fa-Sol', highlight:[
    {midi:60, color:'#bf7af0', label:'1-Do'},
    {midi:62, color:'#e879f9', label:'2-Re'},
    {midi:64, color:'#a78bfa', label:'3-Mi'},
    {midi:65, color:'#fbbf24', label:'4-Fa'},
    {midi:67, color:'#86efac', label:'5-Sol'},
  ]}) +
  '<div class="btns-row">' +
  btnPlay('▶ 1-2-3-4-5 subiendo', 'playSeq([60,62,64,65,67],70,0.5)') +
  btnPlay('▶ 5-4-3-2-1 bajando', 'playSeq([67,65,64,62,60],70,0.5)') +
  btnPlay('▶ Patron: 1-2-3-4-5-4-3-2-1', 'playSeq([60,62,64,65,67,65,64,62,60],70,0.5)') +
  '</div>' +
  insight('⏱️', '<b>El secreto del practicar lento:</b> El cerebro aprende los movimientos correctamente cuando son lentos. Si practicas rapido con errores, estas enseñandole errores a tu cerebro. Si practicas lento con perfeccion, esa perfeccion se convierte en reflejo automatico. Empieza al 50% de la velocidad meta. Cuando salga perfecto, sube un poco mas.') +
  callout('<b>El dedo 4 (anular):</b> Muchos pianistas lo llaman "el rebelde". Es el unico dedo que no puede extenderse completamente independiente de sus vecinos porque comparte tendones. Los ejercicios especificos para fortalecerlo incluyen: 1-2-3-4-3-2-1, 1-3-4-3-1, y practicar con el dedo 4 solo haciendo trinos suaves.') +
  sectionHeader('Posicion de 5 dedos - Mano Izquierda') +
  pianoHtml({startMidi:45, endMidi:62, WKW:26, height:95, label:'MI izquierda: 5-4-3-2-1 sobre Do-Re-Mi-Fa-Sol', highlight:[
    {midi:48, color:'#86efac', label:'5-Do'},
    {midi:50, color:'#fbbf24', label:'4-Re'},
    {midi:52, color:'#a78bfa', label:'3-Mi'},
    {midi:53, color:'#e879f9', label:'2-Fa'},
    {midi:55, color:'#bf7af0', label:'1-Sol'},
  ]}) +
  magicBox('Rutina diaria recomendada', 'Dedica 5 minutos cada dia a este ejercicio: toca 1-2-3-4-5-4-3-2-1 con cada mano por separado, tres veces. Luego repite con el metrónomo: empieza en 60 BPM. Cuando salga limpio 3 dias seguidos, sube a 70 BPM. La consistencia vale mas que las sesiones largas.') +
  makeExercise('ex2-3', '¿Que numero de dedo corresponde al pulgar?', ['5', '3', '1', '2'], 2) +
  completeBtn();
};

LESSONS['l3-1'] = function() {
  currentLesson = 'l3-1';
  return badge('Modulo 3', '1') +
  lessonTitle('Pentagrama y Clave de Sol') +
  subtitle('El lenguaje escrito de la música. Tu mapa para toda la historia musical.') +
  theory('<p>El <b>pentagrama</b> es el sistema de 5 líneas horizontales donde se escriben las notas musicales. Cada posición en esas líneas o en los espacios entre ellas representa una nota diferente. Es el sistema que usamos desde hace siglos para preservar y compartir música: gracias a él, puedes tocar lo que Beethoven escribió hace 200 años exactamente como él lo imaginó.</p><p>La <b>Clave de Sol</b> (o clave de Sol de segunda línea) aparece al inicio de la pentagrama superior y le dice a tu mano derecha dónde leer. El símbolo de la clave de Sol rodea la segunda línea del pentagrama, indicando que esa línea es Sol. A partir de ese punto de referencia, puedes deducir todas las demás notas: arriba de Sol viene La, Si, Do; debajo viene Fa, Mi, Re.</p><p>Las notas en la clave de Sol, de abajo hacia arriba, son: <em>Mi - Sol - Si - Re - Fa</em> en las líneas, y <em>Fa - La - Do - Mi</em> en los espacios. Para las líneas hay un truco: <b>Mi Gallina Sol Buenísima Fa</b>. Para los espacios: <b>Fa La Do Mi</b> (que suena como "Fa la do mi" o puedes crear tu propio mnemonico).</p>') +
  '<div style="background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:24px;margin-bottom:24px">' +
  '<p style="font-size:.7rem;color:var(--muted2);margin-bottom:16px;text-transform:uppercase;letter-spacing:1px;font-weight:700">Pentagrama con Clave de Sol</p>' +
  '<svg viewBox="0 0 500 120" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:500px;display:block">' +
  '<line x1="50" y1="20" x2="480" y2="20" stroke="#a78bfa" stroke-width="1.2"/>' +
  '<line x1="50" y1="40" x2="480" y2="40" stroke="#a78bfa" stroke-width="1.2"/>' +
  '<line x1="50" y1="60" x2="480" y2="60" stroke="#a78bfa" stroke-width="1.2"/>' +
  '<line x1="50" y1="80" x2="480" y2="80" stroke="#a78bfa" stroke-width="1.2"/>' +
  '<line x1="50" y1="100" x2="480" y2="100" stroke="#a78bfa" stroke-width="1.2"/>' +
  '<text x="18" y="108" font-size="72" font-family="serif" fill="#bf7af0" opacity=".9">&#119070;</text>' +
  '<circle cx="160" cy="100" r="9" fill="#bf7af0" opacity=".9"/><text x="175" y="104" font-size="13" fill="#d8b4fe">Mi</text>' +
  '<circle cx="230" cy="90" r="9" fill="#e879f9" opacity=".9"/><text x="245" y="94" font-size="13" fill="#d8b4fe">Fa</text>' +
  '<circle cx="300" cy="80" r="9" fill="#bf7af0" opacity=".9"/><text x="315" y="84" font-size="13" fill="#d8b4fe">Sol</text>' +
  '<circle cx="370" cy="70" r="9" fill="#e879f9" opacity=".9"/><text x="385" y="74" font-size="13" fill="#d8b4fe">La</text>' +
  '<circle cx="440" cy="60" r="9" fill="#bf7af0" opacity=".9"/><text x="455" y="64" font-size="13" fill="#d8b4fe">Si</text>' +
  '<text x="50" y="115" font-size="10" fill="#7c3aed">Línea 1</text><text x="110" y="115" font-size="10" fill="#7c3aed">Espacio 1</text><text x="275" y="115" font-size="10" fill="#7c3aed">Línea 2 (Sol)</text>' +
  '</svg>' +
  '</div>' +
  '<div class="btns-row">' +
  btnPlay('▶ Mi4', 'playPiano(64,1.5,0.6)') +
  btnPlay('▶ Sol4', 'playPiano(67,1.5,0.6)') +
  btnPlay('▶ Si4', 'playPiano(71,1.5,0.6)') +
  btnPlay('▶ Re5', 'playPiano(74,1.5,0.6)') +
  btnPlay('▶ Fa5', 'playPiano(77,1.5,0.6)') +
  '</div>' +
  insight('📖', '<b>Mnemotecnias para las líneas (abajo a arriba):</b> <em>Mi Gallina Sol Buenísima Fa</em>. Para los espacios: <em>Fa - La - Do - Mi</em>. Puedes inventar tus propias frases con esas iniciales: M-G-S-B-F y F-L-D-M. Lo que más te haga reír lo recordarás mejor.') +
  callout('<b>Líneas adicionales:</b> Cuando una nota es demasiado grave o aguda para caber en el pentagrama, se escriben líneas adicionales encima o debajo. El Do Central, por ejemplo, se escribe en una sola línea adicional por debajo del pentagrama de Sol. Esa pequeña línea flotante es uno de los símbolos más famosos de la música.') +
  magicBox('Ejercicio de lectura', 'Dibuja un pentagrama en un papel (5 líneas). Escribe las notas Mi, Sol, Si, Re, Fa en las líneas, y Fa, La, Do, Mi en los espacios. Luego crea notas al azar y nómbralas. Haz esto 5 minutos al día: la lectura musical es como aprender a leer en otro idioma, y la práctica diaria es la clave.') +
  makeExercise('ex3-1', '¿Qué nota ocupa la segunda línea del pentagrama en la Clave de Sol?', ['Do', 'Mi', 'Sol', 'La'], 2) +

};

LESSONS['l3-2'] = function() {
  currentLesson = 'l3-2';
  return badge('Modulo 3', '2') +
  lessonTitle('Clave de Fa y Gran Pentagrama') +
  subtitle('La mano izquierda tiene su propio universo. Juntos forman el gran mapa.') +
  theory('<p>La <b>Clave de Fa</b> (o clave de Fa de cuarta línea) es la pareja de la Clave de Sol. Aparece en la pentagrama inferior y le pertenece a la mano izquierda. El símbolo de la Clave de Fa señala la cuarta línea, indicando que esa línea es Fa. A partir de ahí, se leen las notas de forma similar, pero en el registro grave del piano.</p><p>Las notas en la Clave de Fa, de abajo hacia arriba: <em>Sol - Si - Re - Fa - La</em> en las líneas, y <em>La - Do - Mi - Sol</em> en los espacios. Truco para las líneas: <b>Sol Buena Duerme Fa La</b>. Para los espacios: <b>La Do Mi Sol</b>.</p><p>El <b>Gran Pentagrama</b> (o sistema de gran pentagrama) es cuando la Clave de Sol y la Clave de Fa se escriben juntas, unidas por una llave al lado izquierdo. La mano derecha lee arriba (Sol), la mano izquierda lee abajo (Fa). En el centro, justo entre las dos pentagramas, está el Do Central, en una línea adicional flotante. Esta disposición refleja perfectamente la geografía del piano.</p>') +
  '<div style="background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:24px;margin-bottom:24px">' +
  '<p style="font-size:.7rem;color:var(--muted2);margin-bottom:16px;text-transform:uppercase;letter-spacing:1px;font-weight:700">Gran Pentagrama (Clave de Sol + Clave de Fa)</p>' +
  '<svg viewBox="0 0 500 220" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:500px;display:block">' +
  '<text x="24" y="8" font-size="9" fill="#a78bfa" letter-spacing="1">MANO DERECHA (Sol)</text>' +
  '<line x1="50" y1="20" x2="480" y2="20" stroke="#a78bfa" stroke-width="1.2"/>' +

  callout('<b>¿Por qué dos claves?</b> Porque el piano tiene un rango tan amplio que una sola pentagrama de 5 líneas no alcanza. Con el Gran Pentagrama, podemos escribir desde el Do más grave hasta el Do más agudo del piano, y el ojo del músico salta naturalmente de una pentagrama a la otra según cuál mano toca.') +

  completeBtn();
};

LESSONS['l3-3'] = function() {
  currentLesson = 'l3-3';
  return badge('Modulo 3', '3') +
  lessonTitle('Valores de Notas y Ritmo') +
  subtitle('El tiempo es la otra mitad de la música. Las notas dicen qué; el ritmo dice cuándo y cuánto.') +
  theory('<p>Una nota en una partitura tiene dos informaciones: <b>su altura</b> (qué nota es, según su posición en el pentagrama) y <b>su duración</b> (cuánto tiempo dura, según su forma). La forma de la nota es lo que llamamos "valor rítmico".</p><p>Los valores principales son: la <em>redonda</em> (dura 4 tiempos), la <em>blanca</em> (dura 2 tiempos), la <em>negra</em> (dura 1 tiempo), la <em>corchea</em> (dura medio tiempo), y la <em>semicorchea</em> (dura un cuarto de tiempo). Cuando el compás es 4/4, caben exactamente 4 tiempos por compás: puedes llenarlo con 1 redonda, 2 blancas, 4 negras, 8 corcheas, o cualquier combinación que sume 4.</p><p>El <b>silencio</b> también tiene valor: hay silencios de redonda, blanca, negra, corchea, etc. El silencio no es una pausa en la música; es parte de la música. Muchos compositores dicen que los silencios son tan importantes como las notas. El espacio entre los sonidos es donde la música respira.</p>') +
  '<div style="background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:20px 24px;margin-bottom:24px">' +
  '<p style="font-size:.7rem;color:var(--muted2);margin-bottom:16px;text-transform:uppercase;letter-spacing:1px;font-weight:700">Tabla de valores rítmicos</p>' +
  '<table class="finger-table"><thead><tr><th>Símbolo</th><th>Nombre</th><th>Tiempos</th><th>Ejemplo en 4/4</th></tr></thead><tbody>' +
  '<tr><td style="font-size:1.4rem">𝅝</td><td class="hl">Redonda</td><td>4</td><td>1 por compás</td></tr>' +
  '<tr><td style="font-size:1.4rem">𝅗𝅥</td><td class="hl">Blanca</td><td>2</td><td>2 por compás</td></tr>' +
  '<tr><td style="font-size:1.4rem">𝅘𝅥</td><td class="hl">Negra</td><td>1</td><td>4 por compás</td></tr>' +
  '<tr><td style="font-size:1.4rem">𝅘𝅥𝅮</td><td class="hl">Corchea</td><td>1/2</td><td>8 por compás</td></tr>' +
  '<tr><td style="font-size:1.4rem">𝅘𝅥𝅯</td><td class="hl">Semicorchea</td><td>1/4</td><td>16 por compás</td></tr>' +
  '</tbody></table></div>' +
  '<div class="btns-row">' +
  btnPlay('▶ Negras (60 BPM)', 'playSeq([60,60,60,60],60,0.9)') +
  btnPlay('▶ Corcheas (60 BPM)', 'playSeq([60,60,60,60,60,60,60,60],120,0.45)') +
  btnPlay('▶ Ritmo mixto', 'playSeq([60,60,62,62,64,64,64,64],90,0.5)') +
  '</div>' +
  insight('🥁', '<b>El pulso vs. el ritmo:</b> El pulso es el latido constante de la música (lo que marca el metrónomo). El ritmo es el patrón de duraciones de las notas que se superpone sobre ese pulso. Puedes tener el mismo pulso pero ritmos completamente diferentes. El metrónomo marca el pulso; tú pones el ritmo.') +
  callout('<b>El punto de aumento:</b> Cuando una nota tiene un pequeño punto a su derecha, su duración se multiplica por 1.5. Una negra con punto dura 1.5 tiempos (una negra + una corchea). Una blanca con punto dura 3 tiempos. Este detalle aparece todo el tiempo en música, especialmente en ritmos de vals (3/4) y baladas.') +
  magicBox('Ejercicio de palmas', 'Pon el metrónomo en 60 BPM. Aplaude en cada tiempo (negras). Luego aplaude dos veces por tiempo (corcheas). Luego alterna: dos tiempos aplaudiendo negras, dos tiempos aplaudiendo corcheas. Este ejercicio entrena tu sentido del ritmo antes de llegar al teclado.') +
  completeBtn();
};

LESSONS['l4-1'] = function() {
  currentLesson = 'l4-1';
  return badge('Modulo 4', '1') +
  lessonTitle('La Mano Derecha') +
  subtitle('Tu voz melodica. La que canta.') +
  theory('<p>En la música de piano para principiantes, la <b>mano derecha</b> es generalmente la que lleva la melodía: la línea principal, la voz que canta, lo que el oyente escucha y recuerda. Esto no es una regla absoluta (hay piezas donde la mano izquierda tiene la melodía), pero es el punto de partida más natural.</p><p>Trabajar la mano derecha sola antes de añadir la izquierda es una estrategia fundamental. Cuando intentas tocar con ambas manos desde el primer día, tu cerebro divide su atención y aprende todo a medias. Cuando trabajas una mano sola hasta que sale de forma casi automática, liberas recursos cognitivos para añadir la otra mano más fácilmente.</p><p>La melodía que aprenderemos hoy es el comienzo de <em>Oda a la Alegría</em> de Beethoven: una de las melodías más reconocibles del mundo. Solo usa 5 notas del pentacordo de Do Mayor (Do-Re-Mi-Fa-Sol más Si), y cabe perfectamente en la posición de 5 dedos. Perfecta para tu primera melodía real.</p>') +
  sectionHeader('Oda a la Alegría - Mano Derecha') +
  pianoHtml({startMidi:57, endMidi:72, WKW:26, height:95, label:'Notas de la melodía (haz click para escuchar cada una)', highlight:[
    {midi:60, color:'#a78bfa', label:'Do'},
    {midi:62, color:'#a78bfa', label:'Re'},
    {midi:64, color:'#bf7af0', label:'Mi'},
    {midi:65, color:'#a78bfa', label:'Fa'},
    {midi:67, color:'#a78bfa', label:'Sol'},
    {midi:71, color:'#e879f9', label:'Si'},
  ]}) +
  '<div class="btns-row">' +
  btnPlay('▶ Escuchar melodía completa', 'playSeq([64,64,65,67,67,65,64,62,60,60,62,64,64,62,62],80,0.55)') +
  btnPlay('▶ Frase 1 lenta', 'playSeq([64,64,65,67,67,65,64,62],55,0.6)') +
  btnPlay('▶ Frase 2 lenta', 'playSeq([60,60,62,64,64,62,62],55,0.6)') +
  '</div>' +
  '<div style="background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:16px 20px;margin-bottom:20px;font-size:.82rem;line-height:2">' +
  '<p style="font-size:.65rem;color:var(--muted2);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;font-weight:700">Notas y dedos - Oda a la Alegría (MD)</p>' +
  '<p style="font-family:monospace;color:#d8b4fe;letter-spacing:2px">Mi  Mi  Fa  Sol | Sol Fa  Mi  Re</p>' +
  '<p style="font-family:monospace;color:var(--gold);letter-spacing:2px">3   3   4   5  |  5   4   3   2</p>' +
  '<p style="font-family:monospace;color:#d8b4fe;letter-spacing:2px;margin-top:8px">Do  Do  Re  Mi  | Mi  Re  Re</p>' +
  '<p style="font-family:monospace;color:var(--gold);letter-spacing:2px">1   1   2   3  |  3   2   2</p>' +
  '</div>' +
  insight('🎶', '<b>El secreto de aprender melodías:</b> Aprende primero el nombre de las notas (cantando Do-Do-Mi-Fa... mientras tocas). Luego aprende los dedos. Luego el ritmo. Finalmente, combínalos. Este método en capas es mucho más efectivo que intentar hacer todo a la vez desde el principio.') +
  callout('<b>Beethoven escribió la Oda a la Alegría siendo completamente sordo.</b> No podía escuchar ninguna nota, pero podía sentir las vibraciones y ver la música en su mente. Es uno de los actos de creatividad más asombrosos de la historia humana. Cada vez que la tocas, estás interpretando la música de alguien que la soñó en silencio.') +
  magicBox('Plan de práctica MD', 'Día 1: Aprende la Frase 1 (8 notas) lenta, con nombres. Día 2: Repasa Frase 1 y aprende Frase 2. Día 3: Une las dos frases. Día 4: Añade el ritmo con el metrónomo a 60 BPM. Día 5: Sube a 80 BPM. No te saltes los días: la repetición espaciada es como riegar una planta.') +
  makeExercise('ex4-1', '¿Con qué dedo (MD) se toca el Mi en el pentacordo de Do Mayor?', ['Dedo 1 (pulgar)', 'Dedo 4 (anular)', 'Dedo 3 (medio)', 'Dedo 5 (meñique)'], 2) +
  completeBtn();
};

LESSONS['l4-2'] = function() {
  currentLesson = 'l4-2';
  return badge('Modulo 4', '2') +
  lessonTitle('La Mano Izquierda') +
  subtitle('Tu raíz, tu ritmo, tu tierra. La que sostiene.') +
  theory('<p>La <b>mano izquierda</b> en el piano tiene un papel completamente distinto al de la derecha: es el cimiento sobre el que la melodía puede flotar. Toca los bajos, los acordes, el pulso armónico. Es lo que da profundidad y cuerpo al sonido.</p><p>Para principiantes, la mano izquierda generalmente toca algo más simple que la derecha: notas largas, acordes simples, o patrones repetitivos. Esto no significa que sea menos importante: significa que tiene que ser tan sólida y estable que la derecha pueda moverse con libertad sobre ella. Un buen acompañamiento de mano izquierda es como un suelo firme: no lo notas, pero todo depende de él.</p><p>Hoy aprenderás la mano izquierda de la Oda a la Alegría: un acompañamiento de dos notas simples que se alternan. Dedo 5 en Do grave, dedo 1 en Sol. Luego dedo 5 en Do, dedo 1 en Mi. Simple, pero perfecto para acompañar la melodía.</p>') +
  sectionHeader('Mano Izquierda - Acompañamiento básico') +
  pianoHtml({startMidi:43, endMidi:62, WKW:24, height:90, label:'MI: posición sobre Do3-Sol3 (dedos 5-1)', highlight:[
    {midi:48, color:'#bf7af0', label:'5-Do'},
    {midi:52, color:'#e879f9', label:'3-Mi'},
    {midi:55, color:'#fbbf24', label:'1-Sol'},
  ]}) +
  '<div class="btns-row">' +
  btnPlay('▶ Do-Sol alternados', 'playSeq([48,55,48,55,48,55,48,55],80,0.7)') +
  btnPlay('▶ Do-Mi-Sol arpegio', 'playSeq([48,52,55,60],70,0.8)') +
  btnPlay('▶ Acorde Do Mayor MI', 'playChord([48,52,55],2.5,0.5)') +
  '</div>' +
  '<div style="background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:16px 20px;margin-bottom:20px;font-size:.82rem;line-height:2">' +
  '<p style="font-size:.65rem;color:var(--muted2);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;font-weight:700">Acompañamiento simple MI - Oda a la Alegría</p>' +
  '<p style="font-family:monospace;color:#d8b4fe;letter-spacing:2px">Do  Sol | Do  Sol | Do  Sol | Do  Sol</p>' +
  '<p style="font-family:monospace;color:var(--gold);letter-spacing:2px"> 5   1  |  5   1  |  5   1  |  5   1</p>' +
  '<p style="font-family:monospace;color:var(--muted2);font-size:.75rem;margin-top:4px">(un acorde por tiempo, compás 4/4)</p>' +
  '</div>' +
  insight('⚖️', '<b>El equilibrio de las manos:</b> La mano izquierda siempre tiende a tocar más fuerte de lo necesario, porque sus dedos son naturalmente más fuertes. Practica conscientemente tocar la MI más suave que la MD. La melodía debe flotar sobre el acompañamiento, no quedar enterrada bajo él.') +
  callout('<b>El "bajo Alberti":</b> Uno de los patrones de mano izquierda más famosos de la historia. En lugar de tocar un acorde completo, se alternan: nota grave - nota aguda - nota media - nota aguda (1-5-3-5 en el acorde). Mozart lo usó muchísimo. Es un acompañamiento que da movimiento y vida sin robar atención a la melodía.') +
  magicBox('Práctica de MI sola', 'Durante dos días, practica solo la mano izquierda con el metrónomo. Primero a 50 BPM, luego a 70 BPM. El objetivo no es que sea perfecta, sino que sea <em>automática</em>: que puedas tocarla sin pensar demasiado, para liberar tu mente cuando añadas la mano derecha.') +
  makeExercise('ex4-2', '¿Cuál es el rol principal de la mano izquierda para principiantes?', ['Tocar siempre la melodía', 'Tocar el acompañamiento y sostener armónicamente', 'Tocar más fuerte que la derecha', 'Solo tocar notas agudas'], 1) +
  completeBtn();
};

LESSONS['l4-3'] = function() {
  currentLesson = 'l4-3';
  return badge('Modulo 4', '3') +
  lessonTitle('Las Dos Manos Juntas') +
  subtitle('El gran momento. Dos ríos que se encuentran y forman un océano.') +
  theory('<p>Tocar con las dos manos juntas es uno de los desafíos más emocionantes y satisfactorios del piano. Durante un tiempo te sentirás como si tuvieras que hacer dos cosas imposibles simultáneamente. Eso es completamente normal: tu cerebro está aprendiendo a coordinar dos sistemas motores independientes, y eso requiere tiempo.</p><p>El secreto es la <b>práctica por secciones</b>. No intentes tocar toda la pieza con dos manos desde el inicio. Trabaja dos compases a la vez: primero MD sola, luego MI sola, luego juntas. Cuando esos dos compases estén claros, pasa a los dos siguientes. Al final, une las secciones. Este método parece más lento, pero en realidad es mucho más rápido que intentar todo junto.</p><p>Otra técnica poderosa: <em>tocar muy, muy lento</em>. Tan lento que ninguna de las dos manos tenga que apurarse. A ese ritmo, tu cerebro puede atender a ambas manos sin angustia. Gradualmente, el tiempo entre que piensas la nota y que el dedo la toca se reduce. Eso se llama automatización, y es el objetivo real de toda la práctica.</p>') +
  sectionHeader('Oda a la Alegría - Las dos manos') +
  pianoHtml({startMidi:43, endMidi:72, WKW:16, height:80, label:'Posición completa: MI (Do3-Sol3) y MD (Do4-Sol4)', highlight:[
    {midi:48, color:'#e879f9', label:'5'},
    {midi:55, color:'#e879f9', label:'1'},
    {midi:60, color:'#bf7af0', label:'1'},
    {midi:62, color:'#bf7af0', label:'2'},
    {midi:64, color:'#bf7af0', label:'3'},
    {midi:65, color:'#bf7af0', label:'4'},
    {midi:67, color:'#bf7af0', label:'5'},
  ]}) +
  '<div class="btns-row">' +
  btnPlay('▶ Melodía + Acompañamiento', 'playOdeJuntas()') +
  btnPlay('▶ Solo primer compás', 'playSeq([64,64,65,67],60,0.7)') +
  '</div>' +
  '<div style="background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:16px 20px;margin-bottom:20px">' +
  '<p style="font-size:.65rem;color:var(--muted2);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;font-weight:700">Estrategia de práctica para dos manos</p>' +
  '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">' +
  '<div style="background:rgba(191,122,240,.08);border:1px solid rgba(191,122,240,.2);border-radius:8px;padding:12px"><p style="font-size:.78rem;color:var(--accent);font-weight:700;margin-bottom:6px">Día 1-2</p><p style="font-size:.78rem;color:#d8b4fe;line-height:1.6">MD sola, frase por frase. Sin metrónomo al inicio.</p></div>' +
  '<div style="background:rgba(232,121,249,.08);border:1px solid rgba(232,121,249,.2);border-radius:8px;padding:12px"><p style="font-size:.78rem;color:var(--accent2);font-weight:700;margin-bottom:6px">Día 3-4</p><p style="font-size:.78rem;color:#d8b4fe;line-height:1.6">MI sola hasta que sea automática. Con metrónomo a 50 BPM.</p></div>' +
  '<div style="background:rgba(134,239,172,.08);border:1px solid rgba(134,239,172,.2);border-radius:8px;padding:12px"><p style="font-size:.78rem;color:var(--success);font-weight:700;margin-bottom:6px">Día 5-6</p><p style="font-size:.78rem;color:#d8b4fe;line-height:1.6">Juntas, muy lento. 2 compases a la vez, de inicio a fin.</p></div>' +
  '<div style="background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.2);border-radius:8px;padding:12px"><p style="font-size:.78rem;color:var(--gold);font-weight:700;margin-bottom:6px">Día 7+</p><p style="font-size:.78rem;color:#d8b4fe;line-height:1.6">Subir gradualmente el BPM. Agregar expresión y matices.</p></div>' +
  '</div></div>' +
  insight('🧠', '<b>El fenómeno de interferencia:</b> Cuando la mano izquierda y la derecha hacen cosas rítmicamente distintas, el cerebro tiende a sincronizarlas. Es normal que ambas manos "se contagien" entre sí. El antídoto es practicar cada mano tanto tiempo por separado que ya no necesite atención consciente; solo entonces la otra mano puede ser añadida sin interferencia.') +
  callout('<b>Un truco poco conocido:</b> Practica la mano "difícil" (la izquierda para la mayoría) mientras lees un libro o ves televisión. Si puedes hacer la MI sin pensar en ella, la has automatizado. Cuando la automatización ocurre, coordinar las dos manos se convierte en algo mucho más natural.') +
  magicBox('Celebra el proceso', 'Si hoy logras tocar solo los primeros 4 compases con ambas manos, aunque sea lento, eso ya es una victoria real. El piano se aprende nota a nota, compás a compás. Cada pequeño logro es evidencia de que tu cerebro está creciendo. Anota en algún lugar cómo te sentiste la primera vez que las dos manos sonaron juntas.') +
  makeExercise('ex4-3', '¿Cuál es la mejor estrategia para aprender a tocar con las dos manos?', ['Tocar toda la pieza con dos manos desde el primer día', 'Practicar por secciones pequeñas, cada mano sola primero, luego juntas', 'Tocar siempre muy rápido para desarrollar velocidad', 'Ignorar la mano izquierda al inicio'], 1) +
  completeBtn();
};

LESSONS['l5-1'] = function() {
  currentLesson = 'l5-1';
  return badge('Modulo 5', '1') +
  lessonTitle('Triadas Mayores') +
  subtitle('Tres notas. Un mundo entero de color y emoción.') +
  theory('<p>Un <b>acorde</b> es cuando tocas dos o más notas al mismo tiempo. La forma más básica y poderosa de acorde es la <em>triada</em>: tres notas específicas que suenan juntas. La triada Mayor tiene una sonoridad brillante, abierta, luminosa. Es el color del sol en la música.</p><p>La fórmula de una triada Mayor es siempre la misma: la <b>tónica</b> (raíz del acorde), más la <b>tercera Mayor</b> (4 semitonos arriba de la tónica), más la <b>quinta justa</b> (7 semitonos arriba de la tónica). Para Do Mayor: Do (60) + Mi (64) + Sol (67). Para Fa Mayor: Fa (65) + La (69) + Do (72). Para Sol Mayor: Sol (67) + Si (71) + Re (74).</p><p>Estos tres acordes (Do, Fa y Sol) son los más importantes de la tonalidad de Do Mayor. Con solo estos tres acordes puedes acompañar cientos de canciones populares. Son los bloques de construcción de casi toda la música occidental.</p>') +
  sectionHeader('Los tres acordes fundamentales en Do Mayor') +
  '<div class="chord-grid">' +
  '<div class="chord-card" onclick="playChord([60,64,67],2,0.5)">' +
  '<h3>Do Mayor</h3><p>Do - Mi - Sol</p>' +
  '<div style="font-size:.7rem;color:var(--muted2)">Tónica · I</div>' +
  '<div style="margin-top:8px;font-size:.75rem;color:var(--accent)">▶ Escuchar</div>' +
  '</div>' +
  '<div class="chord-card" onclick="playChord([65,69,72],2,0.5)">' +
  '<h3>Fa Mayor</h3><p>Fa - La - Do</p>' +
  '<div style="font-size:.7rem;color:var(--muted2)">Subdominante · IV</div>' +
  '<div style="margin-top:8px;font-size:.75rem;color:var(--accent)">▶ Escuchar</div>' +
  '</div>' +
  '<div class="chord-card" onclick="playChord([67,71,74],2,0.5)">' +
  '<h3>Sol Mayor</h3><p>Sol - Si - Re</p>' +
  '<div style="font-size:.7rem;color:var(--muted2)">Dominante · V</div>' +
  '<div style="margin-top:8px;font-size:.75rem;color:var(--accent)">▶ Escuchar</div>' +
  '</div>' +
  '</div>' +
  pianoHtml({startMidi:57, endMidi:77, WKW:22, height:90, label:'Acorde Do Mayor resaltado: Do-Mi-Sol', highlight:[
    {midi:60, color:'#bf7af0', label:'Do'},
    {midi:64, color:'#e879f9', label:'Mi'},
    {midi:67, color:'#fbbf24', label:'Sol'},

  '<div class="btns-row">' +
  btnPlay('▶ Progresión I-IV-V-I', 'playProgIVV()') +
  btnPlay('▶ Arpegios I-IV-V', 'playSeq([60,64,67,65,69,72,67,71,74,60,64,67],70,0.6)') +
  '</div>' +
  insight('🌟', '<b>La magia del I-IV-V:</b> La progresión Do-Fa-Sol (I-IV-V) es la base de miles de canciones: blues, rock, pop, música folk. Los acordes I, IV y V se relacionan matemáticamente: sus frecuencias tienen proporciones simples que el oído humano percibe como naturales y satisfactorias. Es como si fueran los tres colores primarios de la armonía.') +
  callout('<b>Inversiones de acordes:</b> Un acorde puede tocarse en diferentes órdenes. Do-Mi-Sol es la posición fundamental. Mi-Sol-Do es la primera inversión. Sol-Do-Mi es la segunda inversión. Las tres contienen las mismas notas, pero suenan ligeramente diferentes y crean diferentes "sabores". Las inversiones hacen que la mano izquierda pueda moverse suavemente entre acordes sin grandes saltos.') +
  magicBox('Práctica de acordes básicos', 'Toca Do Mayor 4 veces (un compás). Luego Fa Mayor 4 veces. Luego Sol Mayor 4 veces. Vuelve a Do. Repite el ciclo 10 veces con el metrónomo a 60 BPM. Cuando puedas cambiar entre ellos sin pausas, habrás dominado la progresión más importante del piano para principiantes.') +
  makeExercise('ex5-1', '¿Cuántos semitonos hay entre la tónica y la tercera de una triada Mayor?', ['3 semitonos', '5 semitonos', '4 semitonos', '7 semitonos'], 2) +

LESSONS['l5-2'] = function() {
  currentLesson = 'l5-2';
  return badge('Modulo 5', '2') +
  lessonTitle('Triadas Menores') +
  subtitle('La sombra que hace brillar la luz. El lenguaje de la profundidad.') +
  theory('<p>Si las triadas Mayores son el sol, las triadas <b>menores</b> son el crepúsculo: igual de hermosas, pero con una emoción diferente. Más íntimas, más melancólicas, más profundas. La diferencia entre Mayor y menor es de un solo semitono en la tercera, pero ese semitono lo cambia todo.</p><p>La fórmula de la triada menor: tónica + <b>tercera menor</b> (3 semitonos, en lugar de 4) + quinta justa (7 semitonos). Para La menor: La + Do + Mi. Para Re menor: Re + Fa + La. Para Mi menor: Mi + Sol + Si. Observa que estos tres acordes menores también viven naturalmente en la tonalidad de Do Mayor, usando solo teclas blancas.</p><p>En la tonalidad de Do Mayor, los acordes naturales son: Do Mayor, Re menor, Mi menor, Fa Mayor, Sol Mayor, La menor, Si disminuido. Cada posición (I, II, III...) tiene una "calidad" (Mayor, menor, o disminuido). Entender esto te ayuda a predecir qué acordes sonarán bien juntos.</p>') +
  sectionHeader('Triadas menores en Do Mayor') +
  '<div class="chord-grid">' +
  '<div class="chord-card" onclick="playChord([69,72,76],2,0.5)">' +
  '<h3>La menor</h3><p>La - Do - Mi</p>' +
  '<div style="font-size:.7rem;color:var(--muted2)">VI grado</div>' +
  '<div style="margin-top:8px;font-size:.75rem;color:var(--accent)">▶ Escuchar</div>' +

  '<div style="margin-top:8px;font-size:.75rem;color:var(--accent)">▶ Escuchar</div>' +
  '</div>' +
  '<div class="chord-card" onclick="playChord([64,67,71],2,0.5)">' +

  pianoHtml({startMidi:57, endMidi:79, WKW:22, height:90, label:'La menor: La-Do-Mi (haz click para escuchar el acorde)', highlight:[
    {midi:69, color:'#bf7af0', label:'La'},
