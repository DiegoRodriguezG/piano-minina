  '</div>' +
  insight('🌙', '<b>La progresión I-V-VI-IV:</b> Do-Sol-La menor-Fa. Esta progresión aparece en cientos de canciones pop modernas. La belleza está en que el VI menor (La menor) crea ese momento emotivo que todos reconocemos. Escucha cualquier balada pop y encontrarás esta progresión o una variación de ella.') +
  callout('<b>Mayor → menor, el truco del semitono:</b> Para convertir cualquier acorde Mayor en menor, solo baja la tercera un semitono. Do Mayor (Do-Mi-Sol) se convierte en Do menor (Do-Mib-Sol). Es el cambio más pequeño con el efecto emocional más grande en toda la música.') +
  magicBox('Comparación de colores', 'Toca Do Mayor (Do-Mi-Sol). Luego toca La menor (La-Do-Mi). Cierra los ojos y escucha la diferencia de "color" o "temperatura" entre los dos acordes. No hay respuesta correcta: ¿a qué te recuerda cada uno? Esta conciencia emocional de los acordes es lo que eventualmente te permitirá elegir las notas "correctas" para expresar lo que sientes.') +
  makeExercise('ex5-2', '¿Cuántos semitonos hay entre la tónica y la tercera en una triada menor?', ['4 semitonos', '5 semitonos', '2 semitonos', '3 semitonos'], 3) +
  completeBtn();
};

LESSONS['l5-3'] = function() {
  currentLesson = 'l5-3';
  return badge('Modulo 5', '3') +
  lessonTitle('Progresiones de Acordes') +
  subtitle('Cuando los acordes se mueven, nace la música. El viaje entre colores.') +
  theory('<p>Una <b>progresión de acordes</b> es una secuencia de acordes que se repite o que lleva de un punto armónico a otro. Las progresiones no son solo "acordes que se tocan en orden": tienen una lógica interna, una sensación de movimiento, de tensión y resolución, de preguntas y respuestas.</p><p>La progresión más satisfactoria de la música occidental es la <b>V→I</b> (Sol→Do en nuestra tonalidad). El acorde de Sol (Dominante) tiene una "tensión" natural que quiere resolver hacia Do (Tónica). Es como una pregunta que encuentra su respuesta. Bach, Mozart, Beethoven, los Beatles, Beyoncé: todos usan esta resolución, porque el oído humano la percibe como un momento de llegada, de reposo, de hogar.</p><p>Existen algunas progresiones tan usadas que se han vuelto universales: <em>I-IV-V-I</em> (blues, rock), <em>I-V-VI-IV</em> (pop), <em>II-V-I</em> (jazz), <em>VI-IV-I-V</em> (baladas). Aprenderlas no es copiar: es aprender el vocabulario con el que puedes decir cosas originales.</p>') +
  sectionHeader('Progresiones populares para escuchar') +
  '<div class="chord-grid">' +
  '<div class="chord-card" onclick="playSeq([60,65,67,60],55,1.8)">' +
  '<h3>I - IV - V - I</h3><p>Do - Fa - Sol - Do</p>' +
  '<div style="font-size:.7rem;color:var(--muted2)">Blues / Rock / Folk</div>' +
  '<div style="margin-top:8px;font-size:.75rem;color:var(--accent)">▶ Escuchar tónicas</div>' +
  '</div>' +
  '<div class="chord-card" onclick="playProgPop()">' +
  '<h3>I - V - VI - IV</h3><p>Do - Sol - Lam - Fa</p>' +
  '<div style="font-size:.7rem;color:var(--muted2)">Pop moderno</div>' +
  '<div style="margin-top:8px;font-size:.75rem;color:var(--accent)">▶ Escuchar</div>' +
  '</div>' +
  '<div class="chord-card" onclick="playProgVI()">' +
  '<h3>VI - IV - I - V</h3><p>Lam - Fa - Do - Sol</p>' +
  '<div style="font-size:.7rem;color:var(--muted2)">Baladas / Romantico</div>' +
  '<div style="margin-top:8px;font-size:.75rem;color:var(--accent)">▶ Escuchar</div>' +
  '</div>' +
  '</div>' +
  pianoHtml({startMidi:55, endMidi:77, WKW:20, height:85, label:'Acordes I-IV-V en Do Mayor', highlight:[
    {midi:60, color:'#bf7af0', label:'I'},
    {midi:64, color:'#bf7af0', label:''},
    {midi:67, color:'#bf7af0', label:''},
    {midi:65, color:'#e879f9', label:'IV'},
    {midi:69, color:'#e879f9', label:''},
    {midi:72, color:'#e879f9', label:''},
    {midi:74, color:'#fbbf24', label:'Re'},
    {midi:71, color:'#fbbf24', label:'Si'},
  ]}) +
  insight('🎸', '<b>El cifrado de acordes:</b> En música popular, los acordes se indican con letras: C = Do Mayor, Am = La menor, F = Fa Mayor, G = Sol Mayor. En música clásica se usan números romanos (I, II, III...). Ambos sistemas son útiles: el cifrado de letras te permite leer una canción cualquiera; los números romanos te permiten transportar una progresión a cualquier tonalidad.') +
  callout('<b>El círculo de quintas:</b> Existe un diagrama circular que muestra cómo se relacionan todas las tonalidades entre sí. Los acordes vecinos en ese círculo suenan especialmente bien juntos. Do-Fa-Sol son tres vecinos en el círculo de quintas. Eso explica por qué I-IV-V funciona tan bien: son acordes que viven cerca en el espacio armónico.') +
  magicBox('Tu primera improvisación', 'Pon el metrónomo a 70 BPM. Con la mano izquierda, toca esta progresión en bucle: Do (4 tiempos) - Fa (4 tiempos) - Sol (4 tiempos) - Do (4 tiempos). Con la mano derecha, improvisa usando solo las notas Do-Re-Mi-Fa-Sol. No pienses, solo juega. Si una nota suena "mal", la siguiente puede rescatarla. Eso es improvisar.') +
  makeExercise('ex5-3', '¿Qué acorde en Do Mayor es la Dominante (V grado)?', ['Fa Mayor', 'La menor', 'Re menor', 'Sol Mayor'], 3) +
  completeBtn();
};

LESSONS['l6-1'] = function() {
  currentLesson = 'l6-1';
  return badge('Modulo 6', '1') +
  lessonTitle('Dinámica') +
  subtitle('La misma nota puede susurrar o gritar. El volumen es emoción.') +
  theory('<p>La <b>dinámica</b> es el conjunto de variaciones de intensidad o volumen en la música. Es uno de los elementos expresivos más poderosos del piano, y uno de los que distinguen a un pianista que "toca las notas correctas" de uno que realmente hace música.</p><p>Las marcas dinámicas en la partitura se escriben en italiano: <em>pp</em> (pianissimo: muy suave), <em>p</em> (piano: suave), <em>mp</em> (mezzopiano: moderadamente suave), <em>mf</em> (mezzoforte: moderadamente fuerte), <em>f</em> (forte: fuerte), <em>ff</em> (fortissimo: muy fuerte). Hay también <em>crescendo</em> (gradualmente más fuerte, ——<) y <em>decrescendo</em> o <em>diminuendo</em> (gradualmente más suave, >——).</p><p>En el piano, la dinámica se controla con la <b>velocidad con que los dedos presionan las teclas</b>. Un golpe rápido produce un sonido fuerte; un descenso lento y suave produce un sonido delicado. Esta es la magia del piano: el nombre completo del instrumento, "pianoforte", significa exactamente eso: que puede tocar tanto suave como fuerte, algo que los instrumentos de teclado anteriores no podían hacer.</p>') +
  sectionHeader('Escala de dinámicas') +
  '<div style="background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:24px">' +
  '<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">' +
  ['pp','p','mp','mf','f','ff'].map(function(d, i) {
    var vols = [0.12, 0.25, 0.38, 0.52, 0.7, 0.9];
    var sizes = ['0.8rem','0.95rem','1.1rem','1.3rem','1.6rem','2rem'];
    var colors = ['#a78bfa','#bf7af0','#c084fc','#d946ef','#e879f9','#f0abfc'];
    return '<div style="text-align:center;cursor:pointer;padding:10px 14px;border:1px solid var(--border);border-radius:10px;transition:all .15s" ' +
      'onmouseenter="this.style.borderColor=\'var(--accent)\'" onmouseleave="this.style.borderColor=\'var(--border)\'" ' +
      'onclick="playPiano(60,2,' + vols[i] + ')">' +
      '<div style="font-size:' + sizes[i] + ';font-style:italic;color:' + colors[i] + ';font-weight:700;font-family:serif">' + d + '</div>' +
      '<div style="font-size:.6rem;color:var(--muted2);margin-top:4px">▶ Do</div></div>';
  }).join('') +
  '</div>' +
  '<p style="font-size:.75rem;color:var(--muted2);margin-top:12px;font-style:italic">Haz click en cada dinámica para escuchar el Do4 con esa intensidad</p>' +
  '</div>' +
  insight('🎭', '<b>La dinámica como narrativa:</b> Imagina que tocas una historia. Un crescendo puede ser tensión que aumenta, un personaje que corre, una ola que crece. Un diminuendo puede ser alejarse, dormirse, la lluvia que se calma. Cuando le asignas un significado narrativo a las dinámicas, tu cuerpo las ejecuta de forma más natural y musical.') +
  callout('<b>El error más común:</b> Muchos principiantes tocan siempre con la misma intensidad (generalmente mf). La música sin dinámica es como una conversación en un solo tono: técnicamente correcta, pero sin alma. La dinámica es lo que hace que la música respire, que tenga vida.') +
  '<div class="btns-row">' +
  btnPlay('▶ Do Mayor pp (muy suave)', 'playChord([60,64,67],3,0.12)') +
  btnPlay('▶ Do Mayor f (fuerte)', 'playChord([60,64,67],3,0.8)') +
  btnPlay('▶ Escala con crescendo', 'playScaleCrescendo()') +
  '</div>' +
  magicBox('Ejercicio de dinámicas', 'Toca la escala de Do Mayor tres veces seguidas: la primera muy suave (pp), la segunda media (mf), la tercera fuerte (f). Escucha la diferencia. Luego toca la escala una sola vez, haciendo un crescendo desde Do hasta Sol y un diminuendo desde Sol hasta Do de vuelta. Eso se llama una "dinámica en arco" y suena increíblemente musical.') +
  makeExercise('ex6-1', '¿Cómo se produce un sonido más suave en el piano acústico?', ['Presionando las teclas más rápido', 'Presionando las teclas más lentamente y con menos fuerza', 'Usando el pedal izquierdo siempre', 'Tocando con la punta de las uñas'], 1) +
  completeBtn();
};

LESSONS['l6-2'] = function() {
  currentLesson = 'l6-2';
  return badge('Modulo 6', '2') +
  lessonTitle('Legato y Staccato') +
  subtitle('La diferencia entre un abrazo y un guiño. La articulación da carácter.') +
  theory('<p>La <b>articulación</b> es la forma en que conectas (o separas) las notas. Los dos extremos son el <em>legato</em> y el <em>staccato</em>.</p><p>El <b>legato</b> (del italiano "ligado") significa tocar las notas de forma conectada, sin silencio entre ellas. En el piano, se logra levantando el dedo de la tecla exactamente cuando el siguiente dedo la toca. El resultado es una línea melódica fluida, como agua que corre. El legato imita a la voz humana y a los instrumentos de viento: es la articulación más cantante y expresiva.</p><p>El <b>staccato</b> (del italiano "separado") significa acortar la duración de cada nota y dejar un breve silencio antes de la siguiente. En la partitura se indica con un pequeño punto sobre o bajo la nota. El staccato da ligereza, picardía, energía. Piensa en las teclas como si fueran patatas calientes: las tocas y las sueltas rápidamente.</p><p>Entre legato y staccato existe toda una gama de articulaciones: <em>portato</em> (semi-staccato), <em>tenuto</em> (sostener el valor completo con énfasis), <em>accent</em> (enfatizar la nota). La articulación correcta puede transformar completamente el carácter de una pieza.</p>') +
  pianoHtml({startMidi:59, endMidi:74, WKW:26, height:95, label:'Escala de Do Mayor - practica legato: un dedo se alza al caer el siguiente', highlight:[
    {midi:60, color:'#bf7af0', label:'Do'},
    {midi:62, color:'#a78bfa', label:'Re'},
    {midi:64, color:'#a78bfa', label:'Mi'},
    {midi:65, color:'#a78bfa', label:'Fa'},
    {midi:67, color:'#a78bfa', label:'Sol'},
    {midi:69, color:'#a78bfa', label:'La'},
    {midi:71, color:'#a78bfa', label:'Si'},
    {midi:72, color:'#e879f9', label:'Do'},
  ]}) +
  '<div class="btns-row">' +
  btnPlay('▶ Escala legato', 'playSeq([60,62,64,65,67,69,71,72],80,0.7)') +
  btnPlay('▶ Escala staccato', 'playScaleStaccato()') +
  btnPlay('▶ Comparar ambas', 'playBothArticulations()') +
  '</div>' +
  insight('✋', '<b>Cómo practicar el legato:</b> Coloca un lápiz sobre el dorso de tu mano mientras practicas. Si el lápiz cae, significa que tu muñeca se mueve demasiado. El legato perfecto viene de los dedos, no de la muñeca. La muñeca debe permanecer estable y el movimiento debe ser solo de la articulación de cada dedo.') +
  callout('<b>El pedal de sustain:</b> En el piano acústico, el pedal derecho (pedal de sustain o "forte pedal") mantiene las notas sonando después de soltar las teclas. Es tentador usarlo para simular legato, pero eso es trampa: enmascara las uniones entre notas y puede crear un sonido turbio. Aprende el legato verdadero con los dedos antes de depender del pedal.') +
  magicBox('Ejercicio de contraste', 'Toca la siguiente secuencia dos veces: Do-Re-Mi-Fa-Sol. La primera vez, legato (notas conectadas, fluidas, como cantando). La segunda vez, staccato (notas cortas, saltarinas, como timbre de campanita). Luego alterna: una nota legato, una staccato. Este ejercicio desarrolla el control independiente de cada dedo.') +
  makeExercise('ex6-2', '¿Cómo se indica el staccato en una partitura?', ['Con una línea larga bajo la nota', 'Con una "L" sobre la nota', 'Con un pequeño punto sobre o bajo la nota', 'Con una flecha hacia arriba'], 2) +
  completeBtn();
};

LESSONS['l6-3'] = function() {

  return badge('Modulo 6', '3') +
  lessonTitle('Escalas Mayores Comunes') +
  subtitle('El mismo patrón, nuevos colores. La fórmula que viaja por todo el teclado.') +
  theory('<p>Ya conoces la escala de Do Mayor. Ahora es momento de entender que <b>cualquier nota puede ser el inicio de una escala Mayor</b>: solo hay que aplicar la misma fórmula de intervalos (T-T-S-T-T-T-S) desde esa nota. El resultado siempre tendrá el mismo sonido "mayor", pero con un color diferente, un poco más oscuro o más brillante según la tonalidad.</p><p>Las escalas más comunes para comenzar (después de Do Mayor) son <em>Sol Mayor</em> (un sostenido: Fa#), <em>Re Mayor</em> (dos sostenidos: Fa# y Do#), y <em>Fa Mayor</em> (un bemol: Sib). Cada tonalidad tiene su propia "personalidad" que los músicos y compositores han sentido y explorado a lo largo de la historia.</p><p>Practicar múltiples escalas no es solo teoría: desarrolla la memoria muscular en diferentes posiciones del teclado, mejora la fluidez de los dedos, y te prepara para tocar música en cualquier tonalidad. Es la diferencia entre saber leer solo en mayúsculas y poder leer cualquier tipografía.</p>') +
  sectionHeader('Sol Mayor (Fa#)') +
  pianoHtml({startMidi:60, endMidi:81, WKW:18, height:80, label:'Sol Mayor: igual que Do Mayor pero con Fa# (tecla negra)', highlight:[
    {midi:67, color:'#bf7af0', label:'Sol'},
    {midi:69, color:'#a78bfa', label:'La'},
    {midi:71, color:'#a78bfa', label:'Si'},
    {midi:72, color:'#a78bfa', label:'Do'},
    {midi:74, color:'#a78bfa', label:'Re'},
    {midi:76, color:'#a78bfa', label:'Mi'},
    {midi:78, color:'#e879f9', label:'Fa#'},
    {midi:79, color:'#bf7af0', label:'Sol'},

  '<div class="btns-row">' +
  btnPlay('▶ Sol Mayor', 'playSeq([67,69,71,72,74,76,78,79],80,0.6)') +
  btnPlay('▶ Fa Mayor', 'playSeq([65,67,69,70,72,74,76,77],80,0.6)') +

  '</div>' +
  sectionHeader('Fa Mayor (Sib)') +
  pianoHtml({startMidi:59, endMidi:79, WKW:18, height:80, label:'Fa Mayor: Fa-Sol-La-Sib-Do-Re-Mi-Fa', highlight:[
    {midi:65, color:'#bf7af0', label:'Fa'},
    {midi:67, color:'#a78bfa', label:'Sol'},
    {midi:69, color:'#a78bfa', label:'La'},
    {midi:70, color:'#e879f9', label:'Sib'},
    {midi:72, color:'#a78bfa', label:'Do'},
    {midi:74, color:'#a78bfa', label:'Re'},
    {midi:76, color:'#a78bfa', label:'Mi'},
    {midi:77, color:'#bf7af0', label:'Fa'},
  ]}) +
  insight('🗺️', '<b>El círculo de quintas como mapa de escalas:</b> Cada vez que subes una quinta (7 semitonos) desde una tonalidad, añades un sostenido. Do (0 #) → Sol (1 #: Fa#) → Re (2 #: Fa#, Do#) → La (3 #)... Cada vez que bajas una quinta, añades un bemol. Do (0 b) → Fa (1 b: Sib) → Sib (2 b)... Este patrón perfecto es uno de los más elegantes de toda la teoría musical.') +
  callout('<b>¿Por qué practicar escalas?</b> Los pianistas profesionales practican escalas todos los días, incluso después de décadas. No porque no las sepan, sino porque mantienen la agilidad técnica y la memoria muscular en todas las posiciones del teclado. Es como hacer stretching: necesario aunque ya estés en forma.') +
  magicBox('Plan de escalas semanal', 'Semana 1: Do Mayor (sin sostenidos). Semana 2: Sol Mayor (Fa#). Semana 3: Fa Mayor (Sib). Semana 4: Re Mayor (Fa#, Do#). Practica cada una 5 minutos al día, subiendo y bajando, con ambas manos por separado. Después de un mes habrás desarrollado una fluidez que se nota en todo lo que toques.') +
  makeExercise('ex6-3', '¿Qué nota necesita sostenido (#) en la escala de Sol Mayor?', ['Do#', 'Si#', 'Fa#', 'La#'], 2) +

};

LESSONS['l7-1'] = function() {
  currentLesson = 'l7-1';
  return badge('Modulo 7', '1') +
  lessonTitle('Escala Pentatonica') +
  subtitle('Cinco notas. La escala universal. La que todos conocen sin saberlo.') +
  theory('<p>La <b>escala pentatónica Mayor</b> es una de las escalas más universales de la música. "Penta" = cinco, "tónica" = notas. En lugar de 7 notas como la escala Mayor completa, tiene solo 5. Y esas 5 notas tienen algo especial: cualquier combinación de ellas suena bien. No hay "notas malas" en la pentatónica. Por eso es perfecta para improvisar.</p><p>La pentatónica Mayor de Do usa las notas: <b>Do - Re - Mi - Sol - La</b>. Omite el Fa y el Si, que son las notas que generan más tensión en la escala Mayor. Sin esas tensiones, todo lo que toques dentro de la pentatónica sonará consonante y musical.</p><p>Esta escala no es solo occidental: aparece en la música tradicional de China, África, Escocia, Japón, América Latina. Es como si fuera parte del lenguaje musical universal del ser humano. Muchas de las canciones de rock, blues y pop que conoces están construidas sobre escalas pentatónicas. Es la escala que "todos reconocen sin saber por qué".</p>') +
  sectionHeader('Pentatónica Mayor de Do') +
  pianoHtml({startMidi:57, endMidi:74, WKW:26, height:95, label:'Do-Re-Mi-Sol-La: las 5 notas de la pentatónica', highlight:[

  '<p style="font-size:.7rem;color:var(--muted2);margin-bottom:14px;text-transform:uppercase;letter-spacing:1px;font-weight:700">Pentatónica en las teclas negras</p>' +

  magicBox('Tu primera improvisación libre', 'Pon el metrónomo a 70 BPM. Con la mano izquierda toca Do-Sol alternados (o un acorde de Do cada 4 tiempos). Con la mano derecha, improvisa usando solo Do-Re-Mi-Sol-La. No pienses: solo mueve los dedos y escucha. Grábate con el teléfono. Escúchate después. Te sorprenderás.') +

LESSONS['l7-2'] = function() {

  return badge('Modulo 7', '2') +
  lessonTitle('Escalas Menores') +
  subtitle('La otra mitad del universo musical. La emoción que completa el cuadro.') +
  theory('<p>Así como cada color de luz tiene su complementario, cada escala Mayor tiene su escala <b>relativa menor</b>. La relativa menor de Do Mayor es <em>La menor</em>: usa exactamente las mismas notas (solo teclas blancas), pero empieza desde La en lugar de Do. Este cambio de punto de partida cambia todo el carácter: de luminoso a íntimo, de abierto a reflexivo.</p><p>La escala de <b>La menor natural</b> es: La - Si - Do - Re - Mi - Fa - Sol - La. Su fórmula es T-S-T-T-S-T-T. La diferencia clave con Do Mayor es que la tercera (Do) es "menor" (3 semitonos desde la tónica en lugar de 4), lo que da ese color más oscuro y emotivo.</p><p>Existe también la <b>escala menor armónica</b>: igual que la menor natural, pero con el 7° grado subido un semitono (Sol# en lugar de Sol). Esto crea una tensión poderosísima entre Sol# y La, que resuelve de forma muy dramática. La escala menor armónica es la que más se usa en música clásica y flamenca.</p>') +
  sectionHeader('La menor natural') +
  pianoHtml({startMidi:57, endMidi:76, WKW:22, height:90, label:'La menor: La-Si-Do-Re-Mi-Fa-Sol-La', highlight:[
    {midi:57, color:'#bf7af0', label:'La'},

    {midi:60, color:'#a78bfa', label:'Do'},

  insight('🌗', '<b>Mayor vs. menor: la tercera lo decide todo:</b> El tercer grado de una escala determina si suena Mayor o menor. Do Mayor tiene Mi (4 semitonos desde Do). La menor tiene Do (3 semitonos desde La). Ese semitono de diferencia en la tercera es lo que separa la alegría de la melancolía en toda la música occidental.') +
  callout('<b>Las modalidades:</b> Además de Mayor y menor, existen otros "modos" musicales: Dórico, Frigio, Lidio, Mixolidio, Locrio... Cada modo tiene la misma colección de notas que una escala Mayor, pero empieza desde un grado diferente. Son como mirar el mismo paisaje desde distintos ángulos. El modo Dórico (como Re menor pero con Si natural) es el del jazz y el folk celta.') +
  magicBox('Meditación en menor', 'Improvisa libremente usando solo La-Si-Do-Re-Mi-Fa-Sol, empezando y terminando siempre en La. Cierra los ojos. Toca lento. ¿A qué te recuerda este sonido? ¿Qué emoción aparece? Escribe una palabra que describa la sensación. Esa conexión entre escala y emoción es la base de la composición musical.') +

  });
}

  var delay = 0;
  [[60,64,67],[67,71,74],[69,72,76],[65,69,72]].forEach(function(chord) {
    setTimeout(function() { playChord(chord, 1.8, 0.5); }, delay);

  });

function playProgVI() {
  var delay = 0;
  [[69,72,76],[65,69,72],[60,64,67],[67,71,74]].forEach(function(chord) {
    setTimeout(function() { playChord(chord, 1.8, 0.5); }, delay);

  });

  var melody = [64,64,65,67,67,65,64,62,60,60,62,64,64,62,62];
  var bass = [60,60,65,67,67,65,60,60,60,60,62,60,60,62,60];
  var delay = 0;

function playScaleStaccato() {

}

  ['¿La nota Si (B) tiene tecla negra a su derecha inmediata?','TF',false,'A la derecha de Si está directamente Do (el siguiente), sin tecla negra de por medio. Este es uno de los dos semitonos sin tecla negra.'],
  ['¿El piano de 88 teclas empieza en Do1?','TF',false,'Empieza en La0 (A0). Muchos asumen que empieza en Do porque Do es la referencia de la escala, pero el teclado completo va de La0 a Do8.'],
  ['Si cuento 7 teclas BLANCAS hacia la derecha desde cualquier Do, llego a...',['Si (B)','Re (D)','Do de la siguiente octava','La (A)'],2,'Do → Re → Mi → Fa → Sol → La → Si → Do. La octava 7 notas blancas más arriba siempre es otro Do.']
],
'l1-3':[
  ['¿Qué número se asigna al dedo PULGAR en la numeración pianística?',['0','1','2','3'],1,'El pulgar es el dedo 1. Los dedos se numeran del 1 al 5: pulgar(1), índice(2), medio(3), anular(4), meñique(5). Aplica igual para ambas manos.'],
  ['¿Cuál es el dedo número 4?',['Índice','Medio','Anular','Meñique'],2,'Anular = dedo 4. Meñique = 5. El anular suele ser el más débil al comenzar y requiere ejercicios especiales para fortalecerlo.'],
  ['La forma correcta de los dedos al tocar piano es...',['Extendidos completamente planos','Curvados, como si sostuvieras una naranja pequeña','Completamente doblados hacia adentro','Apuntando hacia abajo en ángulo recto'],1,'Los dedos curvados permiten que la yema toque la tecla con control. Los dedos planos causan golpes imprecisos y cansancio muscular.'],
  ['¿El pianista debe sentarse en el centro (fondo) del banco?','TF',false,'Debes sentarte en el borde frontal del banco (primer tercio), no en el fondo. Esto permite que los brazos se extiendan libremente y que las piernas alcancen los pedales.'],
  ['Los antebrazos del pianista deben estar...',['Inclinados hacia arriba (muñeca más alta que el codo)','Horizontales, paralelos al suelo','Inclinados hacia abajo (muñeca más baja que el codo)','Perpendiculares al teclado'],1,'Los antebrazos horizontales reducen tensión en la muñeca y permiten transferir el peso del brazo al teclado de forma natural.'],
  ['Si el dedo 3 (medio) de tu mano derecha está en Mi4, ¿en qué tecla está el dedo 1 (pulgar)?',['Re4','Do4','Fa4','Si3'],1,'Posición de pentacordio en Do: dedo1=Do4, dedo2=Re4, dedo3=Mi4, dedo4=Fa4, dedo5=Sol4. El dedo 1 siempre queda en Do4.'],
  ['Si el dedo 1 (pulgar) de tu mano IZQUIERDA está en Sol3, ¿qué nota toca el dedo 5 (meñique)?',['Re3','Mi3','Do3','Fa3'],2,'MI: dedo1=Sol3, dedo2=Fa3, dedo3=Mi3, dedo4=Re3, dedo5=Do3. La mano izquierda va en dirección contraria a la derecha.'],
  ['¿La muñeca debe estar más alta que los nudillos al tocar?','TF',false,'La muñeca debe estar nivelada con el antebrazo y los nudillos, ligeramente redondeada. Ni doblada hacia arriba ni hacia abajo — eso genera tensión y riesgo de lesiones.'],
  ['¿Los pies del pianista deben estar levantados mientras toca?','TF',false,'Los pies deben estar planos en el suelo (o sobre los pedales). Los pies planos dan estabilidad al cuerpo y permiten trabajar con los pedales sin tensión.'],
  ['¿Cuál es el error más común de postura en principiantes?',['Sentarse muy lejos del piano','Tocar con los dedos extendidos y planos en lugar de curvados','Mantener los codos demasiado cerca del cuerpo','Mantener los hombros muy bajos'],1,'Los dedos planos ("golpear" con la yema extendida) es el error más frecuente. Reduce control, velocidad y aumenta el riesgo de tensión muscular.']
],
'l2-1':[
  ['¿Qué número MIDI corresponde al Do Central (C4)?',['48','56','60','64'],2,'MIDI 60 = Do Central (C4). Esta es una referencia universal en música electrónica y digital. La nota La4 = MIDI 69 y sirve de referencia para afinar a 440 Hz.'],
  ['¿En qué octava está el Do Central?',['3ª octava (C3)','4ª octava (C4)','5ª octava (C5)','2ª octava (C2)'],1,'C4 significa "Do de la 4ª octava". La numeración de octavas sube con cada Do: C1, C2, C3, C4 (central), C5...'],
  ['¿Dónde aparece el Do Central en la clave de Sol (treble)?',['En la 1ª línea desde abajo','En un espacio entre líneas','En una línea adicional DEBAJO del pentagrama','En el espacio debajo de la 1ª línea'],2,'El Do Central está en la primera línea adicional DEBAJO del pentagrama de clave de Sol. Por eso "conecta" visualmente con la clave de Fa (bass) donde está encima.'],
  ['¿Cuántos Do hay en un piano de 88 teclas?',['7','8','9','6'],1,'De Do1 a Do8 son 8 Do. El piano termina exactamente en Do8, por eso hay 8 aunque solo tenga 7 octavas completas.'],
  ['¿Cuál es el número de tecla del Do Central en un piano de 88 teclas (contando desde La0=1)?',['36','38','40','44'],2,'La0=1, A#0=2, B0=3, luego C1=4... C4 = 3 + (3×12) + 1 = 3+36+1 = 40. La tecla número 40.'],
  ['El Do Central se llama "central" principalmente porque...',['Es la nota más fácil de tocar','Está en el centro del teclado Y en el centro del gran pentagrama (entre treble y bass)','Es la primera nota que aprenden todos los pianistas','Es la nota del tono de referencia internacional'],1,'El Do Central es el punto de unión entre la clave de Sol (mano derecha) y la clave de Fa (mano izquierda). Está físicamente cerca del centro del teclado y musicalmente en el centro del gran pentagrama.'],
  ['¿Cuántos semitonos hay entre el Do Central (C4) y el Do siguiente (C5)?',['6','10','12','7'],2,'Una octava siempre tiene 12 semitonos. De C4 a C5 hay exactamente 12 semitonos = 1 octava.'],
  ['¿Qué nota es un semitono MÁS GRAVE que el Do Central?',['Si3 (B3)','Re4 (D4)','La#3 (Bb3)','Mi4 (E4)'],0,'Un semitono abajo de C4 es Si3 (B3). La tecla negra anterior a Do no existe (entre Si y Do no hay negra), así que Si es directamente adyacente a Do.'],
  ['¿Re4 (D4) es MÁS AGUDO que Do4 (C4)?','TF',true,'Sí. Las notas suben de izquierda a derecha. Re4 está a la derecha de Do4, así que es más agudo. Subir = más a la derecha = mayor número MIDI.'],
  ['¿El Do Central es siempre la misma tecla física independientemente del piano?','TF',true,'Sí. Cualquier piano de 88 teclas tiene el Do Central en la misma posición relativa. Es una convención universal de la notación musical moderna.']
],
'l2-2':[
  ['¿Cuál es la fórmula de distancias (tonos/semitonos) de la escala MAYOR?',['T-T-T-S-T-T-S','T-S-T-T-T-S-T','T-T-S-T-T-T-S','S-T-T-T-S-T-T'],2,'T-T-S-T-T-T-S (Tono-Tono-Semitono-Tono-Tono-Tono-Semitono). Aprende esto de memoria: es la clave para construir cualquier escala mayor.'],
  ['¿La escala de Do Mayor usa alguna tecla negra?','TF',false,'No. Do Mayor es la ÚNICA escala mayor que usa exclusivamente teclas blancas. Por eso se usa primero: no hay accidentales (sostenidos ni bemoles).'],
  ['¿Cuál es el 5° grado de la escala de Do Mayor?',['Fa (F)','Sol (G)','La (A)','Mi (E)'],1,'Do(1)-Re(2)-Mi(3)-Fa(4)-Sol(5). El 5° grado es Sol. En armonía, el acorde del 5° grado es el más importante después del 1°.'],
  ['¿Cuántos semitonos hay entre Mi y Fa en la escala de Do Mayor?',['2 (un tono)','1 (un semitono)','3','0'],1,'Entre Mi y Fa hay solo 1 semitono. No hay tecla negra entre ellos. Este semitono (junto al Si-Do) es el que da carácter a la escala mayor.'],
  ['¿Cuál es el 7° grado de la escala de Do Mayor?',['La (A)','Sol (G)','Si (B)','Fa (F)'],2,'Do(1)-Re(2)-Mi(3)-Fa(4)-Sol(5)-La(6)-Si(7)-Do(8). El 7° grado es Si. Este grado tiene mucha tensión y "quiere" subir al Do.'],
  ['¿Entre Si (B) y Do (C) hay un tono o un semitono?','TF',false,'Hay un SEMITONO. No hay tecla negra entre Si y Do. La fórmula ...T-T-S confirma que los dos últimos intervalos son T-T-S: ...Sol-La(T)-Si(T)-Do(S).'],
  ['¿Cuántos tonos enteros (no semitonos) tiene una escala mayor?',['4','5','6','7'],2,'La fórmula T-T-S-T-T-T-S tiene 5 tonos (T) y 2 semitonos (S). 5 tonos completos en total.'],
  ['Si subo un TONO desde La (A), llego a...',['La# (A#)','Si (B)','Do (C)','Sol (G)'],1,'Un tono = 2 semitonos. Un semitono desde La = La#. Dos semitonos = Si (B). La a Si es un tono entero.'],
  ['¿La escala tiene 7 notas diferentes más la repetición de la raíz en la octava?','TF',true,'Sí. Do-Re-Mi-Fa-Sol-La-Si-Do son 7 notas distintas + el Do inicial se repite una octava arriba. A eso se llama "8 notas" o "1 octava".'],
  ['Escucha esta secuencia y di: ¿suenan igual el 3er y 4to intervalo?',['Sí, son iguales (ambos tonos)','No: el 3ro es un tono (Mi→Fa) y el 4to también un tono (Fa→Sol)','No: el 3ro es semitono (Mi→Fa) y el 4to es un tono (Fa→Sol)','Sí, pero solo porque están en el mismo registro'],2,'El 3er intervalo (Mi→Fa) es un SEMITONO. El 4to (Fa→Sol) es un TONO. Son distintos. Escuchar esta diferencia es clave para entrenar el oído.',[64,65,65,67],90]
],
'l2-3':[
  ['¿Qué notas forman el pentacordio de Do Mayor?',['Do-Re-Mi-Fa-Sol','Do-Mi-Sol-Si-Re','Do-Re-Fa-Sol-La','Do-Mi-Fa-Sol-Si'],0,'Do-Re-Mi-Fa-Sol: 5 notas consecutivas de la escala mayor desde Do. "Penta" = 5 en griego.'],
  ['¿Qué dedo de la mano DERECHA toca Sol4 en el pentacordio desde Do4?',['3 (medio)','4 (anular)','5 (meñique)','2 (índice)'],2,'MD: dedo1=Do4, dedo2=Re4, dedo3=Mi4, dedo4=Fa4, dedo5=Sol4. El meñique (5) toca Sol4.'],
  ['¿Qué dedo de la mano IZQUIERDA toca Do4 en el pentacordio desde Do4?',['1 (pulgar)','3 (medio)','4 (anular)','5 (meñique)'],3,'MI: dedo1=Sol3, dedo2=Fa3... ¡espera! Para pentacordio en Do4 con MI: dedo5=Do4, dedo4=Re4, dedo3=Mi4, dedo2=Fa4, dedo1=Sol4. El meñique (5) toca Do4.'],
  ['¿El pentacordio requiere que el pulgar cruce por debajo de los dedos?','TF',false,'No. El cruce del pulgar ocurre en la ESCALA COMPLETA (en Fa4, el pulgar cruza debajo del dedo 3). El pentacordio usa solo los 5 dedos en 5 teclas consecutivas sin cruce.'],
  ['Si el dedo 3 (MD) está en Mi4, ¿en qué tecla está el dedo 1?',['Re4','Do4','Si3','Fa4'],1,'Posición pentacordio: dedo1=Do4, dedo2=Re4, dedo3=Mi4. El dedo 1 (pulgar) está en Do4.'],
  ['En la escala COMPLETA de Do Mayor con mano derecha, el pulgar cruza debajo del dedo 3 al llegar a...',['Mi (E4)','Fa (F4)','Sol (G4)','La (A4)'],1,'La digitación estándar MD para Do Mayor: 1-2-3-1-2-3-4-5. El pulgar (1) cruza debajo del dedo 3 (Mi) para llegar a Fa. Este cruce es un punto técnico clave.'],
  ['¿Si la MI empieza el pentacordio en Sol3, cuál es la última nota?',['Sol4','Fa3','Do3','Re3'],2,'MI pentacordio desde Sol3: dedo1=Sol3, dedo2=Fa3, dedo3=Mi3, dedo4=Re3, dedo5=Do3. La última nota es Do3.'],
  ['¿Cuál es el propósito PRINCIPAL del pentacordio como ejercicio?',['Aprender a leer música','Fortalecer la independencia de los 5 dedos sin el cruce del pulgar','Aprender los acordes básicos','Desarrollar velocidad máxima'],1,'El pentacordio es el primer ejercicio de independencia digital. Cada dedo trabaja una nota sin necesitar el cruce (que es una técnica más avanzada).'],
  ['¿Cada dedo del pentacordio toca exactamente una nota diferente?','TF',true,'Sí. 5 dedos, 5 notas distintas. Es la razón por la que es el ejercicio inicial ideal: cada dedo tiene una "responsabilidad" clara.'],
  ['Escucha esta melodía de 5 notas. ¿Es el pentacordio de Do Mayor ascendente?',['Sí, Do-Re-Mi-Fa-Sol','No, empieza en Re','No, empieza en Sol y baja','Sí, pero en orden descendente'],0,'El pentacordio de Do Mayor ascendente es Do-Re-Mi-Fa-Sol (MIDI 60-62-64-65-67).',[60,62,64,65,67],80]
],
'l3-1':[
  ['¿Cuántas LÍNEAS tiene el pentagrama?',['4','5','6','7'],1,'El pentagrama tiene exactamente 5 líneas horizontales y 4 espacios entre ellas. "Penta" = 5 en griego, "grama" = línea escrita.'],
  ['En clave de Sol, las líneas de ABAJO hacia ARRIBA son:',['Do-Mi-Sol-Si-Re','Mi-Sol-Si-Re-Fa','Fa-La-Do-Mi-Sol','Sol-Si-Re-Fa-La'],1,'Mi-Sol-Si-Re-Fa. Memoriza: "Mi Gato Sube Rápido al Faro" (Mi-G-Si-Re-Fa). Esta es una de las reglas más importantes de la lectura musical.'],
  ['En clave de Sol, los ESPACIOS de abajo hacia arriba son:',['Mi-Sol-Si-Re','Fa-La-Do-Mi','Sol-Si-Re-Fa','Do-Mi-Sol-Si'],1,'Fa-La-Do-Mi. Los espacios se leen entre las líneas. Memoriza: "FACE" en inglés, o "Fa-La-Do-Mi" en español.'],
  ['¿Dónde se encuentra el Do Central en la clave de Sol?',['En el espacio debajo de la 1ª línea','En la 1ª línea desde abajo','En una línea adicional DEBAJO del pentagrama','En un espacio fuera del pentagrama arriba'],2,'El Do Central está en la primera línea adicional (ledger line) DEBAJO del pentagrama treble. Estas líneas auxiliares permiten escribir notas fuera del rango del pentagrama.'],
  ['La clave de Sol se llama así porque su espiral rodea la línea del Sol4','TF',true,'Correcto. La clave de Sol (𝄞) se enrosca alrededor de la 2ª línea desde abajo, que es donde está la nota Sol4. Por eso también se llama "clave de G" en inglés (G = Sol).'],
  ['¿Qué nota está en el PRIMER espacio (el más bajo) de la clave de Sol?',['Mi4','Do4','Fa4','Re4'],2,'El primer espacio (entre línea 1 y línea 2) es Fa4. Primer espacio = primera posición del patrón Fa-La-Do-Mi.'],
  ['¿Qué nota está en la TERCERA línea (la del medio) de la clave de Sol?',['Sol4','La4','Si4','Do5'],2,'La 3ª línea del medio es Si4. Recordando Mi-Sol-Si-Re-Fa: línea1=Mi4, línea2=Sol4, línea3=Si4.'],
  ['¿Si4 (B4) está en un ESPACIO de la clave de Sol?','TF',false,'Falso. Si4 está en la TERCERA LÍNEA. Los que están en espacios son Fa-La-Do-Mi. Si está en línea (el patrón líneas = Mi-Sol-Si-Re-Fa).'],
  ['¿Qué nota está en la 5ª línea (la más alta) de la clave de Sol?',['Re5','Mi5','Sol5','Fa5'],3,'La 5ª línea (la más alta) es Fa5. Recordando Mi-Sol-Si-Re-Fa: línea5=Fa5.'],
  ['¿La4 está en línea o en espacio, y en cuál?',['1ª línea','2° espacio','3ª línea','1er espacio'],1,'La4 está en el 2° espacio (entre línea 2 y línea 3). Espacios Fa-La-Do-Mi: espacio1=Fa4, espacio2=La4.']
],
'l3-2':[
  ['En clave de Fa, las líneas de ABAJO hacia ARRIBA son:',['Fa-La-Do-Mi-Sol','Mi-Sol-Si-Re-Fa','Sol-Si-Re-Fa-La','Do-Re-Mi-Fa-Sol'],2,'Sol-Si-Re-Fa-La. Memoriza: "Gran Barco De Fina Ancla" o "Sol-Si-Re-Fa-La". Esta clave cubre el registro grave, usado principalmente por la mano izquierda.'],
  ['En clave de Fa, los ESPACIOS de abajo hacia arriba son:',['Sol-Si-Re-Fa','Fa-La-Do-Mi','La-Do-Mi-Sol','Si-Re-Fa-La'],2,'La-Do-Mi-Sol. Los espacios de clave de Fa se memorizan como "Aquí Comienzan Mis Solfeos" (A-C-E-G en inglés = La-Do-Mi-Sol).'],
  ['¿Dónde está el Do Central en la clave de Fa?',['En la 5ª línea (la más alta)','En una línea adicional ENCIMA del pentagrama','En un espacio arriba de la 5ª línea','En la 4ª línea'],1,'El Do Central está en la primera línea adicional ENCIMA del pentagrama bass. Justo al revés que en treble (donde está DEBAJO).'],
  ['¿Para qué mano se usa generalmente la clave de Fa?',['Mano derecha','Mano izquierda','Ambas manos por igual','Solo para el bajo en jazz'],1,'La clave de Fa (bass clef) se usa para la mano izquierda, que generalmente toca el registro grave. La clave de Sol (treble) es para la derecha.'],
  ['La clave de Fa indica que la nota Fa está en la...',['1ª línea desde abajo','2ª línea desde abajo','3ª línea desde abajo','4ª línea desde abajo'],3,'La clave de Fa (𝄢) tiene dos puntos a cada lado de la 4ª línea, indicando que ahí está Fa3. Por eso el sistema de líneas comienza desde Sol2.'],
  ['¿Qué nota es el La del primer espacio de la clave de Fa?',['La2','La3','La4','La1'],1,'El primer espacio (el más bajo) de la clave de Fa es La2. Espacios La-Do-Mi-Sol: espacio1=La2, espacio2=Do3...'],
  ['¿Do3 (C3) está en qué posición de la clave de Fa?',['2ª línea','1ª línea','2° espacio','3er espacio'],2,'Do3 está en el 2° espacio de la clave de Fa. Recordando La-Do-Mi-Sol: espacio1=La2, espacio2=Do3.'],
  ['¿El Do Central conecta visualmente las dos claves en el gran pentagrama?','TF',true,'Sí. En el gran pentagrama, el Do Central aparece en una línea adicional debajo de la clave de Sol Y en una línea adicional encima de la clave de Fa. Es el puente entre ambas.'],
  ['¿Si3 (B3) está en línea o en espacio en la clave de Fa?',['En la 3ª línea','En el 3er espacio','En la 2ª línea','En el 2° espacio'],0,'Si3 está en la 3ª línea. Recordando Sol-Si-Re-Fa-La: línea1=Sol2, línea2=Si2, línea3=Re3... Espera: Sol2-Si2-Re3-Fa3-La3. Entonces Si2 está en la 2ª línea. Si3 estaría más arriba, en el 3er espacio (La2-Do3-Mi3 para espacios, Si3 llevaría línea adicional). Respuesta correcta: 3er espacio.',['En el 3er espacio','En la 4ª línea','En la 5ª línea','En una línea adicional'],0,'Si3 está en el tercer espacio de la clave de Fa. Espacios: La2(1), Do3(2), Mi3(3)... Si3 va más arriba, en espacio 4.'],
  ['¿La mano izquierda SIEMPRE lee solo en clave de Fa?','TF',false,'No siempre. En piezas avanzadas, la mano izquierda puede leer en clave de Sol si sube a registros agudos. Y la derecha puede usar clave de Fa en registros graves. Las claves indican registro, no mano.']
],
'l3-3':[
  ['¿Cuántos tiempos (beats) vale una REDONDA?',['1','2','3','4'],3,'La redonda vale 4 tiempos. Es la nota de mayor duración en el sistema estándar. Una redonda = 2 blancas = 4 negras = 8 corcheas.'],
  ['¿Cuántas CORCHEAS caben exactamente en un compás de 4/4?',['4','6','8','16'],2,'Un compás de 4/4 tiene 4 tiempos de negra. Una negra = 2 corcheas. 4 × 2 = 8 corcheas por compás.'],
  ['¿Cuántas negras hay por compás en el compás de 3/4?',['2','3','4','6'],1,'El compás de 3/4 tiene 3 negras por compás. El número superior indica los tiempos, el inferior indica qué figura vale 1 tiempo (4 = negra).'],
  ['¿Una blanca vale lo mismo que dos negras?','TF',true,'Sí. Redonda(4) = Blanca(2) + Blanca(2). Blanca(2) = Negra(1) + Negra(1). Esta jerarquía es fundamental para contar ritmos.'],
  ['¿Cuántos tiempos vale la combinación: una blanca + dos negras?',['3','4','5','6'],1,'Blanca=2 tiempos + 2 negras=2 tiempos = 4 tiempos. Esto ocupa exactamente un compás de 4/4.'],
  ['Si el metrónomo marca 60 BPM (negras) y toco una redonda, ¿cuántos SEGUNDOS dura?',['1 segundo','2 segundos','4 segundos','8 segundos'],2,'A 60 BPM, 1 negra = 1 segundo. Una redonda dura 4 tiempos de negra = 4 × 1 segundo = 4 segundos.'],
  ['El compás de 4/4 significa...',['4 redondas por compás','4 blancas por compás','4 negras por compás','4 corcheas por compás'],2,'El número inferior "4" indica que la NEGRA vale 1 tiempo. El número superior "4" indica 4 de esas figuras por compás. 4/4 = cuatro negras por compás.'],
  ['¿Cuántas semicorcheas hay en una negra?',['2','4','8','16'],1,'Una negra = 2 corcheas = 4 semicorcheas. La división siempre es x2 al bajar un nivel de duración.'],
  ['¿Cuántas negras hay en 3 redondas?',['6','8','12','16'],2,'Cada redonda = 4 negras. 3 redondas × 4 = 12 negras. Equivalen a 3 compases de 4/4.'],
  ['La nota con cabeza HUECA (vacía) y SIN plica es...',['La negra','La blanca','La redonda','La corchea'],2,'La redonda: cabeza oval hueca, sin plica ni corchete. La blanca: cabeza hueca CON plica. La negra: cabeza rellena con plica. La corchea: cabeza rellena con plica y corchete.']
],
'l4-1':[
  ['¿Con qué 4 notas COMIENZA la melodía de la Oda a la Alegría?',['Do-Re-Mi-Fa','Mi-Mi-Fa-Sol','Sol-Sol-La-Sol','Re-Mi-Fa-Sol'],1,'Mi-Mi-Fa-Sol (E-E-F-G en inglés). Esta es probablemente la melodía más reconocida del mundo clásico.'],
  ['¿Cuántas notas DISTINTAS usa la primera frase de la Oda a la Alegría?',['4','5','6','7'],1,'La primera frase usa Do-Re-Mi-Fa-Sol: 5 notas distintas, exactamente las del pentacordio de Do Mayor. Beethoven la diseñó para que sea accesible.'],
  ['¿A qué tempo se recomienda practicar una melodía nueva?',['120-140 BPM para desarrollar velocidad','100 BPM con metrónomo','40-60 BPM, muy lento y sin errores','Lo más rápido posible para "sentirla"'],2,'Lento y sin errores es siempre el principio. Los errores practicados a alta velocidad se "graban" en el músculo y son difíciles de corregir después.'],
  ['¿Debes mirar tus manos mientras aprendes la melodía?','TF',false,'Evitar mirar las manos entrena el sentido táctil y la memoria de posición. Mirar las manos crea dependencia visual que dificulta leer la partitura mientras tocas.'],
  ['Si el dedo 3 (MD) está en Mi4 al comenzar la Oda a la Alegría, ¿qué dedo toca Sol4?',['Dedo 4 (anular)','Dedo 5 (meñique)','Dedo 2 (índice)','Dedo 1 (pulgar)'],1,'Pentacordio MD: d1=Do4, d2=Re4, d3=Mi4, d4=Fa4, d5=Sol4. La Oda usa d3=Mi, d3=Mi, d4=Fa, d5=Sol para la primera frase.'],
  ['¿Qué hace que una melodía suene MUSICAL y no solo notas correctas?',['Tocar todas las notas al mismo tiempo','Dinámica, articulación (legato/staccato) y fraseo expresivo','Tocar siempre a la misma velocidad','Memorizar la pieza sin partitura'],1,'Las notas correctas son solo el comienzo. La música real viene de la dinámica (volumen), articulación (cómo se conectan) y el fraseo (agrupación expresiva).'],
  ['¿La Oda a la Alegría pertenece a qué obra de Beethoven?',['5ª Sinfonía','6ª Sinfonía (Pastoral)','9ª Sinfonía','Sonata "Claro de Luna"'],2,'La Oda a la Alegría es el tema principal del 4° movimiento de la 9ª Sinfonía de Beethoven. Hoy es el himno de la Unión Europea.'],
  ['En la secuencia "Mi-Mi-Fa-Sol / Sol-Fa-Mi-Re", la última nota Re4 dura...',['1 tiempo (negra)','2 tiempos (blanca)','4 tiempos (redonda)','½ tiempo (corchea)'],1,'Re4 al final de la frase dura 2 tiempos (blanca). Este alargamiento crea el efecto de "cadencia" o descanso en la frase.'],
  ['¿Qué técnica ayuda a aprender una melodía con MH mucho más rápido?',['Tocar siempre ambas manos juntas desde el principio','Memorizar primero el ritmo, luego las notas','Practicar cada sección pequeña hasta dominarla antes de avanzar','Tocar de oído sin leer la partitura'],2,'La práctica por secciones ("chunking") es uno de los métodos más efectivos respaldados por la neurociencia del aprendizaje motor.'],
  ['Escucha estas 4 notas. ¿Reconoces el comienzo de la Oda a la Alegría?',['Sí, es Mi-Mi-Fa-Sol','No, es Do-Re-Mi-Fa','Sí, pero es Sol-Sol-La-Si','No, empieza en Re'],0,'El inicio es Mi-Mi-Fa-Sol (MIDI 64-64-65-67). Este patrón repetición-ascenso es inconfundible.',[64,64,65,67],90]
],
'l4-2':[
  ['¿Qué notas forman el acorde de DO MAYOR?',['Do-Re-Mi','Do-Mi-Sol','Do-Fa-Sol','Do-Mi-La'],1,'Do-Mi-Sol (C-E-G). Raíz + 3ª mayor + 5ª justa. Este es el acorde más básico y el primero que debe memorizar todo pianista.'],
  ['¿Qué notas forman el acorde de SOL MAYOR?',['Sol-Si-Re','Sol-La-Re','Sol-Si-Mi','Sol-Do-Re'],0,'Sol-Si-Re (G-B-D). Raíz + 3ª mayor + 5ª justa, aplicado desde Sol.'],
  ['¿El acorde de Fa Mayor contiene la nota DO?','TF',true,'Sí. Fa Mayor = Fa-La-Do (F-A-C). El Do es la 5ª justa del acorde de Fa.'],
  ['¿Qué acorde forman las notas La-Do-Mi?',['Do Mayor','Fa Mayor','La Mayor','La menor'],3,'La-Do-Mi es el acorde de La menor (Am). La distancia La→Do es de 3 semitonos (3ª MENOR), lo que lo hace menor, no mayor.'],
  ['¿Cuántos semitonos hay entre DO y MI dentro del acorde de Do Mayor?',['2','3','4','5'],2,'Do→Do#(1)→Re(2)→Re#(3)→Mi(4). Son 4 semitonos = una 3ª mayor. Esta es la distancia raíz→3ª en TODO acorde mayor.'],
  ['¿Cuántos semitonos hay entre MI y SOL dentro del acorde de Do Mayor?',['2','3','4','5'],1,'Mi→Fa(1)→Fa#(2)→Sol(3). Son 3 semitonos = una 3ª menor. Esta es la distancia 3ª→5ª en todo acorde mayor.'],
  ['Si un acorde tiene 3ª MAYOR en la parte inferior, es un acorde...',['Menor','Mayor','Disminuido','Aumentado'],1,'La 3ª mayor (4 semitonos) en la base define los acordes MAYORES. Los menores tienen 3ª menor (3 semitonos) en la base.'],
  ['¿Qué nota distingue Sol MAYOR de Sol MENOR?',['Sol','Re','Si natural (♮) vs Si bemol (♭)','La'],2,'Sol Mayor = Sol-Si♮-Re. Sol menor = Sol-Si♭-Re. La única diferencia es la tercera: Si natural (mayor) vs Si♭ (menor).'],
  ['Escucha este acorde. ¿Es Do Mayor?',['Sí, es Do-Mi-Sol','No, es Do-Mi♭-Sol (Do menor)','No, es Do-Fa-Sol (Do sus4)','Sí pero está incompleto'],0,'Do Mayor suena brillante y completo: Do-Mi-Sol tocados juntos.',[60,64,67],90],
  ['¿Con Do Mayor, Fa Mayor, Sol Mayor y La menor puedes acompañar...?',['Solo música clásica','Solo canciones infantiles','Cientos de canciones pop, folk, rock y clásicas','Solo 3 o 4 canciones específicas'],2,'Estos 4 acordes (I-IV-V-VI en Do Mayor) son la base de incontables canciones. "Let It Be", "No Woman No Cry", "Wonderwall", "Despacito" y muchas más.']
],
'l4-3':[
  ['¿Cuál es la MAYOR dificultad al tocar con ambas manos simultáneamente?',['Que las teclas están muy separadas','Que el cerebro debe controlar dos secuencias motoras independientes a la vez','Que la mano izquierda es más débil','Que hay que leer dos pentagramas'],1,'La independencia motora bimanual es genuinamente difícil. El cerebro humano tiende a sincronizar los movimientos de ambas manos, y hay que entrenar conscientemente la independencia.'],
  ['¿Cuál es la estrategia CORRECTA para aprender a tocar con ambas manos?',['Practicar siempre MH juntas desde el principio','Practicar cada mano por separado hasta automatizarla, luego unirlas muy lento','Aprender MD primero y nunca volver a practicar MI sola','Practicar ambas juntas solo cuando ya sabes la pieza de memoria'],1,'Mano separada → unión a tempo muy lento → subida gradual del tempo. Este método es universal en la pedagogía pianística.'],
  ['Si al unir las manos cometemos errores constantemente, ¿qué debemos hacer?','TF',false,'La afirmación es: "continuar practicando juntas ignorando los errores" → Falso. Debes SEPARAR las manos, identificar qué mano falla, practicarla sola, y volver a unirlas más lento.'],
  ['¿Cuál debe ser el tempo al unir las manos por primera vez?',['El mismo que cada mano por separado','Más rápido para compensar la dificultad','Más lento de lo que parece necesario','Sin metrónomo para ser más libre'],2,'El tempo de unión debe ser significativamente más lento que el de cada mano por separado. Si MD toca bien a 80 BPM y MI a 80 BPM, empieza a unirlas a 40-50 BPM.'],
  ['Si MD toca corcheas y MI toca negras, ¿cuántas notas toca MD por cada nota de MI?',['1','2','3','4'],1,'Una negra = 2 corcheas. Por cada nota de MI (negra), MD toca 2 notas (2 corcheas). Entender esta relación rítmica es clave para la coordinación.'],
  ['¿Qué técnica ayuda MUCHO a coordinar las manos?',['Tocar más rápido para que las manos "se sincronicen solas"','Cantar la melodía (MD) mientras tocas solo la MI','Mirar constantemente ambas manos al mismo tiempo','Cerrar los ojos para concentrarse mejor'],1,'Cantar la melodía mientras tocas solo el acompañamiento (y viceversa) entrena la mente a mantener dos tareas simultáneas, que es exactamente lo que requiere tocar ambas manos.'],
  ['¿Qué parte de la pieza debes practicar primero?',['Siempre el comienzo','Siempre el final','La parte más fácil para ganar confianza','La parte más difícil'],3,'El "método inverso": practica primero lo difícil. Así llegas a las partes difíciles "fresco" y no agotado. Además, la motivación es mayor al inicio de una sesión.'],
  ['El "método de pequeñas secciones" significa que...',['Practicas 5 minutos al día','Divides la pieza en secciones de 2-4 compases y dominas cada una antes de avanzar','Tocas solo la mitad de la pieza cada día','Usas solo la mitad del teclado'],1,'El "chunking" (división en trozos) es el método más eficaz para aprender piezas largas. El cerebro aprende mejor cuando divide la información en unidades manejables.'],
  ['¿Tocar lento con precisión es mejor que tocar rápido con errores?','TF',true,'Completamente verdadero. La práctica lenta y precisa construye la memoria muscular correcta. Los errores practicados a velocidad se vuelven hábitos muy difíciles de corregir.'],
  ['Con el metrónomo, ¿cuándo subes el tempo?',['Cada 5 minutos de práctica automáticamente','Solo cuando el pasaje sale perfecto 3 veces seguidas al tempo actual','Cuando crees que ya suena bien','Cada vez que practicas la misma sección'],1,'Solo sube el tempo cuando el pasaje sale PERFECTO (sin errores de nota, ritmo ni articulación) varias veces consecutivas. Subir antes de tiempo solo consolida errores.']
],
'l5-1':[
  ['¿Cuántos semitonos hay entre la raíz y la 3ª MAYOR?',['2','3','4','5'],2,'4 semitonos = 3ª mayor. Ejemplo: Do→Do#→Re→Re#→Mi = 4 semitonos. Este intervalo define el carácter "brillante" de los acordes mayores.'],
  ['¿Cuántos semitonos hay entre la raíz y la 5ª JUSTA?',['5','6','7','8'],2,'7 semitonos = 5ª justa. Ejemplo: Do→Re♭→Re→Re#→Mi→Fa→Fa#→Sol = 7 semitonos. La 5ª justa es la más "estable" de todos los intervalos.'],
  ['¿Qué notas forman el acorde de RE MAYOR (D)?',['Re-Fa-La','Re-Fa#-La','Re-Fa-La#','Re-Mi#-La'],1,'Re-Fa#-La (D-F#-A). Raíz(Re) + 3ª mayor (Fa#, 4 semitonos) + 5ª justa (La, 7 semitonos). Fa# (no Fa natural) porque la 3ª mayor requiere 4 semitonos.'],
  ['¿Qué notas forman el acorde de MI MAYOR (E)?',['Mi-Sol-Si','Mi-Sol#-Si','Mi-Sol-Si♭','Mi-Fa#-Si'],1,'Mi-Sol#-Si (E-G#-B). Raíz(Mi) + 3ª mayor (Sol#, 4 semitonos) + 5ª justa (Si, 7 semitonos). Sol# (no Sol natural).'],
  ['¿Todos los acordes mayores tienen el mismo "color" emocional (carácter brillante)?','TF',true,'Sí, musicalmente hablando. Todos los acordes mayores tienen la misma estructura intervalar (4+3 semitonos), por lo que comparten el carácter brillante/alegre, independientemente de la tonalidad.'],
  ['¿Cuántos semitonos hay de la 3ª a la 5ª dentro de una tríada mayor?',['2','3','4','5'],1,'Si la raíz→3ª = 4 semitonos, y raíz→5ª = 7 semitonos, entonces 3ª→5ª = 7-4 = 3 semitonos = una 3ª menor. Todo acorde mayor tiene 3ª mayor abajo y 3ª menor arriba.'],
  ['¿El acorde de Sol MAYOR contiene la nota Fa NATURAL?','TF',false,'Falso. Sol Mayor = Sol-Si-Re. No hay Fa en este acorde. Fa# SÍ aparece en la ESCALA de Sol Mayor, pero en el ACORDE de Sol Mayor las notas son Sol-Si-Re.'],
  ['La fórmula en semitonos de toda tríada mayor es...',['3+4','4+3','5+2','2+5'],1,'4 semitonos (raíz→3ª mayor) + 3 semitonos (3ª mayor→5ª justa) = 7 semitonos totales. Esta fórmula 4+3 es la clave para construir cualquier acorde mayor.'],
  ['Escucha este acorde mayor. ¿Cuántos semitonos hay entre la nota grave y la nota del medio?',['3 semitonos (3ª menor)','4 semitonos (3ª mayor)','5 semitonos (4ª justa)','7 semitonos (5ª justa)'],1,'El intervalo raíz→3ª en todo acorde mayor son exactamente 4 semitonos (3ª mayor). Si escuchas "brillante/abierto", es mayor.',[60,64,67],70],
  ['¿Cuántas tríadas mayores distintas existen?',['7','9','12','24'],2,'12 tríadas mayores: una por cada nota del sistema cromático (Do, Do#, Re, Re#, Mi, Fa, Fa#, Sol, Sol#, La, La#, Si). Cada una con su propio nombre y trasposición.']
],
'l5-2':[
  ['¿Cuántos semitonos hay entre la raíz y la 3ª MENOR?',['2','3','4','5'],1,'3 semitonos = 3ª menor. Ejemplo: La→La#→Si→Do = 3 semitonos. Un semitono menos que la 3ª mayor (4 st). Esta diferencia mínima cambia completamente el carácter del acorde.'],
  ['¿En qué se diferencia una tríada MENOR de una MAYOR?',['En la 5ª (la nota más aguda)','En la raíz (la nota más grave)','Solo en la 3ª (la nota del medio)','En todas las notas'],2,'Solo la TERCERA cambia: mayor tiene 3ª mayor (4 st), menor tiene 3ª menor (3 st). La raíz y la 5ª son idénticas. Esta diferencia de 1 semitono cambia el carácter de "alegre" a "emotivo/oscuro".'],
  ['¿Qué notas forman La MENOR (Am)?',['La-Do#-Mi','La-Do-Mi','La-Si-Mi','La-Do-Fa'],1,'La-Do-Mi (A-C-E). La→Do son 3 semitonos (3ª menor). La→Mi son 7 semitonos (5ª justa). La misma 5ª que La Mayor, diferente 3ª.'],
  ['¿Qué notas forman Re MENOR (Dm)?',['Re-Fa#-La','Re-Fa-La','Re-Fa-Si','Re-Mi#-La'],1,'Re-Fa-La (D-F-A). Re→Fa son 3 semitonos (3ª menor, Fa natural). En contraste, Re Mayor tiene Fa# (4 semitonos = 3ª mayor).'],
  ['¿Una tríada menor tiene la misma 5ª justa que la tríada mayor del mismo nombre?','TF',true,'Sí. Do Mayor = Do-Mi-Sol. Do menor = Do-Mi♭-Sol. La 5ª (Sol) es idéntica en ambos. Solo cambia la 3ª (Mi natural → Mi♭).'],
  ['Para convertir Do MAYOR en Do MENOR, debes...',['Cambiar Sol por Sol♭','Cambiar Do por Re','Bajar Mi un semitono (Mi → Mi♭)','Subir Sol un semitono (Sol → Sol#)'],2,'Do Mayor = Do-Mi-Sol. Do menor = Do-Mi♭-Sol. Solo bajas la 3ª (Mi) un semitono a Mi♭. La raíz y la 5ª no cambian.'],
  ['La fórmula en semitonos de toda tríada MENOR es...',['4+3','3+4','2+5','5+2'],1,'3 semitonos (raíz→3ª menor) + 4 semitonos (3ª menor→5ª justa) = 7 semitonos totales. Invertida respecto a la mayor (4+3 vs 3+4).'],
  ['¿Do menor y Do mayor comparten las notas Do y Sol?','TF',true,'Correcto. Do Mayor: Do-Mi-Sol. Do menor: Do-Mi♭-Sol. Raíz (Do) y 5ª (Sol) son iguales. Solo la 3ª (Mi vs Mi♭) difiere.'],
  ['Escucha este acorde. ¿Es mayor o menor? ¿Por qué?',['Mayor, porque tiene 3ª mayor (4 st)','Menor, porque tiene 3ª menor (3 st)','Mayor, porque suena brillante','Menor, porque la nota grave es grave'],1,'Suena oscuro/emotivo = acorde menor. La 3ª menor (3 semitonos) le da ese carácter. En Do menor: Do-Mi♭-Sol.',[60,63,67],70],
  ['¿Qué acorde MENOR es la relativa de Do Mayor?',['Do menor','Sol menor','Re menor','La menor'],3,'La menor (Am) es la relativa menor de Do Mayor. Comparten exactamente las mismas 7 notas (Do-Re-Mi-Fa-Sol-La-Si), solo cambia la nota de inicio (y por tanto el acorde tónico).']
],
'l5-3':[
  ['¿Cuál es el acorde IV en DO MAYOR?',['Sol Mayor','La menor','Fa Mayor','Re menor'],2,'El IV grado de Do Mayor es Fa Mayor. Grados: I=Do, II=Re, III=Mi, IV=Fa, V=Sol, VI=La, VII=Si. El IV es siempre el 4° grado diatónico.'],
  ['¿Cuál es el acorde V en DO MAYOR?',['Fa Mayor','Sol Mayor','La menor','Si disminuido'],1,'El V grado de Do Mayor es Sol Mayor. El V es el acorde de "dominante" — el más tenso, el que más quiere resolver al I.'],
  ['La progresión I-V-vi-IV en Do Mayor es...',['Do-Sol-La♭-Fa','Do-Sol-La menor-Fa','Do-Fa-Sol-La menor','Do-La menor-Fa-Sol'],1,'I=Do Mayor, V=Sol Mayor, vi=La menor (minúscula = menor), IV=Fa Mayor. Esta progresión es una de las más usadas en la música popular del siglo XX y XXI.'],
  ['¿La progresión I-IV-V-I es la base de una gran cantidad de canciones populares?','TF',true,'Absolutamente. Blues, rock, folk, pop, country y mucha música clásica usa I-IV-V-I. En Do Mayor: Do-Fa-Sol-Do.'],
  ['¿Cuál es el acorde vi (6° menor) en Do Mayor?',['Re menor','Fa Mayor','Sol Mayor','La menor'],3,'El vi de Do Mayor es La menor (Am). Los grados mayores son I, IV, V y los menores son ii, iii, vi (en una tonalidad mayor).'],
  ['La progresión I-V-vi-IV en SOL MAYOR sería...',['Sol-Re-Mi menor-Do','Sol-Do-Re-Mi menor','Sol-Re-Do-Mi menor','Sol-Mi menor-Do-Re'],0,'En Sol Mayor: I=Sol, V=Re, vi=Mi menor, IV=Do. Es exactamente la misma estructura relativa, transportada a Sol.'],
  ['¿Por qué el acorde V "quiere" resolver al I?',['Porque es el acorde más grave','Porque la 5ª justa crea tensión','Porque contiene un tritono que se resuelve al acorde de tónica','Porque es más fácil de tocar'],2,'En Sol Mayor (V de Do), el intervalo Si-Fa (tritono) es muy inestable. Si quiere subir a Do, y Fa quiere bajar a Mi. Esta resolución es el motor de la armonía tonal.'],
  ['¿Cuántos acordes DISTINTOS tiene la progresión I-V-vi-IV?',['3','4','5','6'],1,'Cuatro acordes diferentes: el I (tónica), V (dominante), vi (relativa menor) y IV (subdominante). Aunque se repiten en bucle, son solo 4 acordes únicos.'],
  ['Escucha esta progresión. ¿Es I-V-vi-IV o I-IV-V-I?',['I-V-vi-IV (Do-Sol-Lam-Fa)','I-IV-V-I (Do-Fa-Sol-Do)','I-vi-IV-V (Do-Lam-Fa-Sol)','V-IV-I-vi (Sol-Fa-Do-Lam)'],0,'La secuencia Do-Sol-Lam-Fa suena descendente y "flotante". I-IV-V-I tiene un carácter más "resolutivo" clásico.',[60,67,69,65],70],
  ['La progresión ii-V-I (más usada en jazz) en Do Mayor sería...',['Re-Sol-Do (todo mayor)','Re menor-Sol Mayor-Do Mayor','Mi menor-La menor-Re menor','Fa-Sol-Do'],1,'ii=Re menor, V=Sol Mayor, I=Do Mayor. El ii-V-I es la progresión cadencial del jazz moderno, especialmente en el estilo bebop.']
],
'l6-1':[
  ['¿Qué significa "pp" (pianissimo)?',['Piano pasivo','Muy fuerte','Muy suave','Piano perfecto'],2,'"p" = piano (suave en italiano). "pp" = pianissimo = muy suave. La dinámica tiene su propio vocabulario en italiano.'],
  ['¿Cuál de estas dinámicas es MÁS FUERTE?',['mf (mezzo-forte)','p (piano)','f (forte)','mp (mezzo-piano)'],2,'"f" (forte) = fuerte. "mf" (mezzo-forte) = medianamente fuerte. El orden es: pp < p < mp < mf < f < ff.'],
  ['Ordena de más SUAVE a más FUERTE: f, pp, mf, p, ff',['pp - p - mf - f - ff','p - pp - f - mf - ff','f - mf - p - pp - ff','pp - mf - p - f - ff'],0,'La escala dinámica estándar: pp (muy suave) → p (suave) → mp (medio suave) → mf (medio fuerte) → f (fuerte) → ff (muy fuerte).'],
  ['"Crescendo" significa...',['Tocar más rápido','Aumentar gradualmente el volumen','Disminuir gradualmente el volumen','Tocar con pedal de sustain'],1,'"Crescendo" (del italiano, "creciendo") = aumentar progresivamente la intensidad. Su símbolo es < (el ángulo que se abre).'],
  ['¿El símbolo gráfico "<" en música indica CRESCENDO?','TF',true,'Sí. El ángulo que se abre (como "<" o en forma de cuerno que se ensancha hacia la derecha) indica que el volumen debe aumentar progresivamente.'],
  ['¿Por qué el instrumento se llama "piano" y no "forte" o "cembalo"?',['El inventor se llamaba Piano Cristofori','"Piano" es más corto y fácil de decir','Es la abreviación de "pianoforte" que con el tiempo se simplificó en uso coloquial','El instrumento solo puede tocar suave'],2,'El nombre completo original era "gravicembalo col piano e forte" (clavicémbalo que toca suave y fuerte). Se simplificó primero a "pianoforte" y luego a "piano".'],
  ['¿Qué significa "sforzando" (sfz)?',['Tocar muy suave de repente','Un acento o impulso fuerte repentino en una nota','Tocar con el pedal sin soltar','Accelerando (acelerar)'],1,'"Sforzando" (sfz) o "sforzato" es un acento súbito — una nota que se toca con fuerza repentina, independientemente de la dinámica general de la pieza.'],
  ['¿Dos piezas con las mismas notas y el mismo tempo pero diferente dinámica suenan iguales?','TF',false,'Falso. La dinámica es parte fundamental de la expresión musical. La misma melodía a pp suena íntima y misteriosa; a ff suena poderosa y dramática.'],
  ['"Diminuendo" o "decrescendo" significa...',['Disminuir gradualmente el volumen','Tocar más lento gradualmente','Bajar el tono (afinar más grave)','Acortar las notas'],0,'"Diminuendo" (disminuyendo) = bajar gradualmente la intensidad. Su símbolo es > (el ángulo que se cierra). Opuesto al crescendo.'],
  ['¿Cuántas dinámicas PRINCIPALES existen en la nomenclatura estándar?',['4','5','6','8'],2,'Las 6 dinámicas principales: pp, p, mp, mf, f, ff. Algunas partituras incluyen ppp y fff para extremos, pero las 6 son el estándar universal.']
],
'l6-2':[
  ['¿Qué significa "legato"?',['Notas separadas con silencio entre ellas','Notas unidas suavemente sin silencio entre ellas','Tocar con el pedal de sustain siempre','Tocar más despacio'],1,'"Legato" (del italiano "ligado") = notas conectadas fluidamente. El sonido de una nota dura hasta que comienza la siguiente, sin silencio perceptible entre ellas.'],
  ['¿Qué significa "staccato"?',['Notas largas y fluidas','Notas tocadas con mucho volumen','Notas cortas y separadas, con silencio entre ellas','Notas tocadas muy rápido'],2,'"Staccato" (del italiano "separado/destacado") = notas cortas con silencio entre ellas. Crea un efecto saltarín o percusivo.'],
  ['¿Cómo se indica el STACCATO en la partitura?',['Con una tilde (~) sobre la nota','Con un punto (•) encima o debajo de la nota','Con una línea vertical (|) antes de la nota','Con una "s" escrita sobre la nota'],1,'El staccato se indica con un punto pequeño directamente sobre o bajo la cabeza de la nota (dependiendo de hacia dónde va la plica).'],
  ['¿Legato y staccato afectan solo la duración, no el carácter expresivo?','TF',false,'Falso. Aunque técnicamente afectan la duración, su impacto principal es expresivo: legato suena fluido, cantado, íntimo; staccato suena enérgico, juguetón, percusivo.'],
  ['¿Cuál articulación suena más "danzarina y juguetona"?',['Legato','Staccato','Ambas por igual','Ninguna — depende de la dinámica'],1,'El staccato, por su naturaleza cortada y rebotante, es naturalmente más juguetón y danzarín. Es muy usado en música barroca y clásica para crear ligereza.'],
  ['¿Cuál articulación suena más "cantada y fluida"?',['Staccato','Legato','Fortissimo','Pianissimo'],1,'El legato imita el sonido de la voz cantada — continuidad sin interrupciones. Es el estilo dominante en la música romántica (Chopin, Schumann, Brahms).'],
  ['Un staccato dura aproximadamente... del valor escrito de la nota',['El 100%','El 75%','El 50%','El 25%'],2,'Convencionalmente, una nota staccato dura aproximadamente la mitad de su valor. Una negra staccato (1 tiempo) suena como si durara ½ tiempo, seguida de ½ tiempo de silencio.'],
  ['¿Para tocar LEGATO el dedo levanta la tecla justo cuando el siguiente dedo la baja?','TF',true,'Exactamente. El legato requiere un "solapamiento" mínimo de las teclas: el dedo A no suelta hasta que el dedo B toca. Esto evita silencios entre notas.'],
  ['¿Una misma pieza puede tener secciones legato y secciones staccato?','TF',true,'Sí, y es muy común. El contraste entre legato y staccato es una herramienta expresiva fundamental. Los compositores lo usan deliberadamente para crear variedad y emoción.'],
  ['Para interpretar una canción de cuna, ¿qué articulación es más apropiada?',['Staccato — para mantener al bebé despierto','Legato — fluido y suave como mecerse','Sforzando — para destacar el ritmo','Marcato — con cada nota acentuada'],1,'Una canción de cuna necesita continuidad fluida y suavidad. El legato es la articulación natural para transmitir calma, ternura y movimiento mecedor.']
],
'l6-3':[
  ['¿Cuántos sostenidos tiene la escala de SOL MAYOR?',['0','1','2','3'],1,'Sol Mayor tiene 1 sostenido: Fa#. La fórmula T-T-S-T-T-T-S aplicada desde Sol requiere Fa# para mantener el semitono correcto entre el 6° y 7° grado.'],
  ['¿Cuál es el sostenido en la escala de Sol Mayor?',['Do#','Sol#','Fa#','Re#'],2,'El único sostenido de Sol Mayor es Fa# (F#). Sol-La-Si-Do-Re-Mi-Fa#-Sol. Sin el Fa#, el semitono entre el 7° grado y la octava no sería correcto.'],
  ['¿Cuántos sostenidos tiene la escala de RE MAYOR?',['1','2','3','4'],1,'Re Mayor tiene 2 sostenidos: Fa# y Do# (F# y C#). Re-Mi-Fa#-Sol-La-Si-Do#-Re.'],
  ['¿Cuántos bemoles tiene la escala de FA MAYOR?',['0','1','2','3'],1,'Fa Mayor tiene 1 bemol: Si♭ (B♭). Fa-Sol-La-Si♭-Do-Re-Mi-Fa. El Si♭ mantiene el semitono correcto entre el 4° y 5° grado.'],
  ['¿Re Mayor y La Mayor comparten el sostenido Fa#?','TF',true,'Sí. Fa# aparece en Re Mayor (Fa#, Do#) y también en La Mayor (Fa#, Do#, Sol#). Los sostenidos se van acumulando siguiendo el ciclo de quintas.'],
  ['Aplicando T-T-S-T-T-T-S desde Sol, el resultado es...',['Sol-La-Si-Do-Re-Mi-Fa-Sol','Sol-La-Si-Do-Re-Mi-Fa#-Sol','Sol-La-Si♭-Do-Re-Mi-Fa-Sol','Sol-La-Si-Do#-Re-Mi-Fa#-Sol'],1,'Sol(T)La(T)Si(S)Do(T)Re(T)Mi(T)Fa#(S)Sol. El Fa# es necesario para que el último intervalo sea S (semitono) en lugar de T.'],
  ['¿Por qué Sol Mayor NECESITA Fa# y no puede usar Fa natural?',['Porque Fa no existe','Porque suena mal estéticamente','Porque la fórmula T-T-S-T-T-T-S requiere un TONO entre Mi y el 7° grado, y Mi-Fa es solo semitono','Porque así lo decidió la tradición'],2,'Mi→Fa es solo 1 semitono. Pero la fórmula necesita un TONO entre los grados 5-6 y 6-7 (T-T). Por eso sube a Fa# (Mi→Fa# = 2 semitonos = 1 tono). ¡La fórmula lo exige!'],
  ['¿Todas las escalas mayores tienen la misma estructura intervalar?','TF',true,'Sí. Todas las escalas mayores usan la misma fórmula T-T-S-T-T-T-S. Solo cambia el punto de inicio. Por eso todas suenan "mayores", solo en diferente registro/tonalidad.'],
  ['¿Cuántas escalas mayores distintas existen?',['7','10','12','24'],2,'12 escalas mayores: una por cada nota del sistema cromático. Con 5 teóricas adicionales (enarmónicas como Do#=Re♭), en la práctica se usan 12.'],
  ['La escala de FA MAYOR completa es...',['Fa-Sol-La-Si-Do-Re-Mi-Fa','Fa-Sol-La♭-Si♭-Do-Re-Mi-Fa','Fa-Sol-La-Si♭-Do-Re-Mi-Fa','Fa-Sol#-La-Si♭-Do-Re-Mi-Fa'],2,'Fa(T)Sol(T)La(S)Si♭(T)Do(T)Re(T)Mi(S)Fa. El Si♭ es el único bemol. Fa-Sol-La-Si♭-Do-Re-Mi-Fa.']
],
'l7-1':[
  ['¿Cuántas notas tiene la escala PENTATÓNICA?',['4','5','6','7'],1,'"Penta" = 5 en griego. La escala pentatónica tiene 5 notas distintas (más la repetición de la tónica en la octava = 6 en total).'],
  ['¿Qué notas forman la pentatónica de DO MAYOR?',['Do-Re-Mi-Fa-Sol','Do-Re-Mi-Sol-La','Do-Mi-Sol-La-Si','Do-Re-Fa-Sol-La'],1,'Do-Re-Mi-Sol-La. Se obtiene omitiendo el 4° (Fa) y el 7° (Si) de la escala mayor de Do. Sin Fa ni Si.'],
  ['¿La escala pentatónica contiene SEMITONOS?','TF',false,'No. La pentatónica mayor no tiene semitonos: Do→Re(T), Re→Mi(T), Mi→Sol(T+S=1.5T), Sol→La(T), La→Do(T+S). Esta ausencia de semitonos es por qué "suena bien siempre".'],
  ['¿Qué notas de la escala mayor se OMITEN para crear la pentatónica?',['La 3ª y la 5ª','La 2ª y la 6ª','El 4° y el 7° grado','El 1° y el 5° grado'],2,'Se omiten el 4° grado (Fa en Do Mayor) y el 7° grado (Si en Do Mayor). Estas son las notas que crean tensión por semitonos con el resto. Al quitarlas, la escala fluye sin disonancia.'],
  ['Las 5 teclas NEGRAS del piano forman la pentatónica de...',['Do# Mayor','Re# Mayor','Fa# Mayor','Sol# Mayor'],2,'Las teclas negras Do#-Re#-Fa#-Sol#-La# forman la pentatónica de Fa# Mayor (o equivalentemente, de Re# menor). ¡Toca solo las negras y estarás improvisando en pentatónica!'],
  ['¿La pentatónica menor de LA y la pentatónica mayor de DO son la misma escala?','TF',true,'Sí. La-Do-Re-Mi-Sol (pentatónica menor de La) usa las mismas notas que Do-Re-Mi-Sol-La (pentatónica mayor de Do). Es la relación relativa, igual que en las escalas completas.'],
  ['¿Por qué es casi imposible sonar "mal" improvisando con la pentatónica?',['Porque tiene pocas notas','Porque no tiene semitonos que creen disonancia con los acordes del contexto','Porque todos los músicos la conocen','Porque solo se usa en música lenta'],1,'La ausencia de semitonos significa que todas las notas de la pentatónica encajan armónicamente con los acordes de su tonalidad. No hay "notas tensas" que resuelvan forzosamente.'],
  ['¿La pentatónica se usa en blues, jazz, rock y música tradicional asiática?','TF',true,'Sí. Es probablemente la escala más universal del mundo. Desde el blues de Chicago hasta la música tradicional china, japonesa o andina, la pentatónica es omnipresente.'],
  ['¿Solo existe UNA escala pentatónica posible?','TF',false,'No. Hay 12 escalas pentatónicas mayores (una por tonalidad) y sus relativas menores (otras 12). Además, hay otros tipos de pentatónicas (pentatónica menor, egipcia, etc.).'],
  ['¿Qué nota NO está en la pentatónica de DO MAYOR?',['Do','Mi','Fa','La'],2,'Fa es el 4° grado omitido. La pentatónica de Do Mayor es Do-Re-Mi-Sol-La. Fa (4°) y Si (7°) están ausentes precisamente para evitar los semitonos.']
],
'l7-2':[
  ['¿Cuál es la relativa MENOR de Do Mayor?',['Sol menor','Re menor','La menor','Mi menor'],2,'La menor (Am) es la relativa de Do Mayor. Comparten las mismas 7 notas. La relativa menor siempre comienza en el 6° grado de la escala mayor (La es el 6° de Do Mayor).'],
  ['La escala de La menor NATURAL tiene las mismas notas que...',['Sol Mayor','Fa Mayor','Do Mayor','Re Mayor'],2,'La menor natural y Do Mayor usan exactamente las mismas 7 notas: Do-Re-Mi-Fa-Sol-La-Si. La diferencia es el orden (inicio) y por tanto el acorde tónico.'],
  ['¿La menor NATURAL y La menor ARMÓNICA tienen las mismas notas?','TF',false,'Falso. La menor natural: La-Si-Do-Re-Mi-Fa-Sol-La. La menor armónica: La-Si-Do-Re-Mi-Fa-Sol#-La. La armónica SUBE el 7° grado (Sol → Sol#).'],
  ['En La menor ARMÓNICA, ¿qué nota cambia respecto a la natural?',['Fa sube a Fa#','Sol sube a Sol# (el 7° grado)','Mi baja a Mi♭','Si baja a Si♭'],1,'El 7° grado (Sol) se sube un semitono a Sol#. Esto crea el intervalo de 7ª mayor que "quiere" resolver al La, generando más tensión y función de dominante.'],
  ['¿Por qué se llama "armónica" la escala menor armónica?',['Porque suena más armoniosa que la natural','Porque el Sol# permite construir el acorde V MAYOR (Sol Mayor) en lugar de menor, dando más función armónica a la cadencia','Porque usa más sostenidos','Porque fue inventada por un compositor llamado Armónico'],1,'Con Sol natural (7° bajo), el V grado es Sol menor, un acorde débil. Con Sol# (7° alto), el V grado es Sol Mayor, que crea la cadencia auténtica perfecta V→I tan importante en armonía tonal.'],
  ['¿Cuántos semitonos hay entre el 6° y 7° grado de La menor ARMÓNICA?',['1 semitono','2 semitonos (tono)','3 semitonos (3ª menor)','4 semitonos (3ª mayor)'],2,'Fa→Sol# son 3 semitonos: Fa→Fa#→Sol→Sol#. Este intervalo aumentado (Fa→Sol#) da a la menor armónica su carácter exótico/oriental característico.'],
  ['¿Cuál es la relativa MENOR de Sol Mayor?',['La menor','Re menor','Mi menor','Si menor'],2,'El 6° grado de Sol Mayor es Mi (Sol-La-Si-Do-Re-Mi). La relativa menor de Sol Mayor es Mi menor (Em).'],
  ['¿Una escala menor natural y su relativa mayor comparten las mismas notas?','TF',true,'Sí. Por definición, la escala relativa menor natural usa exactamente las mismas notas que su relativa mayor, solo que empezando en el 6° grado. No hay alteraciones adicionales.'],
  ['¿Cuál es la relativa MAYOR de Re menor?',['Sol Mayor','Si♭ Mayor','Fa Mayor','La Mayor'],2,'Re menor es relativa de Fa Mayor. Para encontrar la relativa mayor, sube 3 semitonos desde la tónica menor: Re→Re#→Mi→Fa. Fa Mayor.'],
  ['La escala menor MELÓDICA tiene la característica especial de...',['Tener el mismo número de notas que otras escalas','Subir con el 6° y 7° grados elevados, y BAJAR con la forma natural (menor natural)','Ser idéntica a la armónica','No tener semitonos'],1,'La menor melódica usa una forma diferente al subir (6° y 7° elevados para cantar mejor la melodía ascendente) y al bajar (forma natural, más oscura). Es única en este aspecto.']
],
'l7-3':[
  ['¿A qué sinfonía de Beethoven pertenece la Oda a la Alegría?',['5ª Sinfonía','7ª Sinfonía','9ª Sinfonía','6ª Sinfonía (Pastoral)'],2,'La Oda a la Alegría es el tema central del 4° movimiento de la 9ª Sinfonía de Beethoven (Op. 125), compuesta entre 1822-1824.'],
  ['¿En qué movimiento de la 9ª Sinfonía aparece la Oda a la Alegría?',['1° movimiento','2° movimiento','3° movimiento','4° movimiento (final)'],3,'El 4° movimiento (el último) es el más famoso. Es único en la historia: es la primera sinfonía que incorpora voces humanas (coro y solistas) junto a la orquesta.'],
  ['¿Beethoven era completamente sordo cuando compuso la 9ª Sinfonía?','TF',true,'Verdadero. Beethoven perdió completamente la audición años antes. Compuso la 9ª Sinfonía sin poder escuchar una sola nota. Al estrenarla (1824), tuvo que ser girado para ver los aplausos del público, pues no los escuchaba.'],
  ['¿Cuántas notas DISTINTAS usa la primera frase de la Oda a la Alegría (Mi-Mi-Fa-Sol-Sol-Fa-Mi-Re)?',['3','4','5','6'],2,'Mi, Fa, Sol, Re — son 4 notas distintas en la primera frase de 8 notas. Beethoven logró una melodía memorable con recursos mínimos.'],
  ['¿Cuál es el método más efectivo para MEMORIZAR una pieza?',['Tocarla completa muchas veces seguidas','Dividir en secciones pequeñas y memorizar cada una antes de conectarlas','Escucharla grabada hasta aprenderla','Tocarla de noche antes de dormir'],1,'El "método de chunks" o secciones es respaldado por la neurociencia. El cerebro consolida la memoria motora mejor en fragmentos pequeños que en repeticiones masivas de la pieza completa.'],
  ['En la versión simplificada de la Oda a la Alegría, ¿cuál suele ser el PRIMER acorde de la mano izquierda?',['Sol Mayor','Fa Mayor','La menor','Do Mayor'],3,'La Oda a la Alegría en la versión para principiantes comienza en el acorde de Do Mayor en la MI. La melodía empieza en Mi4, que es la 3ª de Do Mayor.'],
  ['¿La Oda a la Alegría usa las 12 notas cromáticas?','TF',false,'Falso. La melodía usa principalmente notas diatónicas (de la escala, sin muchas alteraciones). En la versión simplificada en Do Mayor, usa principalmente Do-Re-Mi-Fa-Sol con alguna variación.'],
  ['¿Cuál es el PRÓXIMO paso lógico después de dominar tu primera pieza?',['Intentar tocar la 9ª Sinfonía completa','Dejar el piano por unos meses para "resetear"','Aprender una pieza nueva, levemente más difícil, con el mismo método','Repetir la misma pieza 100 veces más'],2,'El aprendizaje en espiral: domina una pieza, pasa a la siguiente (un poco más difícil), aplica el mismo método. El progreso es gradual y constante, nunca en saltos enormes.'],
  ['¿Tocar para otra persona, aunque seas principiante, tiene valor musical?','TF',true,'Absolutamente. Tocar para alguien, incluso una pieza simple, es un acto de conexión y generosidad. La música más sencilla, tocada con intención, puede emocionar profundamente.'],
  ['Según todo lo aprendido en este curso, el método de práctica que dura toda la vida es...',['Practicar muchas horas seguidas sin parar','Secciones pequeñas, tempo lento, metrónomo, subir BPM gradualmente solo cuando sale perfecto','Escuchar grabaciones y tocar de oído sin partitura','Aprender de memoria sin pensar en la técnica'],1,'Secciones pequeñas + lento + metrónomo + subida gradual de tempo = el método universal de la práctica pianística deliberada. Aplica desde el primer año hasta el nivel de concertista.']
]
