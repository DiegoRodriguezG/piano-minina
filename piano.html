// ═══════════════════════════════════════════
function answerExV2(id, chosen, correct, el, explain) {
  var fb  = document.getElementById('ex-fb-'  + id);
  var exp = document.getElementById('ex-exp-' + id);
  var allOpts = el.parentElement.querySelectorAll('.ex-opt');
  allOpts.forEach(function(b) { b.disabled = true; b.style.pointerEvents = 'none'; });
  allOpts[correct].classList.add('correct');
  if (chosen === correct) {
    el.classList.add('correct');
    fb.innerHTML = '✨ ¡Correcto!';
    fb.className = 'ex-feedback ok';
  } else {
    el.classList.add('wrong');
    fb.innerHTML = '✗ No exactamente. La respuesta correcta está marcada en verde.';
    fb.className = 'ex-feedback fail';
  }
  if (exp && explain) { exp.style.display = 'block'; exp.textContent = '💡 ' + explain; }
  updateExCounter(id);
}

function updateExCounter(eid) {
  var lid = eid.replace(/-x\d+$/, '');
  var wrap = document.getElementById('ex-wrap-' + lid);
  if (!wrap) return;
  var total = parseInt(wrap.dataset.total, 10);
  var ok   = wrap.querySelectorAll('.ex-feedback.ok').length;
  var done = wrap.querySelectorAll('.ex-feedback.ok, .ex-feedback.fail').length;
  var ctr  = document.getElementById('exc-' + lid);
  if (ctr) ctr.textContent = ok + ' correctas · ' + done + ' de ' + total + ' respondidas';
}

function renderExercisesBlock(lid) {
  var exs = EX[lid];
  if (!exs || !exs.length) return '';

  // Find lesson title for subtitle bar
  var lessonTitle = '';
  for (var k = 0; k < CURRICULUM.length; k++) { if (CURRICULUM[k].id === lid) { lessonTitle = CURRICULUM[k].title; break; } }

  // Section color palette (cycles A→B→C→D→E→A...)
  var SC = [
    {nc:'#16a34a', bg:'rgba(22,163,74,.10)',  bc:'rgba(22,163,74,.55)'},
    {nc:'#e11d48', bg:'rgba(225,29,72,.10)',  bc:'rgba(225,29,72,.55)'},
    {nc:'#2563eb', bg:'rgba(37,99,235,.10)',  bc:'rgba(37,99,235,.55)'},
    {nc:'#9333ea', bg:'rgba(147,51,234,.10)', bc:'rgba(147,51,234,.55)'},
    {nc:'#d97706', bg:'rgba(217,119,6,.10)',  bc:'rgba(217,119,6,.55)'},
  ];

  var html = '';

  // ── l3-3 gets the fill-in-blank sheet first ──
  if (lid === 'l3-3') {
    html += '<div class="section-header" style="margin-top:40px"><h2>✦ Actividades</h2><div class="line"></div></div>';
    html += makeActivitySheetRitmo();
    html += '<div class="section-header" style="margin-top:32px"><h2>Preguntas de comprensión</h2><div class="line"></div></div>';
  }

  // ── Worksheet container ──
  html += '<div style="border-radius:20px;overflow:hidden;margin-top:' + (lid === 'l3-3' ? '0' : '40px') + ';margin-bottom:28px;box-shadow:0 8px 48px rgba(0,0,0,.45),0 0 0 1px rgba(168,85,247,.12)">';

  // Header
  html += '<div style="background:linear-gradient(135deg,#1e1b4b,#0e0030);padding:18px 28px;text-align:center">';
  html += '<div style="font-size:1.5rem;font-weight:900;color:#fff;letter-spacing:3px;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:12px">';
  html += '<span style="font-size:1rem;opacity:.7">✦</span> Actividades <span style="font-size:1rem;opacity:.7">✦</span></div>';
  html += '</div>';

  // Subtitle bar (magenta/purple matching the app accent)
  html += '<div style="background:#7c3aed;padding:8px 28px;text-align:center;font-size:.8rem;font-weight:800;color:#f3e8ff;letter-spacing:1.3px;text-transform:uppercase">' + lessonTitle + '</div>';

  // Score counter
  html += '<div style="background:var(--bg2);padding:10px 18px 0;text-align:right">';
  html += '<span id="exc-' + lid + '" class="ex-counter" style="font-size:.82rem;color:var(--muted2)">0 correctas · 0 de ' + exs.length + ' respondidas</span>';
  html += '</div>';

  // Questions body
  html += '<div id="ex-wrap-' + lid + '" data-total="' + exs.length + '" style="background:var(--bg2);padding:14px 18px 18px;display:flex;flex-direction:column;gap:12px">';

  exs.forEach(function(ex, i) {
    var eid   = lid + '-x' + i;
    var isTF  = ex[1] === 'TF';
    var hasPlay = Array.isArray(ex[4]) && ex[4].length;
    var exp   = (ex[3] || '').replace(/'/g, '&#39;');
    var sc    = SC[i % SC.length];
    var letter = String.fromCharCode(65 + i); // A, B, C...

    // Section box (colored border + tinted background)
    html += '<div style="border-radius:14px;padding:16px 18px;border:2px solid ' + sc.bc + ';background:' + sc.bg + '">';

    // Section label
    html += '<div style="font-size:.82rem;font-weight:900;text-transform:uppercase;letter-spacing:.8px;color:' + sc.nc + ';margin-bottom:10px">';
    html += letter + '. &nbsp;<span style="opacity:.75;font-weight:600">Pregunta ' + (i + 1) + ' de ' + exs.length + '</span></div>';

    // Question
    html += '<div class="ex-question" style="margin-bottom:14px">' + ex[0] + '</div>';

    // Optional audio button
    if (hasPlay) {
      html += '<button class="btn-play" style="margin-bottom:14px" onclick="playSeq([' + ex[4].join(',') + '],' + (ex[5] || 80) + ')">▶ Escuchar primero</button>';
    }

    // Answer options
    html += '<div class="ex-options">';
    if (isTF) {
      var a = ex[2] ? 0 : 1;
      html += '<button class="ex-opt" onclick="answerExV2(\'' + eid + '\',0,' + a + ',this,\'' + exp + '\')">✓ Verdadero</button>';
      html += '<button class="ex-opt" onclick="answerExV2(\'' + eid + '\',1,' + a + ',this,\'' + exp + '\')">✗ Falso</button>';
    } else {
      ex[1].forEach(function(opt, j) {
        html += '<button class="ex-opt" onclick="answerExV2(\'' + eid + '\',' + j + ',' + ex[2] + ',this,\'' + exp + '\')">' + opt + '</button>';
      });
    }
    html += '</div>';
    html += '<div class="ex-feedback" id="ex-fb-' + eid + '"></div>';
    html += '<div class="ex-explain" id="ex-exp-' + eid + '" style="display:none"></div>';
    html += '</div>'; // section box
  });

  html += '</div>'; // questions body

  // Recuerda footer
  html += '<div style="background:var(--bg3);padding:12px 20px;display:flex;align-items:flex-start;gap:10px;border-top:1px solid rgba(168,85,247,.2)">';
  html += '<span style="font-size:1.2rem;flex-shrink:0">⭐</span>';
  html += '<span style="font-size:.83rem;color:var(--muted2);line-height:1.6"><b style="color:var(--accent)">Recuerda:</b> elige la respuesta que creas correcta. Verás la explicación después de responder. ¡Sin presión, cada error enseña!</span>';
  html += '</div>';

  html += '</div>'; // worksheet container
  return html;
}

// ═══════════════════════════════════════════
// LESSON RENDERER
// ═══════════════════════════════════════════
function renderLesson(id) {
  var fn = LESSONS[id];
  if (!fn) return;
  var html = fn() + pedagogyBlock(id) + renderExercisesBlock(id);
  document.getElementById('lesson-container').innerHTML = html;
  window.scrollTo(0, 0);
  updateSidebar();
  if (_mia.open) { _mia.idx = 0; _mia.planOpen = false; miaRender(); }
  var btn = document.getElementById('btn-complete');
  if (btn) {
    if (isDone(id)) { btn.classList.add('done'); btn.innerHTML = '✓ Completada ✨'; }
    btn.addEventListener('click', function() {
      if (isDone(id)) return;
      markComplete(id);
      btn.classList.add('done');
      btn.innerHTML = '✓ Completada ✨';
    });
  }
}
function loadLesson(id) {
  if (!isUnlocked(id)) return;
  currentLesson = id;
  renderLesson(id);
}

'l1-2':{
  memory:'<b>Do = izquierda de 2 negras. Fa = izquierda de 3 negras.</b> Visualiza: las 2 negras son "las hermanas chicas" y Do es su mamá que las cuida a la izquierda. Las 3 negras son "las hermanas grandes" y Fa es su mamá. Do y Fa son las dos mamás del teclado — siempre cuidan a sus hijas desde la izquierda.',
  neuro:'Tu cerebro construye un mapa espacial del teclado en el hipocampo (la misma región que te permite navegar tu casa en la oscuridad). Con 2-3 semanas de práctica diaria, comenzarás a "sentir" dónde están las notas sin buscarlas conscientemente. Es memoria espacial-musical, no memoria verbal.',
  mistake:'Aprender las notas por posición absoluta ("la tecla número 36 es...") en lugar de por patrón relativo. Las notas no tienen número; tienen vecinos. Siempre ubícalas en relación a Do y Fa. La posición relativa es permanente; la absoluta es inútil.',
  songs:'"Happy Birthday", "Cumpleaños Feliz", "La Bamba", "Twinkle Twinkle Little Star": todas usan Do-Re-Mi-Sol-La dentro de una octava. Con Do y Fa ubicados, ya casi puedes tocarlas.'
},
'l1-3':{
  memory:'<b>Tres palabras: Naranja, Nivel, Tierra.</b> Naranja = dedos curvados como sosteniendo una naranja. Nivel = muñeca nivelada con el antebrazo (ni arriba ni abajo). Tierra = pies planos en el suelo. Chequea estas tres antes de cada sesión.',
  neuro:'La postura correcta activa la cadena kinesiológica óptima del brazo. Una muñeca caída genera tensión en el tendón flexor que puede llegar hasta el codo (síndrome del túnel carpiano). La postura correcta distribuye el peso del brazo al teclado naturalmente, reduciendo la fatiga muscular y el riesgo de lesión desde el primer día.',
  mistake:'Practicar con tensión en hombros y cuello. El piano se toca con el <em>peso del brazo</em>, no con la <em>fuerza del dedo</em>. Si sientes los hombros elevados mientras tocas, para, sacude los brazos como sacudiendo agua, y vuelve a empezar. La tensión no genera velocidad — genera lesión.',
  songs:'Antes de cada concierto, pianistas como Yuja Wang, Lang Lang y Khatia Buniatishvili hacen rituales de preparación corporal invisibles para el público. La postura no es algo que se "aprende" al principio y se olvida — es un hábito diario de por vida.'
},
'l2-1':{
  memory:'<b>Do Central = C4 = MIDI 60 = 261.63 Hz.</b> Ancla numérica: el número 4 de C4 coincide con el dedo 4 (anular). Y 261 suena como "dos-seis-uno" — una contraseña que identifica el centro del piano. Cada vez que toques con el dedo 4, piensa "ese es el número del Do Central".',
  neuro:'Decir el nombre de una nota en voz alta mientras la tocas activa simultáneamente la corteza motora (el movimiento), la corteza auditiva (el sonido) y el área de Broca (el lenguaje). Esta activación trimodal puede acelerar la memorización hasta 4 veces respecto a aprender solo visualmente o solo auditivamente.',
  mistake:'Confundir "Do Central" con "el Do del medio físico del teclado". El Do Central (C4) no está en el centro geométrico del teclado — está en la cuarta octava. Se llama "central" porque es el punto medio del <em>Gran Pentagrama</em>, el sistema de notación. Es el centro teórico, no físico.',
  songs:'"Für Elise" comienza en Mi4 — exactamente 4 teclas blancas a la derecha del Do Central. "Mary Had a Little Lamb" comienza en Mi4 también. El Do Central es el punto de partida para ubicar todo lo que viene después.'
},
'l2-2':{
  memory:'<b>T-T-S-T-T-T-S</b> (Tono-Tono-Semitono-Tono-Tono-Tono-Semitono). Para memorizarlo: canta "Do-Re-MI-Fa-Sol-La-SI-Do" donde MI y SI (en mayúsculas) son los semitonos. Tu voz recuerda lo que el cerebro olvida. Practícalo cantado hasta que salga solo.',
  neuro:'Cantar mientras tocas activa 4 regiones cerebrales simultáneamente: corteza motora (dedos), corteza auditiva (escuchas), área de Broca (cantas) y corteza prefrontal (conectas el patrón). Esta activación cuádruple crea memorias más robustas y duraderas. El aprendizaje multimodal es el más eficiente que existe.',
  mistake:'Memorizar "Do-Re-Mi-Fa-Sol-La-Si" como una lista fija, sin entender la fórmula T-T-S-T-T-T-S. Si solo memorizas la lista, necesitarás memorizar Sol Mayor como otra lista diferente. Si entiendes la fórmula, puedes <em>generar</em> cualquier escala mayor en segundos. Aprende siempre el patrón, no el resultado.',
  songs:'"Do, a Deer" de La Novicia Rebelde te enseñó Do-Re-Mi sin que lo supieras. "Joy to the World" es la escala mayor descendente. "Ode to Joy" usa solo las primeras 5 notas. La escala de Do Mayor es el ADN de miles de canciones que ya conoces.'
},
'l2-3':{
  memory:'<b>Pentacordo MD: dedo 1=Do, 2=Re, 3=Mi, 4=Fa, 5=Sol.</b> Imagen: tu mano derecha es una mano de cartas de poker. El pulgar (el as, dedo 1) sostiene Do, la carta más importante. El meñique (la carta 5) sostiene Sol, la más alejada. Las cartas del medio son Re, Mi, Fa. Baraja esa "mano de cartas" y nunca olvidarás la posición.',
  neuro:'La memoria motora del pentacordo se consolida principalmente durante la fase REM del sueño. Practicar 15-20 minutos antes de dormir y repetir 5 minutos al despertar (antes del teléfono) maximiza la consolidación neurológica. Estudios con músicos muestran hasta 23% de mejora en retención con este timing comparado con práctica solo diurna.',
  mistake:'Practicar el pentacordo a máxima velocidad desde el inicio. La velocidad correcta es aquella en que <em>cada nota suena con igual volumen y duración</em>. Si un dedo golpea más fuerte o más rápido que los otros, estás consolidando la desigualdad. Lento y uniforme siempre supera a rápido y desigual.',
  songs:'"Oda a la Alegría" (Beethoven), "Mary Had a Little Lamb", "Twinkle Twinkle Little Star", "Cumpleaños Feliz": todas viven dentro del pentacordo de Do Mayor. Dominar esta posición es dominar tu primer repertorio real de piezas reconocibles.'
},
'l3-1':{
  memory:'<b>Líneas (abajo→arriba): Mi-Sol-Si-Re-Fa.</b> Frase: "Mi Gato Subió Rápido al Faro". Espacios (abajo→arriba): <b>Fa-La-Do-Mi</b>. Frase: "Fa Llenó De Música". Inventa tus propias frases con esas iniciales — lo más absurdo que puedas. Lo absurdo se recuerda mejor que lo serio.',
  neuro:'La lectura musical activa las mismas redes neuronales que la lectura de lenguaje, pero añade una capa motora simultánea. El cerebro necesita aproximadamente 3 semanas de práctica diaria para pasar de "decodificar nota por nota" a "leer por grupos". No hay atajo neurológico: la consistencia diaria (aunque sea 5 minutos) supera a las sesiones largas ocasionales.',
  mistake:'Contar desde la primera línea (Mi) hacia arriba cada vez que ves una nota. Esto es lento y frustrante. La solución: memoriza tres notas de referencia — Sol4 (2ª línea, donde se enrosca la clave), Si4 (3ª línea, la del medio), Fa5 (5ª línea). Desde esas referencias nunca contarás más de 1-2 posiciones. El reconocimiento directo es 3 veces más rápido que el conteo desde cero.',
  songs:'Toda la música clásica para piano — Beethoven, Mozart, Chopin, Bach — está en pentagrama de Sol (MD) y Fa (MI). Aprender a leer notas te da acceso a siglos de música. Es como aprender el alfabeto: una vez que lo sabes, tienes acceso ilimitado.'
},
'l3-2':{
  memory:'<b>Líneas Fa (abajo→arriba): Sol-Si-Re-Fa-La.</b> Frase: "Gran Barco De Fina Ancla". Espacios: <b>La-Do-Mi-Sol</b> → "Aquí Crece Mi Sonido". El Do Central es siempre la nota flotante en su propia línea adicional entre las dos pentagramas. Si ves una nota sola flotando en el medio, sin dudar: Do Central.',
  neuro:'Aprender dos sistemas de referencia simultáneamente (clave de Sol y Fa) sobrecarga la memoria de trabajo. El enfoque óptimo — respaldado por la psicología cognitiva — es dominar la clave de Sol hasta lectura automática (2-3 semanas de práctica diaria) antes de añadir la clave de Fa. La automatización de la primera libera capacidad cognitiva para aprender la segunda.',
  mistake:'Tratar de leer ambas pentagramas con igual atención al mismo tiempo. En la práctica real, el ojo del pianista alterna entre las dos: lee MD → ejecuta → lee MI → ejecuta. Practicar este escaneo alternado es una habilidad separada que se desarrolla con el tiempo. No fuerces los dos sistemas simultáneos al principio.',
  songs:'El Gran Pentagrama es el formato universal de toda música escrita para piano — desde piezas de jardín de infantes hasta el Concierto para Piano No. 2 de Rachmaninoff. Aprenderlo es aprender el formato de toda la historia del piano escrita.'
},
'l3-3':{
  memory:'<b>Pizza rítmica: Redonda = pizza entera (4 tiempos). Blanca = media pizza (2). Negra = un slice/cuarto (1). Corchea = un octavo (½). Semicorchea = un decimosexto (¼).</b> Cada nivel se divide exactamente a la mitad. La pizza siempre suma 4 — si sobra o falta, hay un error.',
  neuro:'El sentido del ritmo reside en el cerebelo y los ganglios basales, no en la corteza consciente. Por eso el ritmo se aprende mejor con movimiento corporal (palmadas, pie, balanceo) que con lectura intelectual. El cuerpo internaliza los patrones rítmicos antes que la mente los comprende. Mueve el cuerpo: no es afectación, es neurología.',
  mistake:'Aprender el ritmo directamente en el teclado. El piano tiene demasiadas variables simultáneas (posición de manos, lectura de notas, coordinación) como para añadir también el aprendizaje del ritmo. Método óptimo: 1) Palmadas del patrón rítmico hasta automatizarlo, 2) Tocar las notas sin ritmo preciso, 3) Combinar ambos.',
  songs:'4/4 es el "compás común" de pop, rock, reggaetón, cumbia. 3/4 es el vals: "Happy Birthday", "La vie en rose", los minuetos de Bach. 6/8 es el ritmo de muchas nanas y canciones de cuna. Con esta lección puedes analizar el compás de cualquier canción que escuchas.'
},
'l4-1':{
  memory:'<b>Oda a la Alegría MD: dedos 3-3-4-5 / 5-4-3-2 / 1-1-2-3 / 3-2-2.</b> Aprende esta secuencia de números como si fuera un PIN. Repítela mentalmente durante el día — en el bus, en la ducha, antes de dormir. Cuando el patrón de dedos esté en tu mente, los dedos lo seguirán automáticamente.',
  neuro:'La "práctica mental" (visualizar los movimientos sin el instrumento) activa hasta el 80% de las mismas redes neurales que la práctica física. Investigaciones con pianistas muestran mejoras medibles en ejecución después de solo práctica mental. No es fantasear: es entrenamiento cognitivo-motor real que puedes hacer en cualquier lugar.',
  mistake:'Intentar aprender notas, dedos y ritmo al mismo tiempo desde el primer día. Aprende en capas aisladas: Día 1 = solo nombres de notas (cantados sin tocar). Día 2 = notas + dedos (sin metrónomo). Día 3 = notas + dedos + ritmo. Cada capa que se domina sola reduce el tiempo total de aprendizaje de la combinación.',
  songs:'Beethoven compuso la Oda a la Alegría siendo completamente sordo. Al estrenarla en 1824, alguien tuvo que girarlo para que viera los aplausos — no los escuchaba. Es ahora el himno de la Unión Europea. Tus 15 notas llevan esa historia.'
},
'l4-2':{
  memory:'<b>MI: meñique (5) = Do grave, pulgar (1) = Sol.</b> Regla: el dedo más pequeño (meñique) toca la nota más grave. El dedo más grande (pulgar) toca la más aguda. Pequeño = grave. Grande = agudo. Esta regla aplica siempre que la MI toca en posición baja.',
  neuro:'La asimetría de habilidad entre manos es neurológicamente normal: la mano dominante tiene mayor representación en la corteza motora. El piano requiere que la mano no dominante alcance la misma automatización, lo que activa especialmente el cerebelo (aprendizaje motor implícito). Con práctica específica, la asimetría desaparece — no es permanente.',
  mistake:'Tocar la MI al mismo volumen que la MD. La melodía siempre debe dominar sonoramente. Practica deliberadamente tocar la MI al 60-70% del volumen de la MD. El patrón de "MI más fuerte que MD" es el error más universal de los principiantes y uno de los más difíciles de corregir si se consolida.',
  songs:'El patrón Do-Sol que aprendes hoy es la base del acompañamiento de cientos de baladas y canciones folk. Una variación de este patrón acompaña "Yesterday" de los Beatles (simplificado), "El Cóndor Pasa" y decenas de canciones que ya conoces.'
},
'l4-3':{
  memory:'<b>Regla del 50% y los 3 perfectos.</b> Si MD va bien a 80 BPM y MI va bien a 80 BPM, únelas a 40 BPM (mitad). Sube el tempo SOLO cuando el pasaje sale perfecto 3 veces CONSECUTIVAS. No "3 de 5". Tres perfectos seguidos. Esta regla nunca falla.',
  neuro:'El "efecto de interferencia bimanual" es un fenómeno neurológico documentado: cuando coordinas dos movimientos independientes, el cerebro los sincroniza involuntariamente. La única solución es automatizar cada movimiento hasta que no requiera atención consciente. La automatización se logra con repetición precisa y lenta, no con velocidad.',
  mistake:'Practicar los errores repetidamente. Si cometes el mismo error 3 veces seguidas, tu cerebro está aprendiendo ese error como patrón. Para inmediatamente. Aísla el compás. Tócalo 10 veces perfecto y lento. Luego vuelve al tempo original. Los errores practicados a alta velocidad son los más difíciles de corregir después.',
  songs:'La capacidad de tocar con dos manos independientes es lo que hace al piano único: una sola persona puede tocar melodía + armonía + ritmo simultáneamente. Hoy cruzas ese umbral. Todo lo que viene después — incluyendo piezas de cualquier complejidad — usa exactamente el mismo principio que estás aprendiendo ahora.'
},
'l5-1':{
  memory:'<b>Fórmula universal de acorde mayor: 4 semitonos + 3 semitonos.</b> "4 primero, 3 después = Mayor. 3 primero, 4 después = menor." Una regla, todos los acordes. Do Mayor: Do→Mi (4 semitonos), Mi→Sol (3 semitonos). La fórmula funciona desde cualquier nota.',
  neuro:'Los acordes mayores activan respuestas emocionales en el sistema límbico de forma consistente entre culturas. No es aprendizaje cultural: es neurobiología. Las proporciones de frecuencias del acorde mayor (4:5:6) coinciden con armónicos naturales del sonido, y el cerebro los percibe como "consonantes" — una preferencia innata.',
  mistake:'Memorizar los acordes como listas de notas (Do-Mi-Sol, Fa-La-Do) sin internalizar la fórmula 4+3. Si memorizas listas, cada nuevo acorde requiere nueva memorización. Si internalizas 4+3, puedes construir los 12 acordes mayores en tiempo real, en cualquier tonalidad, sin esfuerzo adicional.',
  songs:'"La Bamba" (Do-Fa-Sol), "Johnny B. Goode" (Chuck Berry), todo el blues de 12 compases, decenas de canciones pop y folk: todos usan alguna combinación de I-IV-V. Aprender Do Mayor, Fa Mayor y Sol Mayor te da las herramientas para acompañar cientos de canciones inmediatamente.'
},
'l5-2':{
  memory:'<b>Mayor → Menor = bajar la tercera 1 semitono.</b> Do Mayor (Do-Mi-Sol) → Do menor (Do-Mi♭-Sol). Solo la nota del medio cambia. Todo lo demás queda igual. Es el cambio más pequeño de la música, con el efecto emocional más grande. Un semitono entre "luminoso" y "profundo".',
  neuro:'Los acordes menores activan la ínsula y la amígdala (centros de procesamiento emocional y empático) con mayor intensidad que los mayores. Estudios de neurociencia afectiva confirman que estos cambios son medibles en imágenes de resonancia magnética funcional. La emoción de la música menor no es subjetiva: es fisiológica.',
  mistake:'Tocar acordes menores sin escuchar activamente su carácter emocional. La técnica sin musicalidad es gimnasia. Con cada acorde menor, practica escuchar su "color": ¿es oscuro? ¿íntimo? ¿apasionado? Esta conciencia emocional es lo que separa a un pianista técnico de uno que hace sentir algo al oyente.',
  songs:'"Für Elise" (La menor), "Moonlight Sonata" (Do# menor), "Stairway to Heaven" (La menor), "Smooth Criminal" de Michael Jackson (La menor), "Toccata y Fuga" de Bach (Re menor). Las obras más emotivas de la historia del piano son en tonalidades menores.'
},
'l5-3':{
  memory:'<b>I-IV-V-I = Casa-Viaje-Tensión-Casa.</b> I es el hogar (Do). IV es el viaje (Fa, te alejaste del hogar). V es la tensión (Sol, quieres volver). I es el regreso (Do, llegaste). Esta narrativa emocional de cuatro acordes es el guión de miles de canciones en todas las culturas.',
  neuro:'La resolución V→I genera una respuesta de recompensa en el cerebro: el acorde de Dominante (V) contiene un tritono (Si-Fa en Sol Mayor) que crea tensión armónica. Cuando resuelve al acorde de Tónica (I), esa tensión se libera y el sistema dopaminérgico responde. El "placer musical" tiene base neuroquímica documentada.',
  mistake:'Practicar las progresiones de acordes sin escuchar las transiciones. El punto de una progresión no son los acordes individuales, sino el <em>movimiento</em> entre ellos. Practica cada transición aislada: I→IV, IV→V, V→I, hasta que cada cambio sea fluido antes de tocar la progresión completa.',
  songs:'"Someone Like You" (Adele): I-V-VI-IV. "Don\'t Stop Believin\'" (Journey): I-V-VI-IV. "No Woman No Cry" (Bob Marley): I-V-VI-IV. "Despacito" (primera parte): I-V-VI-IV. La misma progresión en géneros completamente distintos — cuatro acordes que dominan décadas de música popular.'
},
'l6-1':{
  memory:'<b>Escala dinámica = escala de temperatura.</b> pp = agua helada (muy suave). p = fresca. mp = tibia. mf = cálida. f = caliente. ff = hirviendo (muy fuerte). Y crescendo = el agua calentándose gradualmente. Decrescendo = enfriándose. La temperatura de la emoción musical.',
  neuro:'La dinámica en piano se controla con la velocidad de descenso del martillo (el momento del ataque), no con la fuerza sostenida después. El cerebro necesita recalibrar su "modelo motor interno" para traducir intención emocional en velocidad de ataque precisa. Este recalibrado es un proceso consciente que requiere práctica específica de cada nivel dinámico.',
  mistake:'Creer que "tocar fuerte" significa presionar la tecla con fuerza continua. La dinámica ocurre en el primer milisegundo del contacto (el ataque). Después del ataque, más presión no cambia el volumen — el sonido ya está producido. Toda la dinámica del piano es control del ataque, no del sostenimiento.',
  songs:'"Moonlight Sonata" primer movimiento (Beethoven): enteramente en pp. "1812 Overture" (Tchaikovsky): extremos de ff. "Nocturno Op. 9 No. 2" (Chopin): crescendos y decrescendos que cuentan una historia íntima. La dinámica es el alma de estas piezas; sin ella son solo notas correctas.'
},
'l6-2':{
  memory:'<b>Legato = agua fluyendo (sin pausa entre notas). Staccato = gotas cayendo (separadas).</b> Para legato: el dedo A no levanta hasta que el dedo B toca — hay un solapamiento mínimo. Para staccato: toca y rebota inmediatamente, como si la tecla quemara. Agua vs. gotas.',
  neuro:'El legato y el staccato activan circuitos neuromotores distintos en el cerebelo: el legato requiere control inhibitorio (suprimir el movimiento de soltar) mientras el staccato usa impulsos rápidos de ataque y retiro. Son habilidades separadas que necesitan práctica independiente — practicar una no mejora automáticamente la otra.',
  mistake:'Usar el pedal de sustain para imitar el legato en lugar de desarrollar el legato real de dedos. El pedal puede simular la continuidad, pero el legato de dedos es una habilidad técnica más precisa y controlada. Practica legato sin pedal hasta que sea un reflejo, antes de añadir el pedal como herramienta complementaria.',
  songs:'"Clair de Lune" (Debussy): legato etéreo y continuo. "Rondo alla Turca" (Mozart): staccato brillante y juguetón. "Gymnopédie No. 1" (Satie): legato suave y melancólico. La articulación define el carácter de estas piezas tanto como sus notas.'
},
'l6-3':{
  memory:'<b>Orden de sostenidos: Fa-Do-Sol-Re-La-Mi-Si.</b> Frase: "Fa Cocina Sopa De Remolacha Amarilla Muy Sabrosa." Sol Mayor tiene Fa#. Re Mayor tiene Fa#, Do#. La Mayor añade Sol#. Siempre acumulativos, siempre en el mismo orden. El patrón hace todo predecible.',
  neuro:'Comprender el Ciclo de Quintas activa la cognición musical de alto nivel en la corteza prefrontal: reconocimiento de patrones abstractos entre tonalidades. Una vez internalizado, puedes predecir qué notas tendrá cualquier escala, qué acordes sonarán bien en cualquier tonalidad, y entender las modulaciones de cualquier pieza. Es el framework conceptual más eficiente de la teoría musical básica.',
  mistake:'Memorizar cada escala como una lista separada e independiente (Do Mayor: Do-Re-Mi... Sol Mayor: Sol-La-Si...). Las escalas con sostenidos son acumulativas: Re Mayor contiene todos los sostenidos de Sol Mayor más uno. Entender la acumulación hace predecibles todas las escalas sin memorización adicional.',
  songs:'"Canon in D" (Pachelbel): Re Mayor (2 sostenidos, Fa# y Do#). "Imagine" (John Lennon): Do Mayor (0 alteraciones). "Hey Jude" (Beatles): Fa Mayor (1 bemol, Si♭). La tonalidad de una canción no es arbitraria — refleja las notas que sus instrumentos tocan más naturalmente.'
},
'l7-1':{
  memory:'<b>Pentatónica de Do = escala mayor sin el Fa y sin el Si.</b> Visualiza: la escala mayor tiene 7 notas como los 7 días de la semana. La pentatónica "elimina el viernes y el martes" — los días de más tensión — y deja 5 días tranquilos donde todo fluye sin drama armónico.',
  neuro:'La ausencia de semitonos en la pentatónica elimina los "polos de atracción" armónica que crean tensión. Toda nota pentatónica es armónicamente compatible con todos los acordes de la tonalidad — el cerebro no detecta disonancia. Este es el mecanismo neuroacústico detrás de "siempre suena bien": no hay notas que "necesiten resolver".',
  mistake:'Improvisar la pentatónica solo en una octava y en orden ascendente-descendente. La improvisación real mezcla alturas, ritmos, direcciones y silencios. Practica la pentatónica en dos octavas, saltando notas, mezclando direcciones, variando duraciones. La libertad rítmica es tan importante como la selección de notas.',
  songs:'"My Girl" (Temptations): riff completo en pentatónica. "Johnny B. Goode" (Chuck Berry): pentatónica pura. Solos de B.B. King: pentatónica con blue note. "Clocks" (Coldplay): pentatónica. Es la escala más usada en la música popular de los últimos 100 años, en todos los géneros y todas las culturas.'
},
'l7-2':{
  memory:'<b>Relativa menor = 6° grado de la mayor.</b> Do Mayor: Do-Re-Mi-Fa-Sol-<b>La</b>-Si → La menor. Sol Mayor: Sol-La-Si-Do-Re-<b>Mi</b>-Fa# → Mi menor. Atajo: sube 3 semitonos desde cualquier tónica mayor y encuentras su relativa menor. Tres semitonos. Siempre.',
  neuro:'La sensación de "oscuridad" o "profundidad" de los acordes menores tiene base neurobiológica concreta: activan el sistema límbico (procesamiento emocional) con mayor intensidad y duración que los mayores. Las escalas menores armónicas, con su intervalo aumentado (6°→7°), activan circuitos de expectativa y tensión que crean la sensación de "querer llegar" al acorde tónico.',
  mistake:'Confundir La menor natural con La menor armónica. La diferencia es el Sol: natural tiene Sol (natural), armónica tiene Sol# (elevado un semitono). Esa diferencia de un semitono cambia completamente el acorde de dominante: de Mi menor (débil) a Mi Mayor (poderoso). La armonía entera cambia con una nota.',
  songs:'"Für Elise" (Beethoven): La menor. "House of the Rising Sun" (Animals): La menor. "Nothing Else Matters" (Metallica): Mi menor. "Sultans of Swing" (Dire Straits): Re menor. La mayoría de la música más emotiva de la historia usa tonalidades menores.'
},
'l7-3':{
  memory:'<b>El método completo que usarás de por vida: Sección pequeña → Cada mano sola → Juntas muy lento → 3 perfectos → Sube BPM → Repite.</b> Este ciclo aplica a esta pieza, a la siguiente, y a cualquier pieza que toques en 10 años. Aprende el método, no solo la pieza.',
  neuro:'Tocar para otra persona — incluso una pieza simple — activa la "performance anxiety" moderada, que combina la amígdala (amenaza) con la corteza prefrontal (control motor). Este estado de activación moderada mejora significativamente la consolidación de memoria motora. La neurociencia confirma que tocar para audiencias acelera el aprendizaje más que la práctica solitaria.',
  mistake:'Creer que terminar este curso significa que "sabes tocar piano". El curso es el fundamento — el mapa del territorio, no el territorio. Los pianistas profesionales practican 4-8 horas diarias durante décadas. Lo que tienes ahora son las herramientas y el método para comenzar un viaje que puede durar toda la vida.',
  songs:'Tu primera pieza completa — la Oda a la Alegría — fue compuesta por alguien que no podía escuchar una sola nota. Tú que sí puedes escucharla, tócala con gratitud. Tus próximas posibilidades: "Für Elise" simplificada, "Gymnopédie No. 1" (Satie), "River Flows in You" (Yiruma), "Nocturno Op. 9 No. 2" (Chopin). Siglos de música te esperan.'
}

function pedagogyBlock(lid) {
  var p = PEDAGO[lid];
  if (!p) return '';
  var h = '<div class="pedago-section"><div class="section-header"><h2>✦ Potencia tu Aprendizaje</h2><div class="line"></div></div>';
  if (p.memory) h += '<div class="pdg-box pdg-memory"><div class="pdg-lbl">💜 Truco de memorización</div><p>' + p.memory + '</p></div>';
  if (p.neuro)  h += '<div class="pdg-box pdg-neuro"><div class="pdg-lbl">🧠 Neurociencia del aprendizaje</div><p>' + p.neuro + '</p></div>';
  if (p.mistake) h += '<div class="pdg-box pdg-mistake"><div class="pdg-lbl">⚠️ Error más frecuente a evitar</div><p>' + p.mistake + '</p></div>';
  if (p.songs)  h += '<div class="pdg-box pdg-songs"><div class="pdg-lbl">🎵 Conexión con música real</div><p>' + p.songs + '</p></div>';
  h += '</div>';
  return h;
}

var MIA_DATA = {
'l1-1':{tips:['🌙 Las 88 teclas parecen un laberinto, pero el secreto es: solo hay 7 notas distintas (Do-Re-Mi-Fa-Sol-La-Si) que se repiten a lo largo de todo el teclado. El patrón 2-3 de teclas negras es tu brújula permanente.','⚡ Practica esto ahora mismo: cierra los ojos y localiza un grupo de 2 teclas negras con el tacto. Luego un grupo de 3. Repite 10 veces sin mirar. 5 minutos de esto vale más que 1 hora mirando diagramas — el tacto aprende lo que el ojo memoriza.','🧠 Tu corteza visual procesará el patrón 2-3 como una "forma" en menos de 200ms con práctica — igual que reconoces la letra A sin contarla. Es un reflejo que, una vez adquirido, es prácticamente irreversible.','🎹 Chopin practicaba en la oscuridad para entrenar el tacto. Decía: "El piano se toca con los oídos y los dedos, nunca con los ojos." Entrena el tacto desde el día 1 — es la diferencia entre ver el teclado y sentirlo.','✨ En 6 lecciones más, usarás este conocimiento para improvisar tu primera melodía real. Todo comienza con saber dónde está el Do. Esta lección es la raíz de todo lo que viene después.'],plan:['Hoy (10 min): Encuentra todos los Do con ojos cerrados','Mañana: Localiza todos los Fa. Alterna Do y Fa al azar sin mirar','Pasado: Nombra 10 teclas al azar en menos de 3 segundos cada una']},
'l1-2':{tips:['🗺️ Solo 2 reglas para navegar todo el teclado: Do = izquierda del grupo de 2 negras. Fa = izquierda del grupo de 3 negras. Con esas dos reglas puedes encontrar cualquier nota en cualquier piano del mundo.','🔢 Dato que sorprende: hay exactamente 8 Do en un piano de 88 teclas (de Do1 a Do8). El piano termina en Do8, por eso empieza en La0 y no en Do. La asimetría no es accidente: es lo que da exactamente 88 teclas.','🧠 Tu memoria espacial del teclado se construye en el hipocampo — la misma región que te permite navegar tu casa en la oscuridad. Con práctica diaria, el teclado se convierte en territorio familiar que recorres sin pensar.','⚡ Velocidad de lectura: en lugar de contar desde Do, busca siempre el Do o Fa más cercano y cuenta desde ahí. Nunca estarás a más de 3-4 notas de una referencia. Elimina el conteo largo.','🎵 Con Do y Fa ubicados en segundos, puedes encontrar cualquier otra nota por conteo rápido. El teclado entero queda desbloqueado con solo 2 referencias fijas.'],plan:['Hoy: Los 8 Do del teclado, ojos cerrados','Mañana: Los 8 Fa. Luego Mi (la blanca a la derecha de las 2 negras)','Pasado: Quiz: "¿Dónde está Sol?" "¿Dónde está Re?" Menos de 3 seg cada una']},
'l1-3':{tips:['💆 La postura no es una formalidad: los problemas de muñeca y tendinitis comienzan silenciosamente en los primeros meses con postura incorrecta. 5 minutos de atención ahora evitan meses de lesión después.','🍊 El truco de la naranja real: un día, pon una naranja pequeña bajo cada mano. Tu forma de manos se ajustará automáticamente a la posición correcta. 1 minuto así enseña más que 1 hora de instrucciones.','🧠 El dedo 4 (anular) es anatomicamente el más débil: comparte un tendón con el meñique. No es falta de dedicación — es biología. El ejercicio específico: toca 3-4-3-4 manteniendo los otros dedos inmóviles sobre sus teclas.','⚡ Ritual de inicio: sacude las manos sueltas como sacudiendo agua antes de cada práctica. La sensación de peso relajado que queda es exactamente la que quieres mantener mientras tocas. Ese estado corporal es la base de la técnica.','✨ Mantra de postura: "Suave, curvo, libre." Tres palabras antes de tocar. Con el tiempo, tu cuerpo sabrá lo que significan sin que lo pienses.'],plan:['Hoy: 5 min solo postura y sensación corporal (sin tocar notas)','Mañana: Ritual naranja + 1-2-3-4-5-4-3-2-1 suave, atención en igualdad','Pasado: Pentacordo a 60 BPM con metrónomo, atención constante en postura']},
'l2-1':{tips:['🎯 Do Central = C4 = MIDI 60 = 261.63 Hz. Cuatro formas de nombrar la misma nota. Aprende este código y podrás comunicarte con cualquier músico, partitura o software de música del mundo.','🔊 Toca el Do Central y pon la mano suavemente en la tapa del piano. Sientes las 262 vibraciones por segundo. El piano no solo se escucha: se siente. Esta percepción física profundiza la conexión emocional con el instrumento.','🧠 Di el nombre en voz alta mientras tocas: "Do Central". Tacto + oído + voz = tres canales activos simultáneamente. Esta activación trimodal puede acelerar la memorización hasta 4 veces respecto al aprendizaje unimodal.','⚡ El Do Central es el puente entre tus dos manos y entre las dos claves del Gran Pentagrama. No es una nota más — es el centro del sistema de notación musical occidental. Todo se orienta desde él.','🎵 La nota La4 (9 teclas blancas a la derecha del Do Central) vibra a exactamente 440 Hz — la referencia universal de afinación de todos los instrumentos del mundo. El Do Central y el La4 son los dos grandes referentes del piano.'],plan:['Hoy: Localiza Do Central 20 veces con ojos cerrados','Mañana: Do Central → C5 (octava arriba) → C3 (octava abajo). Escucha las octavas.','Pasado: Triple anclaje: toca → di "Do Central" en voz alta → escucha. 10 veces.']},
'l2-2':{tips:['🎼 T-T-S-T-T-T-S es la fórmula que genera todas las escalas mayores. Aprenderla es como aprender el código genético de la música. Con ella puedes construir cualquier escala mayor sin memorizar nada adicional.','🌟 Do Mayor es la única de las 12 escalas mayores que usa solo teclas blancas. Es el "modo fácil" del piano: la fórmula cae exactamente sobre las teclas blancas. Por eso es siempre la primera.','🧠 Canta mientras tocas: "Do-Re-Mi-Fa-Sol-La-Si-Do". Activas 4 regiones cerebrales a la vez. El aprendizaje multimodal es el más eficiente que existe — no es una opinión, está respaldado por décadas de investigación cognitiva.','⚡ Truco visual: los dos semitonos de la escala (Mi-Fa y Si-Do) son los únicos puntos donde dos teclas blancas están juntas SIN tecla negra entre ellas. El teclado te muestra visualmente dónde están los semitonos.','🎵 Julie Andrews te enseñó Do-Re-Mi en "La Novicia Rebelde". "Joy to the World" es la escala mayor descendente. La escala de Do Mayor es el vocabulario de canciones que ya tienes grabadas en tu memoria.'],plan:['Hoy: Escala MD, 10 repeticiones, cantando cada nota en voz alta','Mañana: Escala MI + MD por separado, metrónomo 60 BPM','Pasado: Escala subiendo y bajando, ambas manos juntas, muy lento']},
'l2-3':{tips:['✋ El pentacordo es tu hogar: 5 dedos, 5 notas, posición fija. La mayoría de las primeras piezas viven aquí. Dominar esta posición es dominar tu primer territorio en el teclado.','💪 El dedo 4 (anular) es universal el más débil de todos los pianistas. No es falta de dedicación — es anatomía. Ejercicio específico de fortalecimiento: toca solo 3-4-3-4 manteniendo todos los demás dedos apoyados pero inmóviles.','🧠 Práctica nocturna: el pentacordo 15-20 min antes de dormir, repetido 5 min al despertar (antes del teléfono). La memoria motora se consolida en REM. Este timing puede duplicar la velocidad de aprendizaje comparado con práctica solo diurna.','⚡ El cruce del pulgar (pasar el pulgar por debajo del dedo 3) ocurre en la escala completa, no en el pentacordo. Es una técnica más avanzada. El pentacordo existe precisamente para eliminar ese cruce mientras aprendes la posición básica.','🎵 "Oda a la Alegría", "Mary Had a Little Lamb", "Twinkle Twinkle", "Happy Birthday": todas viven aquí. Ya puedes tocar piezas reconocibles en todo el mundo.'],plan:['Hoy: 1-2-3-4-5-4-3-2-1, 20 repeticiones perfectas y lentas','Mañana: Patrón de independencia: 1-3-2-4-3-5, ambas manos','Pasado: Todo con metrónomo 60 → 70 → 80 BPM (solo si sale perfecto)']},
'l3-1':{tips:['📖 La lectura musical es un segundo idioma. Al principio descifras letra por letra; después de semanas de práctica diaria leerás por "palabras" (grupos). El proceso neurológico toma tiempo real — la consistencia diaria supera las sesiones largas ocasionales.','🧠 Memoriza las notas de REFERENCIA, no todas: Sol4 (2ª línea, donde se enrosca la clave), Si4 (3ª línea, la del medio), Fa5 (5ª línea). Desde esas tres, nunca contarás más de 1-2 posiciones. Elimina el conteo largo desde Mi4.','⚡ Regla de dos pasos: cuando ves una nota, 1) ¿está en línea o en espacio?, 2) ¿qué referencia tengo más cerca? Dos preguntas simples son más rápidas que contar desde cero cada vez.','🎵 El Do Central en la clave de Sol: tiene su propia línea adicional flotante, debajo del pentagrama. Es el único punto del sistema con esa característica visual. Si ves una nota en una pequeña línea debajo del pentagrama de Sol, es Do Central — sin contar, sin dudar.','✨ 5 minutos de lectura en papel (dibuja, escribe, nombra notas al azar) cada día produce más progreso que 30 minutos semanales intensivos. La consistencia es el único "hack" real.'],plan:['Hoy: Dibuja pentagrama y escribe Mi-Sol-Si-Re-Fa en las 5 líneas','Mañana: Agrega Fa-La-Do-Mi en los espacios. Nombra 10 notas al azar','Pasado: Toca 5 notas desde partitura (lee primero, toca después)']},
'l3-2':{tips:['🎹 La clave de Fa sigue la misma lógica que la de Sol, pero en el registro grave. Una vez automatizada la Sol, la Fa toma aproximadamente la mitad del tiempo en aprenderse, por transferencia de estructura.','🌉 El Gran Pentagrama: el Do Central en su línea flotante entre las dos pentagramas es el puente visual. Cuando lo ves en partitura, sabes exactamente en qué tecla está sin contar — es información visual directa.','🧠 Aprende secuencialmente: Sol primero (hasta automatización completa), luego Fa. Intentar ambas claves simultáneamente sobrecarga la memoria de trabajo y hace que las dos se aprendan más lento. La paciencia secuencial es más rápida que la impaciencia simultánea.','⚡ Conexión de patrones: las líneas de la clave de Fa (Sol-Si-Re-Fa-La) tienen la misma estructura relativa que las de Sol (Mi-Sol-Si-Re-Fa), desplazadas un espacio hacia abajo. Si ya sabes Sol, Fa es reconocible como variación del mismo patrón.','🎵 La clave de Fa es el universo del bajo, el cello, el contrabajo, el trombón. Toda la música tiene este registro. Aprenderla te permite leer el "piso" de la armonía musical — lo que da peso y tierra a todo lo demás.'],plan:['Hoy: Memoriza Sol-Si-Re-Fa-La (líneas clave Fa)','Mañana: Dibuja el Gran Pentagrama completo con Do Central','Pasado: Nombra 10 notas de cada clave en menos de 20 segundos totales']},
'l3-3':{tips:['🥁 El ritmo es la mitad de la música que casi nadie practica separado. Las notas dicen qué; el ritmo dice cuándo y cuánto. Sin ritmo, las notas son solo una lista. Con ritmo, se convierten en comunicación.','⏱️ Todo se divide a la mitad: Redonda(4) → Blanca(2) → Negra(1) → Corchea(½) → Semicorchea(¼). Siempre potencias de 2. Una vez que ves la estructura, el sistema rítmico se vuelve completamente predecible.','🧠 El ritmo reside en el cerebelo y los ganglios basales — los mismos centros del movimiento. Por eso el ritmo se aprende mejor con movimiento corporal (palmadas, pie, balanceo) que con lectura intelectual. Mueve el cuerpo: es neurología, no afectación.','⚡ Método de capas: 1) Palmadas del patrón rítmico hasta que sea automático. 2) Toca las notas sin ritmo preciso. 3) Combina los dos. Separar las variables antes de combinarlas reduce el tiempo total de aprendizaje.','🎵 4/4 = pop, rock, reggaetón, cumbia, la mayoría de la música actual. 3/4 = vals, muchas canciones de cuna. 6/8 = ritmo de barco, muchas baladas. Identificar el compás de una canción que escuchas es una habilidad que se entrena con esta lección.'],plan:['Hoy: Palmadas con metrónomo 60 BPM: negras, luego corcheas, luego mixto','Mañana: Escala de Do Mayor: una vez en negras, una vez en corcheas','Pasado: Oda a la Alegría MD contando en voz alta: 1-2-3-4']},
'l4-1':{tips:['🎶 La Oda a la Alegría usa solo 5 notas (Mi, Fa, Sol, Re, Do) y 2 duraciones (negra y blanca). Con la mínima cantidad de recursos musicales, Beethoven creó la melodía más reconocida del mundo. Menos es más.','🎭 Beethoven la compuso completamente sordo. Al estrenarla en 1824, alguien tuvo que girarlo para que viera los aplausos porque no los escuchaba. Cada nota que tocas honra uno de los actos creativos más extraordinarios de la historia.','🧠 Práctica mental: durante el día, visualiza tus dedos tocando la secuencia 3-3-4-5/5-4-3-2/1-1-2-3/3-2-2. Esto activa hasta el 80% de las mismas redes neurales que la práctica física. No es fantasear: es entrenamiento cognitivo-motor real.','⚡ Capas de aprendizaje: Día 1 = solo nombres cantados sin tocar. Día 2 = notas + dedos muy lento. Día 3 = añade ritmo. Dominar cada capa por separado antes de combinarlas reduce el tiempo total a la mitad.','🎵 Reconocerás el mismo rango de notas en muchas canciones: "México Lindo y Querido", partes de "La Bamba", canciones infantiles de todo el mundo. El pentacordo es el vocabulario compartido de la música universal.'],plan:['Hoy: Solo frase 1 (Mi-Mi-Fa-Sol-Sol-Fa-Mi-Re), cantada antes de tocar','Mañana: Frase 1 tocada lenta + primeras 4 notas de frase 2','Pasado: Ambas frases juntas, MD sola, metrónomo 50 BPM']},
'l4-2':{tips:['⚖️ La MI es el cimiento: cuando está bien nadie la nota, cuando falla todo se cae. Como el bajo en una banda — invisible pero esencial. Tu objetivo es una MI tan sólida que sea transparente.','🎹 Regla del 70%: la MI debe sonar al 70% del volumen de la MD. Entrena deliberadamente esta asimetría. El error más universal de principiantes es tocar la MI más fuerte — hay que compensarlo conscientemente.','🧠 Test de automatización: cuando puedas tocar la MI y leer un libro al mismo tiempo sin errores, la has automatizado. Ese es el estándar real. Solo cuando la MI no requiere atención consciente puede añadirse la MD sin interferencia.','⚡ Practica la MI con música que te guste de fondo. Si puedes mantener el patrón mientras tu mente está parcialmente distraída, lo has automatizado. Este método acelera la automatización significativamente.','🎵 El patrón Do-Sol (dedo 5-1) que aprendes hoy es la base del acompañamiento de cientos de baladas. Es el paso más eficiente para principiante: dos notas, máximo contraste, mínimo movimiento. Desde aquí escalan todos los acompañamientos más complejos.'],plan:['Hoy: Do-Sol alternados, 50 BPM, 5 minutos sin parar','Mañana: 60 BPM. Añade Do-Mi-Sol arpegio','Pasado: MI sola hasta poder hacerla mientras piensas en otra cosa']},
'l4-3':{tips:['🧠 El "efecto de interferencia bimanual": el cerebro sincroniza involuntariamente dos movimientos independientes. Solo hay una solución: automatizar cada mano hasta que funcione sin atención consciente. No hay atajos neurológicos.','⏱️ Regla del 50%: MD bien a 80 BPM + MI bien a 80 BPM → juntas a 40 BPM. Parece exagerado. No lo es. El cerebro necesita ese margen para coordinar sin error. Subir lentamente desde 40 BPM es más rápido en total.','🎯 Método inverso: aprende las secciones difíciles PRIMERO. Tienes más recursos cognitivos al inicio de la sesión. Lo difícil al principio, lo fácil para consolidar al final.','⚡ Si cometes el mismo error 3 veces seguidas, PARA. No practiques el error. Reduce el tempo a la mitad, aísla el compás problemático, tócalo 10 veces perfecto. Luego vuelve al tempo completo.','✨ El primer compás que suene con ambas manos — aunque sea lento, aunque sea simple — es un momento que recordarás. Anótalo. Ese instante es el cruce de un umbral que no tiene regreso.'],plan:['Hoy: Compases 1-2 juntos, 40 BPM, 10 repeticiones perfectas','Mañana: Compases 3-4 mismo proceso. Luego 1-4 conectados.','Pasado: Oda a la Alegría completa ambas manos, 50 BPM con metrónomo']},
'l5-1':{tips:['🌟 Do(I)-Fa(IV)-Sol(V) desbloquean cientos de canciones. "La Bamba", "Johnny B. Goode", todo el blues de 12 compases, decenas de canciones pop y folk. No es exageración: este módulo te da las herramientas para acompañar un repertorio enorme.','🔢 Fórmula 4+3: 4 semitonos a la tercera mayor, 3 semitonos a la quinta justa. Con esta fórmula construyes los 12 acordes mayores en tiempo real. Nunca más tendrás que memorizar listas de notas.','🧠 Los acordes tienen personalidad: Do Mayor = luminoso/hogar. Fa Mayor = amplio/solemne. Sol Mayor = expectante (siempre quiere regresar a Do). Escucha activamente esas personalidades — es la base de la expresión armónica.','⚡ Cambio suave entre acordes: busca la nota compartida. Do (Do-Mi-Sol) y Fa (Fa-La-Do) comparten el Do. Mantén ese dedo mientras cambias los otros. El cambio se vuelve mínimo y fluido.','🎵 I-IV-V existía en el blues del Mississippi, el flamenco español y el tango argentino mucho antes de Elvis. Es universal porque las proporciones de frecuencias de estos acordes son matemáticamente simples — el oído humano los percibe como naturales.'],plan:['Hoy: Do Mayor → Fa Mayor → Do Mayor. 60 BPM (sin Sol todavía)','Mañana: I-IV-V-I completo, 50 BPM, sin pausa entre acordes','Pasado: I-IV-V-I a 70 BPM, con arpegio y con bloque']},
'l5-2':{tips:['🌙 Un semitono de diferencia, un universo emocional. Do Mayor (Do-Mi-Sol) → Do menor (Do-Mi♭-Sol). La diferencia es mínima en el teclado; la diferencia emocional es inmensa. Toda la música profunda depende de ese semitono.','🎭 Los acordes menores no son "tristes": son complejos, íntimos, apasionados, misteriosos. La melancolía es solo una de sus múltiples emociones. Escucha con matices — la riqueza emocional de los menores es inagotable.','🧠 Los acordes menores activan el sistema límbico (procesamiento emocional) con mayor intensidad que los mayores. Hay cambios medibles en neuroimagen. La emoción que sientes con la música menor no es subjetiva — es fisiológica.','⚡ I-V-VI-IV (Do-Sol-Lam-Fa): el "VI menor" (La menor) es el momento emotivo de esta progresión. "Someone Like You" (Adele), "Let Her Go" (Passenger)... ese instante de La menor es el corazón emocional de la canción.','🎵 La menor + Re menor + Mi menor son los tres acordes menores naturales de Do Mayor. Con los tres mayores (Do, Fa, Sol) ya tienes 6 acordes: suficiente para acompañar prácticamente cualquier canción popular actual.'],plan:['Hoy: La menor, Re menor, Mi menor — escucha el "color" de cada uno','Mañana: I-V-VI-IV (Do-Sol-Lam-Fa), 50 BPM, ambas manos','Pasado: Improvisa: MI toca I-V-VI-IV en bucle, MD pentatónica libre']},
'l5-3':{tips:['🎵 V→I es la resolución más satisfactoria de la música occidental. Sol→Do: el cerebro libera dopamina en ese momento de llegada. La neuroimagen funcional lo confirma. Por eso la música funciona — tiene base neuroquímica real.','🎸 I-IV-V-I es el fundamento del blues, el rock, el jazz básico y gran parte del pop. Aprender esta progresión es aprender el idioma de un siglo de música popular. Es el vocabulario más eficiente de toda la armonía.','🧠 Las progresiones son narrativas emocionales: I=hogar, IV=viaje, V=tensión/pregunta, I=regreso/respuesta. Cuando escuchas estas progresiones en canciones, el cerebro sigue esa narrativa inconscientemente. Cultiva la conciencia de ese movimiento.','⚡ Transportación inmediata: I-IV-V en Sol Mayor = Sol-Do-Re-Sol. En Fa Mayor = Fa-Si♭-Do-Fa. Los números romanos te permiten transportar al instante — sin aprender nada nuevo, todo lo que sabes se multiplica por 12 tonalidades.','✨ Hoy puedes improvisar: MI toca I-IV-V-I en bucle, MD improvisa con pentatónica de Do en cualquier orden. Eso es jazz básico, blues básico, rock básico. Lo acabas de desbloquear.'],plan:['Hoy: I-IV-V-I completo ambas manos, 50 BPM','Mañana: I-V-VI-IV (Do-Sol-Lam-Fa) completo','Pasado: 3 minutos de improvisación libre sobre I-IV-V-I']},
'l6-1':{tips:['🎭 La dinámica es la actuación: la misma melodía en pp es un susurro íntimo; en ff es un grito de poder. Las notas son el texto. La dinámica es cómo actúas ese texto. Sin dinámica, eres un actor en monotono.','⚡ Control físico: pp se toca con el peso solo del dedo (sin el brazo). ff usa el peso del brazo completo cayendo sobre la tecla. No es fuerza muscular sostenida — es peso y velocidad en el ataque.','🧠 El crescendo interior: siente el aumento de energía en tu cuerpo antes de que suene. El público detecta la intención antes del cambio de volumen. La música empieza en el cuerpo, después en los dedos.','🎵 Beethoven fue el primero en usar extremos dinámicos radicales. Sus contrastes súbitos de p a ff eran tan shockeantes en su época que algunos oyentes se levantaban. La dinámica como arma emocional — eso fue su revolución.','✨ Práctica inmediata: toca la misma escala en pp, luego mf, luego ff. Escucha cómo el carácter cambia completamente con las mismas notas. Esa conciencia dinámica es lo que convierte notas correctas en música real.'],plan:['Hoy: Escala de Do Mayor: pp, luego mf, luego ff. Escucha cada diferencia.','Mañana: Oda a la Alegría con crescendo en frase 1, decrescendo en frase 2','Pasado: Inventa tu propio "mapa de dinámica" para la Oda a la Alegría']},
'l6-2':{tips:['🌊 Legato = agua fluyendo. Staccato = gotas cayendo. Son los dos extremos de la articulación. Todo lo que existe en el piano cae en algún punto del espectro entre estos dos extremos.','✋ Legato real: el dedo A no levanta hasta que el dedo B toca — hay un solapamiento mínimo. Si hay silencio entre notas, no es legato. Practica la transición Mi→Fa lentamente hasta sentir ese solapamiento exacto.','🧠 Legato y staccato activan circuitos neuromotores distintos en el cerebelo. Son habilidades separadas — practicar una no mejora automáticamente la otra. Necesitan entrenamiento específico e independiente.','⚡ Sin pedal primero: practica legato sin el pedal de sustain. El pedal puede imitar la continuidad, pero el legato real de dedos es más preciso y te dará control fino en todas las situaciones posteriores.','🎵 Chopin (maestro del legato cantado) vs. Mozart (maestro del staccato brillante). Escucha ambos. Imitar esos dos mundos es una meta realista que te dará el vocabulario expresivo básico del piano.'],plan:['Hoy: Escala de Do Mayor: una vez legato, una vez staccato. Escucha la diferencia.','Mañana: Oda a la Alegría en legato suave (pp)','Pasado: Oda con articulación mixta según cómo la sientes emocionalmente']},
'l6-3':{tips:['🔑 Orden de sostenidos: Fa-Do-Sol-Re-La-Mi-Si. Sol Mayor tiene Fa#. Re Mayor tiene Fa# y Do#. La Mayor añade Sol#. Siempre acumulativos, siempre en el mismo orden. El patrón hace que todo sea predecible.','🧠 ¿Por qué Sol Mayor necesita Fa#? La fórmula T-T-S exige un TONO entre los grados 6-7. Mi→Fa es solo un semitono. Si no sube a Fa#, la fórmula se rompe. La teoría tiene lógica interna perfecta — siempre hay un "por qué".','⚡ Deducción vs. memorización: una vez que entiendes por qué Sol Mayor tiene Fa#, puedes DEDUCIR por qué Re Mayor tiene Fa# y Do#. La deducción es permanente; la memorización sin comprensión se olvida.','🎵 "Canon in D" (Pachelbel): Re Mayor (2 sostenidos). "Imagine" (Lennon): Do Mayor (0). "Hey Jude" (Beatles): Fa Mayor (1 bemol). La tonalidad de cada canción refleja la lógica musical que aprendes hoy.','✨ Con Sol Mayor y Fa Mayor ya tienes 5 tonalidades (Do, Sol, Re, Fa más La menor relativa). Eso es suficiente para tocar una enorme cantidad de música. Estás construyendo un mapa que se expande con cada lección.'],plan:['Hoy: Sol Mayor MD completa, recordar el Fa#','Mañana: Sol Mayor ambas manos, metrónomo 60 BPM','Pasado: Fa Mayor MD (Si♭). Escucha cómo cambia el color de la tonalidad.']},
'l7-1':{tips:['🌟 Pentatónica de Do = Do-Re-Mi-Sol-La. Sin Fa, sin Si. 5 notas sin semitonos. La razón de que siempre suene bien: sin semitonos, no hay notas que "deban resolver" a otras. Todas flotan libres sobre cualquier acorde.','🌍 La escala más universal del mundo: blues del Mississippi, música tradicional china, música andina, rock and roll, flamenco, koto japonés... Todas usan alguna forma de pentatónica. Es el lenguaje musical más compartido de la humanidad.','🧠 Sin semitonos = sin tensión armónica. El cerebro no detecta disonancia. Toda nota de la pentatónica es compatible con todos los acordes de la tonalidad. Ese es el mecanismo exacto detrás de "siempre suena bien".','⚡ Las teclas negras como pentatónica: toca solo las teclas negras — son la pentatónica de Fa# Mayor. Por eso improvisar solo en negras siempre suena coherente. Una pentatónica completa lista para usar, sin preparación.','🎵 "My Girl" (Temptations), "Johnny B. Goode" (Chuck Berry), solos de B.B. King, "Clocks" (Coldplay): pentatónica pura. Es el vocabulario de décadas de música popular en todos los géneros.'],plan:['Hoy: Memoriza Do-Re-Mi-Sol-La. Toca libre 5 min (cualquier orden, cualquier ritmo)','Mañana: Improvisa sobre I-IV-V-I (MI) con pentatónica (MD), 5 min','Pasado: Graba 2 minutos de improvisación. Escúchate sin juicio.']},
'l7-2':{tips:['🌙 Do Mayor y La menor son la misma escala: las mismas 7 notas, diferente punto de inicio. Es la misma historia narrada desde la perspectiva de otro personaje. Un cambio de perspectiva cambia todo el significado emocional.','🎼 La menor armónica con Sol#: ese semitono crea el intervalo "exótico" Fa→Sol# (un tono y medio), que tiene sabor árabe, flamenco, hebreo. Y armónicamente, permite Mi Mayor como dominante — una cadencia mucho más poderosa que con Sol natural.','🧠 Para encontrar la relativa menor de cualquier tonalidad mayor: baja al 6° grado. Do-Re-Mi-Fa-Sol-La → La es el 6°. Sol-La-Si-Do-Re-Mi → Mi es el 6°. El 6° grado siempre es la relativa. Siempre.','⚡ Tonalidad menor = mundo emocional distinto. Los mismos acordes de Do Mayor, reorganizados desde La menor, crean una música completamente diferente en carácter. El punto de inicio lo cambia todo.','🎵 "Für Elise" (La menor), "Moonlight Sonata" (Do# menor), "Nothing Else Matters" (Mi menor), "House of the Rising Sun" (La menor). Las obras más emotivas de la historia del piano son en tonalidades menores.'],plan:['Hoy: La menor natural MD subiendo y bajando, 60 BPM','Mañana: La menor armónica (con Sol#). Escucha la diferencia con la natural.','Pasado: Improvisa sobre Lam-Fa-Do-Sol (MI) con pentatónica de La menor (MD)']},
'l7-3':{tips:['🏆 Has llegado al último módulo. En 7 módulos pasaste de 88 teclas anónimas a dominar escalas, acordes, progresiones, dinámica y articulación. Eso es un camino extraordinario, y lo recorriste.','🎹 La Oda a la Alegría completa requiere conectar todo: postura, digitación, coordinación bimanual, dinámica y articulación. No es una pieza más — es la síntesis de todo el curso.','🧠 Método Pomodoro para piano: 25 min práctica → 5 min descanso. Dentro de los 25: 5 min técnica/escalas, 5 min acordes, 15 min pieza por secciones. Este ciclo supera en eficiencia a 1 hora continua.','⚡ Próximos pasos concretos: "Für Elise" simplificada → "Gymnopédie No. 1" (Satie) → "River Flows in You" (Yiruma) → "Nocturno Op. 9 No. 2" (Chopin). Cada pieza es un escalón. Las herramientas las tienes.','✨ Toca para alguien hoy. Una pieza simple, tocada con intención, para una persona real. La neurociencia confirma que tocar para audiencias consolida la memoria motora mejor que la práctica solitaria. La música es comunicación — comunícate.'],plan:['Hoy: Oda a la Alegría completa, ambas manos, 50 BPM','Esta semana: Sube 5 BPM por día hasta llegar a 80 BPM','Próximo nivel: Busca "Für Elise simplificada principiantes" y aplica el mismo método']}
};

var _mia = {open:false,idx:0,planOpen:false};
function toggleMia() {
  _mia.open = !_mia.open;
  document.getElementById('mia-float').classList.toggle('mia-open', _mia.open);
  if (_mia.open) { _mia.idx = 0; _mia.planOpen = false; miaRender(); }
}
function miaRender() {
  var d = MIA_DATA[currentLesson];
  if (!d) return;
  var tips = d.tips;
  _mia.idx = Math.max(0, Math.min(_mia.idx, tips.length - 1));
  document.getElementById('mia-tip').innerHTML = tips[_mia.idx];
  document.getElementById('mia-ct').textContent = (_mia.idx + 1) + ' / ' + tips.length;
  var pb = document.getElementById('mia-pl-body');
  if (_mia.planOpen && d.plan) {
    pb.className = 'mia-pl-body open';
    pb.innerHTML = '<ul style="padding-left:16px;margin:6px 0">' + d.plan.map(function(p){return '<li>'+p+'</li>';}).join('') + '</ul>';
  } else {
    pb.className = 'mia-pl-body';
    pb.innerHTML = '';
  }
}
function miaNext() { var d=MIA_DATA[currentLesson]; if(d){_mia.idx=(_mia.idx+1)%d.tips.length; miaRender();} }
function miaPrev() { var d=MIA_DATA[currentLesson]; if(d){_mia.idx=(_mia.idx-1+d.tips.length)%d.tips.length; miaRender();} }
function toggleMiaPlan() { _mia.planOpen=!_mia.planOpen; miaRender(); }

  {t:'Clave de Fa',  cat:'teoria',     d:'Símbolo al inicio del pentagrama inferior del Gran Pentagrama. Indica que las notas son graves (mano izquierda). Su línea de referencia central es el <b>Fa3</b>.'},
  {t:'Clave de Sol', cat:'teoria',     d:'Símbolo al inicio del pentagrama superior del Gran Pentagrama. La espiral de la clave rodea la 2ª línea, que es <b>Sol4</b>. Se usa principalmente para la mano derecha.'},
  {t:'Compás',       cat:'ritmo',      d:'Unidad de tiempo que agrupa los tiempos en grupos regulares. En <b>4/4</b> hay 4 tiempos por compás. En <b>3/4</b> hay 3 (como un vals). Las barras de compás dividen el pentagrama.'},

  {t:'Digitación',   cat:'tecnica',    d:'Numeración de los dedos: 1=pulgar, 2=índice, 3=medio, 4=anular, 5=meñique. La digitación correcta es esencial para tocar fluido, eficiente y sin lesiones.'},

  {t:'Do Central',   cat:'teoria',     d:'El Do ubicado al centro del piano (MIDI 60, C4, 261.63 Hz). Es el punto de referencia del Gran Pentagrama: aparece en una línea adicional flotante entre ambos pentagramas.'},
  {t:'Dominante',    cat:'teoria',     d:'El 5° grado de la escala (Sol en Do Mayor). Su acorde crea tensión que "quiere" resolver a la tónica. La cadencia V→I es la más satisfactoria de la música occidental.'},
  {t:'Escala',       cat:'teoria',     d:'Secuencia de notas ordenadas por altura siguiendo una fórmula de tonos y semitonos. La escala define la "paleta de colores" de una tonalidad. La más común: <b>escala mayor</b>.'},
  {t:'Escala mayor', cat:'teoria',     d:'Escala de 7 notas con la fórmula <b>T-T-S-T-T-T-S</b> (Tono-Tono-Semitono...). Do Mayor usa solo teclas blancas. Su sonido es luminoso y estable.'},
  {t:'Escala menor natural', cat:'teoria', d:'Escala de 7 notas con la fórmula <b>T-S-T-T-S-T-T</b>. La menor relativa de Do Mayor es La menor (mismas notas, diferente tónica). Sonido íntimo y complejo.'},
  {t:'Escala pentatónica', cat:'teoria', d:'Escala de <b>5 notas</b> sin semitonos (Do-Re-Mi-Sol-La en Do Mayor). Cualquier nota suena bien sobre cualquier acorde de la tonalidad. Es el vocabulario universal de la improvisación.'},
  {t:'Forte (f)',    cat:'expresion',  d:'Indicación dinámica: tocar <b>fuerte</b>. Requiere más peso del brazo en el ataque de la tecla. <em>Fortissimo (ff)</em> = muy fuerte. Del italiano "forte" = fuerte.'},
  {t:'Gran Pentagrama', cat:'teoria', d:'El sistema de dos pentagramas unidos (clave de Sol arriba, clave de Fa abajo) usado para escribir música de piano. El Do Central es el puente visual entre ambos.'},

  {t:'Legato',       cat:'expresion',  d:'Articulación en que las notas se tocan unidas y fluidas, sin silencio entre ellas. El dedo B toca antes de que el dedo A levante. Produce una línea melódica cantada y continua.'},

  {t:'Negra',        cat:'ritmo',      d:'Figura rítmica que vale <b>1 tiempo</b> (1 pulso). Es la unidad básica de muchos compases. En 4/4, caben 4 negras por compás. Se dibuja como una cabeza ovalada rellena con palito.'},
  {t:'Notas (nombres)', cat:'teoria', d:'Las 7 notas en español: <b>Do, Re, Mi, Fa, Sol, La, Si</b>. Se repiten cada octava subiendo o bajando. En sistema anglosajón: C, D, E, F, G, A, B.'},
  {t:'Octava',       cat:'teoria',     d:'Intervalo de 12 semitonos que separa dos notas del mismo nombre. El Do4 y el Do5 son una octava. La frecuencia se duplica: Do4 = 261 Hz, Do5 = 522 Hz. El teclado tiene casi 8 octavas.'},
  {t:'Pedal de sustain', cat:'tecnica', d:'El pedal derecho del piano. Mantiene sonando las notas después de soltar las teclas, creando resonancia y profundidad. Debe usarse con cuidado para no empastar las armonías.'},

  {t:'Postura',      cat:'tecnica',    d:'La base de toda técnica pianística: espalda recta, hombros relajados, muñecas al nivel del teclado, dedos curvados como sosteniendo una naranja. Previene lesiones desde el inicio.'},
  {t:'Progresión armónica', cat:'teoria', d:'Secuencia de acordes que crean movimiento armónico. Las más comunes: <b>I-IV-V-I</b> (blues, rock), <b>I-V-VI-IV</b> (pop), <b>II-V-I</b> (jazz). Son narrativas emocionales musicales.'},
  {t:'Redonda',      cat:'ritmo',      d:'Figura rítmica que vale <b>4 tiempos</b> (dura todo un compás de 4/4). Es la nota de mayor duración básica. Se dibuja como un óvalo vacío sin palito.'},
  {t:'Ritmo',        cat:'ritmo',      d:'La organización del tiempo en la música: cuándo suenan las notas y por cuánto tiempo. Es la mitad de la música junto con la melodía/armonía. Reside neurológicamente en el cerebelo.'},
  {t:'Semicorchea',  cat:'ritmo',      d:'Figura rítmica que vale <b>¼ de tiempo</b>. En 4/4 caben 16 semicorcheas por compás. Se dibuja como una corchea con dos banderas/correas en el palito.'},
  {t:'Semitono',     cat:'teoria',     d:'La distancia más pequeña entre dos teclas consecutivas (blanca o negra) del piano. Entre Do y Do# hay 1 semitono. Entre Mi y Fa también hay 1 semitono (sin tecla negra entre ellas).'},
  {t:'Sostenido (#)', cat:'teoria',    d:'Símbolo que sube una nota un semitono. Do# es la tecla negra inmediatamente a la derecha del Do. Puede llamarse también Re♭ (el mismo sonido, diferente nombre).'},
  {t:'Staccato',     cat:'expresion',  d:'Articulación en que las notas se tocan cortas y separadas, con breve silencio entre ellas. Se indica con un punto sobre la nota. Produce un efecto de "gotas" o rebotes.'},
  {t:'Subdominante', cat:'teoria',     d:'El 4° grado de la escala (Fa en Do Mayor). Su acorde aporta movimiento de "alejamiento" de la tónica. La progresión I-IV es el paso armónico más frecuente en la música popular.'},
  {t:'Tempo',        cat:'ritmo',      d:'La velocidad de la música, medida en BPM. Indicaciones comunes: <b>Largo</b> (~50), <b>Andante</b> (~76), <b>Moderato</b> (~100), <b>Allegro</b> (~132), <b>Presto</b> (~180).'},
  {t:'Teclas negras', cat:'teoria',    d:'Las 36 teclas más cortas y elevadas del piano. Aparecen en grupos de <b>2 y 3</b> que se alternan a lo largo de todo el teclado. Tocan los semitonos (sostenidos/bemoles).'},
  {t:'Teclas blancas', cat:'teoria',   d:'Las 52 teclas principales del piano, que tocan las 7 notas naturales (Do, Re, Mi, Fa, Sol, La, Si). El patrón de teclas negras es la brújula para orientarse entre ellas.'},
  {t:'Tercera mayor', cat:'teoria',    d:'Intervalo de <b>4 semitonos</b>. Es el intervalo que define un acorde mayor. Do-Mi es una tercera mayor. Este intervalo tiene un sonido brillante y estable.'},
  {t:'Tercera menor', cat:'teoria',    d:'Intervalo de <b>3 semitonos</b>. Es el intervalo que define un acorde menor. Do-Mi♭ es una tercera menor. Tiene un sonido más íntimo o melancólico que la tercera mayor.'},
  {t:'Tiempo (pulso)', cat:'ritmo',    d:'La unidad básica del ritmo: el "latido" constante de la música. El número superior del compás indica cuántos tiempos hay por compás. Caminar a paso regular = 1 tiempo por paso.'},
  {t:'Tonalidad',    cat:'teoria',     d:'El "centro gravitacional" de una pieza: la nota y escala alrededor de las cuales orbita toda la música. "Do Mayor" usa la escala de Do Mayor como referencia. Hay 12 tonalidades mayores y 12 menores.'},
  {t:'Tónica',       cat:'teoria',     d:'El 1° grado de la escala: la nota "hogar" de la tonalidad. En Do Mayor, la tónica es Do. Toda la música en esa tonalidad gravita hacia ella como punto de reposo y resolución.'},
  {t:'Tono',         cat:'teoria',     d:'Intervalo de <b>2 semitonos</b> (una segunda mayor). Entre Do y Re hay 1 tono. La fórmula T-T-S de la escala mayor usa tonos y semitonos para definir las distancias entre notas.'},
  {t:'Transportar',  cat:'tecnica',    d:'Tocar la misma pieza o progresión en una tonalidad diferente. Si sabes I-IV-V en Do, lo mismo en Sol es Sol-Do-Re. Los números romanos permiten transportar sin memorizar nuevas notas.'},
  {t:'Tríada',       cat:'teoria',     d:'Acorde de <b>3 notas</b>: tónica, tercera y quinta. Es el bloque constructivo básico de la armonía. Do Mayor = Do+Mi+Sol. La menor = La+Do+Mi. Hay 4 tipos: mayor, menor, disminuida, aumentada.'},
  {t:'Quinta justa', cat:'teoria',     d:'Intervalo de <b>7 semitonos</b>. Es el intervalo entre la tónica y el 5° grado de la escala. Do-Sol es una quinta justa. Es el intervalo más consonante después de la octava.'},

var _glos = {open:false, filter:''};
function toggleGlos() {
  _glos.open = !_glos.open;
  document.getElementById('glos-float').classList.toggle('glos-open', _glos.open);
  if (_glos.open) { document.getElementById('glos-q').value=''; _glos.filter=''; glosRender(); setTimeout(function(){document.getElementById('glos-q').focus();},80); }
}
function glosSearch(v) { _glos.filter = v.toLowerCase(); glosRender(); }
function glosToggleItem(idx) {
  var items = document.querySelectorAll('.glos-item');
  items.forEach(function(el,i){ if(i!==idx) el.classList.remove('open'); });
  if(items[idx]) items[idx].classList.toggle('open');
}
function glosRender() {
  var list = document.getElementById('glos-list');
  var filtered = GLOSARIO.filter(function(g){ return !_glos.filter || g.t.toLowerCase().indexOf(_glos.filter)!==-1 || g.d.toLowerCase().indexOf(_glos.filter)!==-1; });
  if (!filtered.length) { list.innerHTML='<div class="glos-empty">No se encontraron términos</div>'; return; }
  list.innerHTML = filtered.map(function(g,i){
    var tag = '<span class="glos-tag '+g.cat+'">'+g.cat+'</span>';
    return '<div class="glos-item" onclick="glosToggleItem('+i+')">'
      +'<div class="glos-term-row"><span class="glos-term">'+g.t+'</span>'+tag+'<span class="glos-arrow">▶</span></div>'
      +'<div class="glos-def">'+g.d+'</div>'
      +'</div>';
  }).join('');
}

// ═══════════════════════════════════════════
// METRONOME
// ═══════════════════════════════════════════
var _metro = {bpm:80, beats:4, subdiv:1, mode:'normal', vol:0.7, playing:false, tick:0, nextTime:0, _raf:null};
function metroClick(beat, isAccent) {
  var ctx = actx();
  var now = ctx.currentTime;
  var buf = ctx.createBuffer(1, ctx.sampleRate * 0.04, ctx.sampleRate);
  var data = buf.getChannelData(0);
  for (var i = 0; i < data.length; i++) {
    data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.008));
  }
  var src = ctx.createBufferSource();
  src.buffer = buf;
  var gain = ctx.createGain();
  gain.gain.value = _metro.vol * (isAccent ? 1.0 : 0.55);
  var bpf = ctx.createBiquadFilter();
  bpf.type = 'bandpass';
  bpf.frequency.value = isAccent ? 1800 : 1100;
  bpf.Q.value = 3;
  src.connect(bpf); bpf.connect(gain); gain.connect(ctx.destination);
  src.start(_metro.nextTime);
  src.stop(_metro.nextTime + 0.04);
}
function metroBeat() {
  if (!_metro.playing) return;
  var ctx = actx();
  var lookahead = 0.12;
  var schedAdv = 0.04;
  while (_metro.nextTime < ctx.currentTime + lookahead) {
    var totalSubdivs = _metro.beats * _metro.subdiv;
    var isAccent = (_metro.tick % totalSubdivs === 0);
    var isBeat = (_metro.tick % _metro.subdiv === 0);
    if (isAccent || isBeat) metroClick(_metro.tick, isAccent);
    var beatDot = _metro.tick % _metro.subdiv === 0 ? Math.floor(_metro.tick / _metro.subdiv) : -1;
    if (beatDot >= 0) {
      (function(dot, beat0) {
        setTimeout(function() {
          document.querySelectorAll('.metro-beat-dot').forEach(function(d, i) {
            d.classList.remove('lit','lit1');
          });
          var dots = document.querySelectorAll('.metro-beat-dot');
          if (dots[dot]) dots[dot].classList.add(dot === 0 ? 'lit1' : 'lit');
        }, Math.max(0, (_metro.nextTime - ctx.currentTime) * 1000));
      })(beatDot % _metro.beats, beatDot);
    }
    var subdivDur = (60 / _metro.bpm) / _metro.subdiv;
    _metro.nextTime += subdivDur;
    _metro.tick++;
    if (_metro.tick >= totalSubdivs) _metro.tick = 0;
  }
  _metro._raf = requestAnimationFrame(metroBeat);
}
function metroToggle() {
  _metro.playing = !_metro.playing;
  var btn = document.getElementById('metro-toggle');
  if (_metro.playing) {
    var ctx = actx();
    _metro.nextTime = ctx.currentTime + 0.05;
    _metro.tick = 0;
    btn.classList.add('active');
    btn.textContent = '■';
    metroBeat();
  } else {
    btn.classList.remove('active');
    btn.textContent = '▶';
    if (_metro._raf) { cancelAnimationFrame(_metro._raf); _metro._raf = null; }
    document.querySelectorAll('.metro-beat-dot').forEach(function(d) { d.classList.remove('lit','lit1'); });
  }
}
function metroSetBPM(v) {
  v = Math.max(40, Math.min(240, Math.round(+v)));
  _metro.bpm = v;
  document.getElementById('metro-bpm-val').value = v;
  document.getElementById('metro-bpm-slider').value = v;
}
function metroSetBeats(n) {
  _metro.beats = n; _metro.tick = 0;
  document.querySelectorAll('[id^="mb-sig-"]').forEach(function(b) { b.classList.remove('sel'); });
  var el = document.getElementById('mb-sig-' + n);
  if (el) el.classList.add('sel');
  initMetroDots();
}
function metroSetSubdiv(n) {
  _metro.subdiv = n; _metro.tick = 0;
  document.querySelectorAll('[id^="mb-sub-"]').forEach(function(b) { b.classList.remove('sel'); });
  var el = document.getElementById('mb-sub-' + n);
  if (el) el.classList.add('sel');
}
function metroSetMode(m) {
  _metro.mode = m;
  document.querySelectorAll('[id^="mb-mode-"]').forEach(function(b) { b.classList.remove('sel'); });
  var el = document.getElementById('mb-mode-' + m);
  if (el) el.classList.add('sel');
}
var _tapTimes = [];
function metroTap() {
  var now = Date.now();
  _tapTimes.push(now);
  if (_tapTimes.length > 6) _tapTimes.shift();
  if (_tapTimes.length > 1) {
    var diffs = [];
    for (var i = 1; i < _tapTimes.length; i++) diffs.push(_tapTimes[i] - _tapTimes[i-1]);
    var avg = diffs.reduce(function(a,b){return a+b;},0) / diffs.length;
    metroSetBPM(Math.round(60000 / avg));
  }
}
function initMetroDots() {
  var cont = document.getElementById('metro-dots');
  cont.innerHTML = '';
  for (var i = 0; i < _metro.beats; i++) {
    var d = document.createElement('div');
    d.className = 'metro-beat-dot' + (i === 0 ? ' beat1' : '');
    cont.appendChild(d);
  }
}
function initMetro() {
  initMetroDots();
}

// ═══════════════════════════════════════════
// MAGIC PARTICLES
// ═══════════════════════════════════════════
var SPARKLE_COLORS = ['#d18af5','#f472b6','#fde68a','#c4b5fd','#fff','#a78bfa'];
var SPARKLE_SYMBOLS = ['✦','✧','⋆','·','✺','✵','✴'];

function addSparkle() {
  // Dot sparkle
  var d = document.createElement('div');
  d.className = 'sparkle-dot';
  var color = SPARKLE_COLORS[Math.floor(Math.random()*SPARKLE_COLORS.length)];
  var size  = (1 + Math.random() * 3).toFixed(1);
  var anim  = Math.random() < 0.5 ? 'sparkle1' : (Math.random() < 0.5 ? 'sparkle2' : 'sparkle3');
  var dur   = (2.5 + Math.random() * 5).toFixed(1);
  var delay = (Math.random() * 6).toFixed(1);
  d.style.cssText =
    'left:' + (Math.random()*98) + 'vw;' +
    'top:' + (Math.random()*96) + 'vh;' +
    'width:' + size + 'px;height:' + size + 'px;' +
    'background:' + color + ';' +
    'box-shadow:0 0 ' + (size*3) + 'px ' + color + ';' +
    'animation:' + anim + ' ' + dur + 's ' + delay + 's ease-in-out infinite;';
  document.body.appendChild(d);
}

function addCrossSparkle() {
  // Symbol sparkle
  var d = document.createElement('div');
  d.className = 'sparkle-cross';
  var sym   = SPARKLE_SYMBOLS[Math.floor(Math.random()*SPARKLE_SYMBOLS.length)];
  var color = SPARKLE_COLORS[Math.floor(Math.random()*SPARKLE_COLORS.length)];
  var sz    = (8 + Math.random() * 10).toFixed(0);
  var dur   = (3 + Math.random() * 5).toFixed(1);
  var delay = (Math.random() * 8).toFixed(1);
  var anim  = Math.random() < 0.5 ? 'sparkle1' : 'sparkle3';
  d.textContent = sym;
  d.style.cssText =
    'left:' + (Math.random()*97) + 'vw;' +
    'top:'  + (Math.random()*94) + 'vh;' +
    'font-size:' + sz + 'px;' +
    'color:' + color + ';' +
    'text-shadow:0 0 8px ' + color + ';' +
    'animation:' + anim + ' ' + dur + 's ' + delay + 's ease-in-out infinite;';
  document.body.appendChild(d);
}
